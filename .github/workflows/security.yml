name: Security

# Three jobs, so the PR says *which* scan found something without anyone
# opening a log: the dependency scan needs nothing but a checkout, so it runs
# alongside the image build instead of queueing behind it, and the gate reads
# both reports once they land.
#
# Every step is a one-line `make` call or GitHub plumbing — the scan, report
# and gate logic lives in the Makefile, so `make trivy-deps` / `make docker &&
# make trivy-image` / `make trivy-gate` reproduce any red check locally.
on:
  push:
    # development as well as main: this is the branch PRs target and merge
    # into, so a merge landing there has to run the same scans the PR did.
    branches: [main, development]
  pull_request:

# Least privilege at the workflow level; the scan jobs declare the extra
# scopes they need, so the gate job stays read-only.
permissions:
  contents: read

# Same rule as ci.yml: a new commit on a PR supersedes the scans of the one
# before it. Its own group, not shared with ci.yml, so cancelling a superseded
# CI run does not take the Security run for that commit down with it.
concurrency:
  group: security-${{ github.ref }}
  # PRs only — see ci.yml. A scan verdict on a trunk commit is a record worth
  # keeping.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    # Findings go to GitHub's code scanning UI as SARIF (Security tab, diff
    # annotations) AND to a PR comment — the SARIF path alone took three clicks
    # (check -> run -> results) to see a finding that is one scroll away in the
    # PR conversation. pull-requests: write is the comment, security-events:
    # write is the SARIF upload.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/trivy-cache

      # Catches what the image scan structurally cannot: a vulnerable module
      # only the test suite imports, so it is never linked into the binary and
      # never appears in a layer.
      - run: make trivy-deps

      # continue-on-error: a fork PR's GITHUB_TOKEN has no security-events
      # write, so this 403s there. The gate job is what decides pass/fail; an
      # upload that can't happen must not fail the scan over it.
      #
      # A category per scan — GitHub keys an analysis on (ref, category), so
      # without it the image upload would replace this one.
      - name: Upload findings to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies

      # Rendered from the SARIF just uploaded, no second scan. Posted before
      # the image scan has even finished, so a PR shows a dependency finding
      # immediately rather than after the whole workflow completes.
      - name: Assemble the PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: make trivy-comment SARIF=trivy-deps.sarif TITLE="Go dependency scan" OUT=trivy-deps-comment.md

      - name: Find the existing PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- sec-scan:trivy-deps -->"

      # continue-on-error: a fork PR's default GITHUB_TOKEN is read-only, so
      # this 403s there even with pull-requests: write declared.
      - name: Comment the report on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: trivy-deps-comment.md
          edit-mode: replace

      # Handed to the gate job, which runs on a different runner. if-no-files-found
      # is deliberately `ignore` and not `error`: a scan that produced nothing
      # should surface as the gate reporting a MISSING report, with both scans'
      # verdicts visible, rather than as a second red check here.
      - name: Hand the report to the gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-deps-sarif
          path: trivy-deps.sarif
          if-no-files-found: ignore

  image-scan:
    name: Image scan
    runs-on: ubuntu-latest
    # Findings go to GitHub's code scanning UI as SARIF (Security tab, diff
    # annotations) AND to a PR comment — the SARIF path alone took three clicks
    # (check -> run -> results) to see a finding that is one scroll away in the
    # PR conversation. pull-requests: write is the comment, security-events:
    # write is the SARIF upload.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/trivy-cache

      # The image the adapter actually ships — `make docker` builds
      # Dockerfile.adapter-with-plugins with the same version build args, so a
      # local `make docker && make trivy-image` scans what this gates on.
      #
      # Trivy reads the base layers plus the Go build info embedded in the
      # binary, including `stdlib` — so a Go toolchain CVE shows up here and
      # nowhere the dependency scan can see.
      - run: make docker IMAGE=network-adapter:${{ github.sha }}
      - run: make trivy-image IMAGE=network-adapter:${{ github.sha }}

      - name: Upload findings to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Assemble the PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: make trivy-comment SARIF=trivy-image.sarif TITLE="Image scan" OUT=trivy-image-comment.md

      - name: Find the existing PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- sec-scan:trivy-image -->"

      - name: Comment the report on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: trivy-image-comment.md
          edit-mode: replace

      - name: Hand the report to the gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: ignore

  security-gate:
    name: Security gate
    needs: [dependency-scan, image-scan]
    # always(): the gate has to run even when a scan job failed, so a failed
    # scan is reported as a missing report rather than skipping the gate
    # entirely. make trivy-gate fails on a missing or unparsable report for
    # exactly this reason.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Checkout is for the Makefile, not the source — this job only reads the
      # two SARIF reports the scan jobs produced.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: trivy-*-sarif
          merge-multiple: true

      - run: make trivy-gate
