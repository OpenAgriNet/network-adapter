name: Security

# The badge on the README and the alert list behind it: what is wrong with the
# trunk today, as opposed to what a PR changed.
#
# The weekly schedule is the point of this file. ci.yml scans every PR, which
# answers "did this diff introduce a vulnerability" — it structurally cannot
# answer "was one published against code nobody has touched since", and that is
# the shape almost every real finding takes. A repo with no PRs for a month is
# a repo with no scans for a month.
#
# Separate from coverage.yml rather than two jobs in one workflow because the
# badge is per-workflow: one file would render a single badge that reads
# "Security failing" when coverage dropped.
on:
  push:
    # See coverage.yml for why these two and not development. Same glob, same
    # reason: naming release-0.0.1 works until 0.0.2 is cut and then fails
    # silently — no error, just a branch nobody is scanning.
    branches: [main, release-*]
  schedule:
    # Monday 03:17 UTC. Off the hour on purpose — GitHub queues scheduled runs
    # hardest at :00, and a scan that starts twenty minutes late is a scan
    # whose result is twenty minutes late.
    #
    # A schedule only ever runs on the DEFAULT branch, whatever the push
    # trigger above lists. Here that is main, which still carries the upstream
    # beckn/beckn-onix history rather than this fork's work — so until the
    # release branch lands there, the weekly run scans a tree that is not what
    # ships. Push-triggered scans of release-* cover the gap, and this becomes
    # correct on its own the moment main catches up.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan the trunk
    runs-on: ubuntu-latest
    # Same budget as ci.yml's security-scan: this builds the plugins image and
    # pulls Trivy's database, so it has two network dependencies that can
    # stall, plus govulncheck fetching the Go vulnerability database.
    timeout-minutes: 30
    # security-events: write is the SARIF upload — the one permission ci.yml's
    # scan job deliberately does not take. See the upload step below for why
    # that is not a contradiction. No pull-requests: write, because this
    # workflow never runs on a pull request and so has no comment to post.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/trivy-cache
      # govulncheck is a Go program installed into bin/, so this job needs a
      # toolchain even though the Trivy half of it does not. go-version-file
      # rather than a literal: the version that matters to govulncheck is the
      # one go.mod requires, because that is the stdlib whose advisories apply.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Both scans, for the reasons ci.yml gives at length: the dependency scan
      # sees a vulnerable module that only the test suite imports and is never
      # linked into a layer, and the image scan sees stdlib CVEs read out of
      # the compiled binary's build info, which the dependency scan cannot
      # reach.
      - run: make trivy-deps

      - run: make docker IMAGE=network-adapter:${{ github.sha }}
      - run: make trivy-image IMAGE=network-adapter:${{ github.sha }}

      # Here the upload IS right, and ci.yml's refusal of it still is too. What
      # it objected to was a third CHECK on a pull request — one that reports
      # "No new alerts in code change" while make trivy-gate fails on the same
      # SARIF, which is exactly what happened on the run that found 20 HIGH
      # stdlib CVEs. This workflow does not run on pull_request, so it posts no
      # PR check and there is no second opinion to disagree with the gate. What
      # ci.yml called the cost of its decision — "no Security-tab history or
      # diff annotations for Trivy" — is paid back here, off the PR path.
      #
      # Two uploads with distinct categories, not one: category is what makes
      # GitHub keep the two analyses side by side. Uploading both under the
      # default category would make each run's second upload supersede its
      # first, and the tab would show whichever scan happened to go last.
      #
      # Before the gates, so the alerts are published even on the runs where
      # something is found — that is precisely the run whose findings someone
      # needs to read.
      - name: Publish the dependency findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

      - name: Publish the image findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Call-graph aware where Trivy is manifest- and layer-level: govulncheck
      # reports a CVE only when the vulnerable symbol is actually reachable
      # from an entry point in this module. It is also the only one of the
      # three that can see a Go toolchain advisory without an image — and it
      # judges the toolchain go.mod requires rather than the one the Dockerfile
      # pins, which are not always the same number. Wired into no workflow, and
      # into no Makefile, until now.
      #
      # continue-on-error on both gates, resolved by the step after them: run
      # them in sequence and the first failure hides the second scan's findings
      # entirely, so a red badge would name one problem while concealing
      # another.
      - name: Gate on the Trivy findings
        id: trivy
        continue-on-error: true
        run: make trivy-gate

      - name: Gate on the govulncheck findings
        id: govulncheck
        continue-on-error: true
        run: make security

      - name: Fail if either scan found something
        if: steps.trivy.outcome == 'failure' || steps.govulncheck.outcome == 'failure'
        run: exit 1
