<text x="60.0" y="-85.4" text-anchor="start" font-size="28" font-weight="400" fill="#1e1e1e">What happens to one request</text>
<text x="60.0" y="-55.8" text-anchor="start" font-size="15" font-weight="400" fill="#868e96">The top half is a capability we have not moved. The bottom half is one we have. The farmer&#x27;s side is identical in both.</text>
<text x="560.0" y="23.8" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">Bharat Vistaar</text>
<text x="560.0" y="41.3" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">agent</text>
<text x="950.0" y="32.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">The V1 Adapter</text>
<text x="1340.0" y="32.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">The old service</text>
<text x="1730.0" y="23.8" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">Mausamgram</text>
<text x="1730.0" y="41.3" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">the provider</text>
<text x="84.0" y="126.2" text-anchor="start" font-size="15" font-weight="400" fill="#2f9e44">FORWARD  ·  the default, and every capability on day one</text>
<text x="584.0" y="168.3" text-anchor="start" font-size="13" font-weight="400" fill="#2f9e44">POST /mobility/search</text>
<text x="974.0" y="226.3" text-anchor="start" font-size="13" font-weight="400" fill="#2f9e44">not moved yet, so forward. Same bytes.</text>
<text x="1364.0" y="284.4" text-anchor="start" font-size="13" font-weight="400" fill="#2f9e44">the old service calls the provider</text>
<text x="1364.0" y="342.4" text-anchor="start" font-size="13" font-weight="400" fill="#2f9e44">provider data</text>
<text x="974.0" y="400.4" text-anchor="start" font-size="13" font-weight="400" fill="#2f9e44">V1 reply</text>
<text x="584.0" y="438.4" text-anchor="start" font-size="13" font-weight="400" fill="#2f9e44">streamed back byte for byte</text>
<text x="84.0" y="530.2" text-anchor="start" font-size="15" font-weight="400" fill="#1971c2">ANSWER  ·  a capability we have moved</text>
<text x="584.0" y="572.4" text-anchor="start" font-size="13" font-weight="400" fill="#1971c2">POST /mobility/search  ·  identical request</text>
<text x="1120.0" y="638.2" text-anchor="middle" font-size="13" font-weight="400" fill="#1e1e1e">already moved</text>
<text x="974.0" y="686.4" text-anchor="start" font-size="13" font-weight="400" fill="#1971c2">it calls the provider itself</text>
<text x="974.0" y="744.4" text-anchor="start" font-size="13" font-weight="400" fill="#1971c2">the same provider data</text>
<text x="584.0" y="802.4" text-anchor="start" font-size="13" font-weight="400" fill="#1971c2">V1 reply it built, byte-identical</text>
<text x="1360.0" y="590.4" text-anchor="start" font-size="13" font-weight="400" fill="#868e96">never touched</text>
</g>
</svg>