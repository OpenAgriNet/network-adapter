<text x="60.0" y="-85.4" text-anchor="start" font-size="28" font-weight="400" fill="#1e1e1e">How a farmer&#x27;s question reaches an answer</text>
<text x="60.0" y="-55.8" text-anchor="start" font-size="15" font-weight="400" fill="#868e96">The same question, the same answer. Only the middle changes, one capability at a time.</text>
<text x="560.0" y="40.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">A farmer asks</text>
<text x="560.0" y="59.2" text-anchor="middle" font-size="15" font-weight="400" fill="#1e1e1e">&quot;Will it rain in my village tomorrow?&quot;</text>
<text x="560.0" y="190.8" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">Bharat Vistaar&#x27;s assistant</text>
<text x="560.0" y="208.3" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">works out it needs a weather forecast</text>
<text x="585.0" y="262.4" text-anchor="start" font-size="13" font-weight="400" fill="#868e96">sends the same Beckn request it has always sent.</text>
<text x="585.0" y="278.6" text-anchor="start" font-size="13" font-weight="400" fill="#868e96">Not one byte of it changed.</text>
<text x="88.0" y="357.1" text-anchor="start" font-size="18" font-weight="400" fill="#1971c2">THE V1 ADAPTER</text>
<text x="88.0" y="378.4" text-anchor="start" font-size="13" font-weight="400" fill="#868e96">the one new piece</text>
<text x="1126.0" y="359.2" text-anchor="start" font-size="16" font-weight="400" fill="#1971c2">THE ONE NEW PIECE</text>
<text x="1126.0" y="391.3" text-anchor="start" font-size="14" font-weight="400" fill="#8a6d00">What it is</text>
<text x="1126.0" y="412.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">A V1-facing protocol adapter. It is a separate</text>
<text x="1126.0" y="434.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">instance of beckn-onix, the adapter V2 already</text>
<text x="1126.0" y="456.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">runs, configured for V1.</text>
<text x="1126.0" y="482.4" text-anchor="start" font-size="13" font-weight="400" fill="#868e96">Same runtime and deploy path as V2, but its own</text>
<text x="1126.0" y="504.4" text-anchor="start" font-size="13" font-weight="400" fill="#868e96">failure domain. It holds no state.</text>
<text x="1126.0" y="541.3" text-anchor="start" font-size="14" font-weight="400" fill="#8a6d00">How it gets into the path</text>
<text x="1126.0" y="562.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">It takes over the address Bharat Vistaar already</text>
<text x="1126.0" y="584.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">calls, and the old service moves behind it. Either</text>
<text x="1126.0" y="606.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">the address is repointed, or one setting changes</text>
<text x="1126.0" y="628.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">in their environment. Agreed once, at the start.</text>
<text x="1126.0" y="654.4" text-anchor="start" font-size="13" font-weight="400" fill="#868e96">After that, moving a capability needs nothing</text>
<text x="1126.0" y="676.4" text-anchor="start" font-size="13" font-weight="400" fill="#868e96">from Bharat Vistaar at all.</text>
<text x="560.0" y="430.2" text-anchor="middle" font-size="16" font-weight="400" fill="#1e1e1e">Has this capability moved yet?</text>
<text x="280.0" y="548.3" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">No, not yet</text>
<text x="280.0" y="583.3" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">hand it to the old service,</text>
<text x="280.0" y="600.8" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">untouched</text>
<text x="840.0" y="548.3" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">Yes</text>
<text x="840.0" y="583.3" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">call the provider and build</text>
<text x="840.0" y="600.8" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">the reply ourselves</text>
<text x="133.0" y="641.4" text-anchor="start" font-size="12" font-weight="400" fill="#868e96">the default, and what anything</text>
<text x="133.0" y="656.4" text-anchor="start" font-size="12" font-weight="400" fill="#868e96">we do not recognise gets</text>
<text x="395.0" y="765.8" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">The old service</text>
<text x="395.0" y="783.3" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">still running, shrinking as we go</text>
<text x="580.0" y="900.8" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">Mausamgram</text>
<text x="580.0" y="918.3" text-anchor="middle" font-size="14" font-weight="400" fill="#1e1e1e">the weather provider, same either way</text>
<text x="580.0" y="1055.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">The same answer, byte for byte</text>
<text x="580.0" y="1074.2" text-anchor="middle" font-size="15" font-weight="400" fill="#1e1e1e">whichever way it travelled</text>
<text x="580.0" y="1205.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">The farmer gets the forecast</text>
<text x="580.0" y="1224.2" text-anchor="middle" font-size="15" font-weight="400" fill="#1e1e1e">and cannot tell which way it went</text>
<text x="1126.0" y="801.2" text-anchor="start" font-size="16" font-weight="400" fill="#2f9e44">WHY THIS IS SAFE</text>
<text x="1126.0" y="832.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">Every capability starts on the left path, so on</text>
<text x="1126.0" y="854.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">day one nothing has changed for anyone.</text>
<text x="1126.0" y="888.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">We move them to the right path one at a time, and</text>
<text x="1126.0" y="910.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">only after the two answers match byte for byte.</text>
<text x="1126.0" y="944.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">If one looks wrong, we change a single line of</text>
<text x="1126.0" y="966.4" text-anchor="start" font-size="13" font-weight="400" fill="#1e1e1e">config and it is back on the left path in seconds.</text>
</g>
</svg>