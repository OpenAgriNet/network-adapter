# Where a request goes when no capability step answered it. Forward mode, and
# the default for anything not bound to a step: ADR-0006.
#
# The endpoints are the old service's own, transcribed from its controller.
# They are enumerated rather than wildcarded because the router matches an
# exact path, and because a list is the inventory of what we are standing in
# front of. A path not listed is a path we did not know existed.
#
# Written without a leading slash: the handler strips it before the lookup, and
# target.url has the endpoint appended back on, so mobility/search becomes
# http://localhost:3000/mobility/search.
#
# NOT COVERED: feedback/:id and submit-feedback/:id take a path parameter an
# exact-match table cannot express. Neither is a Beckn action and neither
# carries a Beckn envelope, so neither reaches this adapter today.
routingRules:
  - domain: "schemes:vistaar"
    version: "1.1.0"
    targetType: "url"
    target:
      url: "http://localhost:3000"
    endpoints:
      - mobility/search
      - mobility/select
      - mobility/init
      - mobility/confirm
      - mobility/rating
      - mobility/status
      - dsep/search
      - dsep/select
      - dsep/init
      - dsep/confirm
      - dsep/rating
      - vistaar-proxy
