<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="2188" viewBox="0 0 1300 2188"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><line x1="1070" y1="110" x2="1070" y2="2148" stroke="#868e96" stroke-width="1" stroke-dasharray="6,5"/><line x1="620" y1="110" x2="620" y2="2148" stroke="#868e96" stroke-width="1" stroke-dasharray="6,5"/><line x1="170" y1="110" x2="170" y2="2148" stroke="#868e96" stroke-width="1" stroke-dasharray="6,5"/><rect x="55" y="60" width="230" height="50" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2" rx="4"/><text x="102.0" y="92" font-family="Helvetica" font-size="17" fill="#1e1e1e">Experience layer</text><rect x="505" y="60" width="230" height="50" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2" rx="4"/><text x="590.2" y="92" font-family="Helvetica" font-size="17" fill="#1e1e1e">Adapter</text><rect x="955" y="60" width="230" height="50" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2" rx="4"/><text x="1044.5" y="92" font-family="Helvetica" font-size="17" fill="#1e1e1e">Portal</text><text x="20" y="36" font-family="Helvetica" font-size="24" fill="#1e1e1e">Grievance — flow of execution</text><line x1="20" y1="174" x2="1250" y2="174" stroke="#1971c2" stroke-width="1" stroke-dasharray="6,5"/><rect x="20" y="158" width="546" height="32" fill="#e7f5ff" stroke="#1971c2" stroke-width="1" rx="4"/><text x="32" y="181" font-family="Helvetica" font-size="15" fill="#1971c2">PM-KISAN only — prove the registration before anything can be filed</text><line x1="176" y1="218" x2="614" y2="218" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="313.1" y="207" font-family="Helvetica" font-size="15" fill="#1e1e1e">1. init (enrolmentId)</text><line x1="626" y1="270" x2="1064" y2="270" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="704.6" y="259" font-family="Helvetica" font-size="15" fill="#1e1e1e">2. send an OTP for that registration</text><line x1="1064" y1="322" x2="626" y2="322" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="704.6" y="311" font-family="Helvetica" font-size="15" fill="#868e96">3. sent — the portal names no number</text><line x1="614" y1="374" x2="176" y2="374" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="149.3" y="363" font-family="Helvetica" font-size="15" fill="#868e96">4. on_init (challengeIssued: method and expiry, no destination)</text><rect x="184" y="440" width="323" height="34" fill="#fff9db" stroke="#f08c00" stroke-width="1" rx="4"/><text x="196" y="463" font-family="Helvetica" font-size="14" fill="#f08c00">farmer reads the SMS and supplies the OTP</text><line x1="20" y1="546" x2="1250" y2="546" stroke="#1971c2" stroke-width="1" stroke-dasharray="6,5"/><rect x="20" y="530" width="219" height="32" fill="#e7f5ff" stroke="#1971c2" stroke-width="1" rx="4"/><text x="32" y="553" font-family="Helvetica" font-size="15" fill="#1971c2">Both — file the grievance</text><rect x="46" y="604" width="1178" height="678" fill="none" stroke="#2f9e44" stroke-width="1" rx="4"/><rect x="46" y="604" width="47" height="28" fill="#ebfbee" stroke="#2f9e44" stroke-width="1" rx="4"/><text x="56" y="623" font-family="Helvetica" font-size="14" fill="#2f9e44">alt</text><text x="58" y="642" font-family="Helvetica" font-size="14" fill="#2f9e44">[PMFBY]</text><line x1="176" y1="688" x2="614" y2="688" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="141.5" y="677" font-family="Helvetica" font-size="15" fill="#1e1e1e">5. support (orderId, the grievance in the channel — no challenge)</text><line x1="626" y1="740" x2="1064" y2="740" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="813.8" y="729" font-family="Helvetica" font-size="15" fill="#1e1e1e">6. lodge</text><line x1="1064" y1="792" x2="626" y2="792" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="782.6" y="781" font-family="Helvetica" font-size="15" fill="#868e96">7. ticket number</text><line x1="614" y1="844" x2="176" y2="844" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="94.7" y="833" font-family="Helvetica" font-size="15" fill="#868e96">8. on_support (orderId echoed back, case.ticketNo, case.status, case.filedOn)</text><line x1="46" y1="902" x2="1224" y2="902" stroke="#2f9e44" stroke-width="1" stroke-dasharray="6,5"/><text x="58" y="918" font-family="Helvetica" font-size="14" fill="#2f9e44">[PM-KISAN]</text><line x1="176" y1="962" x2="614" y2="962" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="129.8" y="951" font-family="Helvetica" font-size="15" fill="#1e1e1e">9. support (orderId, the grievance and the challenge in the channel)</text><line x1="626" y1="1014" x2="1064" y2="1014" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="774.8" y="1003" font-family="Helvetica" font-size="15" fill="#1e1e1e">10. verify the OTP</text><line x1="1064" y1="1066" x2="626" y2="1066" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="798.2" y="1055" font-family="Helvetica" font-size="15" fill="#868e96">11. accepted</text><line x1="626" y1="1118" x2="1064" y2="1118" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="630.5" y="1107" font-family="Helvetica" font-size="15" fill="#1e1e1e">12. lodge (AES-GCM envelope) — the OTP is not forwarded</text><line x1="1064" y1="1170" x2="626" y2="1170" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="786.5" y="1159" font-family="Helvetica" font-size="15" fill="#868e96">13. GrievanceID</text><line x1="614" y1="1222" x2="176" y2="1222" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="90.8" y="1211" font-family="Helvetica" font-size="15" fill="#868e96">14. on_support (orderId echoed back, case.ticketNo, case.status, case.filedOn)</text><line x1="20" y1="1356" x2="1250" y2="1356" stroke="#1971c2" stroke-width="1" stroke-dasharray="6,5"/><rect x="20" y="1340" width="219" height="32" fill="#e7f5ff" stroke="#1971c2" stroke-width="1" rx="4"/><text x="32" y="1363" font-family="Helvetica" font-size="15" fill="#1971c2">Both — read the case back</text><rect x="46" y="1414" width="1178" height="452" fill="none" stroke="#2f9e44" stroke-width="1" rx="4"/><rect x="46" y="1414" width="47" height="28" fill="#ebfbee" stroke="#2f9e44" stroke-width="1" rx="4"/><text x="56" y="1433" font-family="Helvetica" font-size="14" fill="#2f9e44">alt</text><text x="58" y="1452" font-family="Helvetica" font-size="14" fill="#2f9e44">[PMFBY]</text><line x1="176" y1="1498" x2="614" y2="1498" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="227.3" y="1487" font-family="Helvetica" font-size="15" fill="#1e1e1e">15. status (case.ticketNo + applicantPhone)</text><line x1="46" y1="1556" x2="1224" y2="1556" stroke="#2f9e44" stroke-width="1" stroke-dasharray="6,5"/><text x="58" y="1572" font-family="Helvetica" font-size="14" fill="#2f9e44">[PM-KISAN]</text><rect x="184" y="1630" width="367" height="34" fill="#fff9db" stroke="#f08c00" stroke-width="1" rx="4"/><text x="196" y="1653" font-family="Helvetica" font-size="14" fill="#f08c00">a fresh init first — the read is challenged too</text><line x1="176" y1="1702" x2="614" y2="1702" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="196.1" y="1691" font-family="Helvetica" font-size="15" fill="#1e1e1e">16. status (enrolmentId + case.filedOn + challenge)</text><line x1="626" y1="1754" x2="1064" y2="1754" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="774.8" y="1743" font-family="Helvetica" font-size="15" fill="#1e1e1e">17. verify the OTP</text><line x1="1064" y1="1806" x2="626" y2="1806" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="798.2" y="1795" font-family="Helvetica" font-size="15" fill="#868e96">18. accepted</text><line x1="626" y1="1906" x2="1064" y2="1906" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="778.7" y="1895" font-family="Helvetica" font-size="15" fill="#1e1e1e">19. read the case</text><line x1="1064" y1="1958" x2="626" y2="1958" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="653.9" y="1947" font-family="Helvetica" font-size="15" fill="#868e96">20. current status, latest remark if there is one</text><rect x="634" y="2024" width="476" height="34" fill="#fff9db" stroke="#f08c00" stroke-width="1" rx="4"/><text x="646" y="2047" font-family="Helvetica" font-size="14" fill="#f08c00">PM-KISAN returns them all — keep the one matching case.filedOn</text><line x1="614" y1="2096" x2="176" y2="2096" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="110.3" y="2085" font-family="Helvetica" font-size="15" fill="#868e96">21. on_status (case.status, case.remark and case.remarkedOn when present)</text></svg>