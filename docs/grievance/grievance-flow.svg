<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1534" viewBox="0 0 1300 1534"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><line x1="1070" y1="110" x2="1070" y2="1494" stroke="#868e96" stroke-width="1" stroke-dasharray="6,5"/><line x1="620" y1="110" x2="620" y2="1494" stroke="#868e96" stroke-width="1" stroke-dasharray="6,5"/><line x1="170" y1="110" x2="170" y2="1494" stroke="#868e96" stroke-width="1" stroke-dasharray="6,5"/><rect x="55" y="60" width="230" height="50" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2" rx="4"/><text x="99.5" y="92" font-family="Helvetica" font-size="17" fill="#1e1e1e">Experience layer</text><rect x="505" y="60" width="230" height="50" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2" rx="4"/><text x="589.5" y="92" font-family="Helvetica" font-size="17" fill="#1e1e1e">Adapter</text><rect x="955" y="60" width="230" height="50" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2" rx="4"/><text x="1043.5" y="92" font-family="Helvetica" font-size="17" fill="#1e1e1e">Portal</text><text x="20" y="36" font-family="Helvetica" font-size="24" fill="#1e1e1e">Grievance — flow of execution</text><line x1="20" y1="156" x2="1250" y2="156" stroke="#1971c2" stroke-width="1" stroke-dasharray="6,5"/><rect x="20" y="140" width="548" height="32" fill="#e7f5ff" stroke="#1971c2" stroke-width="1" rx="4"/><text x="32" y="163" font-family="Helvetica" font-size="15" fill="#1971c2">PMFBY only — prove the phone before anything can be filed</text><line x1="176" y1="200" x2="614" y2="200" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="301.5" y="189" font-family="Helvetica" font-size="15" fill="#1e1e1e">1. init (applicantPhone)</text><line x1="626" y1="252" x2="1064" y2="252" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="732" y="241" font-family="Helvetica" font-size="15" fill="#1e1e1e">2. send an OTP to that number</text><line x1="1064" y1="304" x2="626" y2="304" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="818" y="293" font-family="Helvetica" font-size="15" fill="#868e96">3. sent</text><line x1="614" y1="356" x2="176" y2="356" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="165" y="345" font-family="Helvetica" font-size="15" fill="#868e96">4. on_init (challengeIssued: method, masked number, expiry)</text><rect x="184" y="394" width="344" height="34" fill="#fff9db" stroke="#f08c00" stroke-width="1" rx="4"/><text x="196" y="417" font-family="Helvetica" font-size="14" fill="#f08c00">farmer reads the SMS and supplies the OTP</text><line x1="20" y1="454" x2="1250" y2="454" stroke="#1971c2" stroke-width="1" stroke-dasharray="6,5"/><rect x="20" y="438" width="253" height="32" fill="#e7f5ff" stroke="#1971c2" stroke-width="1" rx="4"/><text x="32" y="461" font-family="Helvetica" font-size="15" fill="#1971c2">Both — file the grievance</text><line x1="176" y1="498" x2="614" y2="498" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="134" y="487" font-family="Helvetica" font-size="15" fill="#1e1e1e">5. support (orderId, complaint in descriptor, challenge in channel)</text><line x1="626" y1="598" x2="1064" y2="598" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="779" y="587" font-family="Helvetica" font-size="15" fill="#1e1e1e">6. verify the OTP</text><line x1="1064" y1="650" x2="626" y2="650" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="802.5" y="639" font-family="Helvetica" font-size="15" fill="#868e96">7. accepted</text><line x1="626" y1="702" x2="1064" y2="702" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="814" y="691" font-family="Helvetica" font-size="15" fill="#1e1e1e">8. lodge</text><line x1="1064" y1="754" x2="626" y2="754" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="783" y="743" font-family="Helvetica" font-size="15" fill="#868e96">9. ticket number</text><line x1="614" y1="806" x2="176" y2="806" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="75.5" y="795" font-family="Helvetica" font-size="15" fill="#868e96">10. on_support (orderId echoed back, ticketNo on the channel, caseStatus, filedOn)</text><line x1="626" y1="880" x2="1064" y2="880" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="736" y="869" font-family="Helvetica" font-size="15" fill="#1e1e1e">11. lodge (AES-GCM envelope)</text><line x1="1064" y1="932" x2="626" y2="932" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="689" y="921" font-family="Helvetica" font-size="15" fill="#868e96">12. registered — no ticket number issued</text><line x1="614" y1="984" x2="176" y2="984" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="99" y="973" font-family="Helvetica" font-size="15" fill="#868e96">13. on_support (orderId echoed back, no ticket, caseStatus, filedOn, source)</text><rect x="46" y="532" width="1178" height="486" fill="none" stroke="#2f9e44" stroke-width="1" rx="4"/><rect x="46" y="532" width="47" height="28" fill="#ebfbee" stroke="#2f9e44" stroke-width="1" rx="4"/><text x="56" y="551" font-family="Helvetica" font-size="14" fill="#2f9e44">alt</text><text x="58" y="570" font-family="Helvetica" font-size="14" fill="#2f9e44">[PMFBY]</text><line x1="46" y1="836" x2="1224" y2="836" stroke="#2f9e44" stroke-width="1" stroke-dasharray="6,5"/><text x="58" y="852" font-family="Helvetica" font-size="14" fill="#2f9e44">[PM-KISAN]</text><line x1="20" y1="1050" x2="1250" y2="1050" stroke="#1971c2" stroke-width="1" stroke-dasharray="6,5"/><rect x="20" y="1034" width="253" height="32" fill="#e7f5ff" stroke="#1971c2" stroke-width="1" rx="4"/><text x="32" y="1057" font-family="Helvetica" font-size="15" fill="#1971c2">Both — read the case back</text><line x1="176" y1="1142" x2="614" y2="1142" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="247" y="1131" font-family="Helvetica" font-size="15" fill="#1e1e1e">14. status (ticketNo + applicantPhone)</text><line x1="176" y1="1216" x2="614" y2="1216" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="262.5" y="1205" font-family="Helvetica" font-size="15" fill="#1e1e1e">15. status (applicantId + filedOn)</text><rect x="46" y="1076" width="1178" height="174" fill="none" stroke="#2f9e44" stroke-width="1" rx="4"/><rect x="46" y="1076" width="47" height="28" fill="#ebfbee" stroke="#2f9e44" stroke-width="1" rx="4"/><text x="56" y="1095" font-family="Helvetica" font-size="14" fill="#2f9e44">alt</text><text x="58" y="1114" font-family="Helvetica" font-size="14" fill="#2f9e44">[PMFBY]</text><line x1="46" y1="1172" x2="1224" y2="1172" stroke="#2f9e44" stroke-width="1" stroke-dasharray="6,5"/><text x="58" y="1188" font-family="Helvetica" font-size="14" fill="#2f9e44">[PM-KISAN]</text><line x1="626" y1="1282" x2="1064" y2="1282" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="779" y="1271" font-family="Helvetica" font-size="15" fill="#1e1e1e">16. read the case</text><line x1="1064" y1="1334" x2="626" y2="1334" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="654" y="1323" font-family="Helvetica" font-size="15" fill="#868e96">17. current status, officer reply if there is one</text><rect x="634" y="1372" width="478" height="34" fill="#fff9db" stroke="#f08c00" stroke-width="1" rx="4"/><text x="646" y="1395" font-family="Helvetica" font-size="14" fill="#f08c00">PM-KISAN returns them all — keep the one matching filedOn</text><line x1="614" y1="1432" x2="176" y2="1432" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,5" marker-end="url(#ah)"/><text x="134" y="1421" font-family="Helvetica" font-size="15" fill="#868e96">18. on_status (caseStatus, officerReply and repliedOn when present)</text></svg>