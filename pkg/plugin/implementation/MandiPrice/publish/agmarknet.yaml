# agmarknet.yaml -- the pipeline for the MandiPrice / Agmarknet
# catalog publisher.
#
# THIS FILE IS THE PROGRAM. Every block below drives real behaviour; there is
# no Go that duplicates it and no Go to edit instead.
#
#   metadata.capability   checked against the registry's publish action
#   schedule              cron + utcOffset decide when a run is due
#   inputs                resolved flag > env > default
#   upstream              base URL, auth exchange, error classification
#   pipeline              the steps, in order, run by the interpreter
#   catalog               grouping, chunking and the rendered document
#   publish               url / refuseWhen
#   mappings/*.yaml       JSONata, executed by jsonmapper
#
# The engine is catalogpublisher/pipeline. It knows nine primitives and
# nothing about Agmarknet: which calls happen, in what order, against which
# paths, with which mappings, is all here. A second provider copies this file
# and changes its contents, not the engine.

# Which contract this file is held to. LoadSpec validates against it and
# REFUSES a file that does not match, naming the path that is wrong -- so a
# misspelled key is a startup error rather than a rule that silently never
# fires. The contract is catalogpublisher/pipeline/schema/pipeline.v1.schema.json.
schemaRef:
  uses: publish.oan/CatalogPipeline/v1

# Says the same thing as schemaRef, in the Kubernetes style. The engine
# refuses a file where the two disagree rather than preferring one silently.
# NOTE it is publish.oan, not publish.agmarknet: the contract belongs to the
# network, not to whichever provider happens to implement it.
apiVersion: publish.oan/v1
kind: CatalogPipeline
metadata:
  name: mandi-price
  capability: openagrinet:MandiPrice
  provider: agmarknet
  summary: >
    Publishes one Beckn catalog per Indian state, one resource per mandi
    market, carrying the Agmarknet codes a select must send.

# ---------------------------------------------------------------------------
# schedule — how often the crawler's polling layer should run this pipeline.
# Lives here, not in a global crawler setting, so each pipeline owns its own
# cadence.
# ---------------------------------------------------------------------------
schedule:
  # Standard five-field cron: minute hour day-of-month month day-of-week.
  # "0 0 * * *" is every day at midnight. The expression is resolved against
  # `utcOffset`, NOT the host's clock -- a UTC host reading this off its own
  # clock would fire on the wrong calendar day. At midnight "today" is seconds
  # old and has no rows, so the date window below defaults to `yesterday`: the
  # day that just closed.
  #
  # +05:30 is IST, a fixed offset: this network has no daylight saving to
  # track, so there is no IANA zone name here and no zoneinfo database to load.
  cron: "0 0 * * *"
  utcOffset: "+05:30"

# ---------------------------------------------------------------------------
# inputs — the environment surface, resolved env > default. A flag is for a
# standalone run; the crawler has no command line.
# ---------------------------------------------------------------------------
inputs:
  # NO DEFAULT, on purpose.
  #
  # It used to default to a plain-HTTP address at a bare IP. Anyone who ran
  # this without MANDI_API_URI set sent the credential exchange and every
  # later request -- token in the query string -- in cleartext, to whatever
  # answers on that address today. A missing address must fail loudly, not
  # quietly pick an insecure one.
  baseUrl:
    flag: base-url
    env: MANDI_API_URI
  # The window is env-settable, not flag-only: this pipeline runs inside a
  # long-lived server process with no command line, so a flag-only window
  # would be permanently stuck at "yesterday" -- no backfill after an outage, and
  # no way to widen it on a day the mandis are shut (a Sunday returns no rows
  # for every state, which is correct and useless).
  fromDate:
    flag: from
    env: MANDI_FROM_DATE
    type: date
    format: dd-MM-yyyy   # what this upstream reads; not ISO
    default: yesterday
  toDate:
    flag: to
    env: MANDI_TO_DATE
    type: date
    format: dd-MM-yyyy
    default: yesterday
  # Which catalogs a run publishes, from ONE collection:
  #
  #   onDemand  one catalog per state, one resource per market, advertising
  #             what a select can ask for (catalog:mandi-price:MH)
  #   direct    one catalog per state, split in order when it passes the
  #             256-geometry budget; one resource per market and commodity,
  #             carrying its latest price (catalog:mandi-price:MH-current,
  #             then MH-current-2)
  #   both      the two side by side, from the same run
  #
  # Direct costs one upstream call per traded (market, commodity) pair -- the
  # price call has no state-wide form -- so it is the slow half of a run.
  mode:
    flag: publish-mode
    env: MANDI_PUBLISH_MODE
    default: onDemand
    enum: [onDemand, direct, both]
  # The Direct price window: the last week, ending with the day that just
  # closed. A market that reported nothing in it has no Direct resource.
  priceFromDate:
    flag: price-from
    env: MANDI_PRICE_FROM_DATE
    type: date
    format: dd-MM-yyyy
    default: 7 days ago
  priceToDate:
    flag: price-to
    env: MANDI_PRICE_TO_DATE
    type: date
    format: dd-MM-yyyy
    default: yesterday
  # NO DEFAULTS for identity. A guessed participantId publishes under someone
  # else's name, and a guessed networkId makes the catalog visible to the
  # wrong network. `required` refuses the run, naming the variable, rather
  # than publishing under an empty id.
  participantId:
    flag: participant-id
    env: MANDI_PARTICIPANT_ID
    required: true
  networkId:
    flag: network-id
    env: APP_NETWORK_ID
    required: true
  # SHARED by every publish pipeline: all of them post to the same provider
  # adapter's /publish, so one address is set once for the whole crawler.
  publishUrl:
    flag: publish-url
    env: CATALOG_PUBLISH_URL
  tokenUser:
    env: MANDI_TOKEN_USER
    secret: true
  tokenSecret:
    env: MANDI_TOKEN_SECRET
    secret: true

# ---------------------------------------------------------------------------
# upstream — one service, its auth, and how its failures are classified.
# ---------------------------------------------------------------------------
upstream:
  baseUrl: ${inputs.baseUrl}

  # MEASURED, not assumed: this upstream answers on neither 443 nor its own
  # port over https, so there is no TLS to switch to. Until it offers one, the
  # credential exchange and every token afterwards travel in cleartext.
  #
  # Declared here so the exposure is visible in review and in the diff, rather
  # than being the silent consequence of an unset variable. Every run logs a
  # warning while this is set. Remove it the day the upstream supports TLS.
  allowCleartext: true

  auth:
    kind: tokenExchange
    request:
      method: POST
      path: /v1/generate-dynamic-token-agmarknet
      body:
        access_name: ${inputs.tokenUser}
        password: ${inputs.tokenSecret}
    token:
      at: $.token
      # Rides in the query string, not a header, and is added to every call
      # by the engine -- no mapping is given the token, so no JSONata error
      # can quote it.
      carriedAs: query
      name: token
      # The response carries NO expiry field. One token is held for the run
      # and re-exchanged on a 401/403 rather than refreshed on a timer.
      reexchangeOn: [401, 403]

  # Classification, not cosmetics. Recording "no rows" as a failure once
  # turned 27 of 36 states into 27 outages and exited non-zero on a
  # collection that was as complete as the upstream allows.
  errors:
    - when: { status: 400, bodyContains: "No data available." }
      classify: emptyResult
    - when: { status: [401, 403] }
      classify: reauth
    - default: transportError

# ---------------------------------------------------------------------------
# pipeline — ordered steps, each naming what it produces. This IS the call
# sequence: the interpreter runs these in order, and forEach/onError/
# concurrency/when all drive real behaviour. The first six collect the
# markets; the rest build the OnDemand and Direct records `mode` asks for.
# ---------------------------------------------------------------------------
pipeline:
  - id: states
    uses: http.get
    with:
      path: /v1/fetch-agmarknet-master-data
      mapping: mappings/master-states.yaml
    out: states
    failWhenEmpty: "state list resolved to zero states"

  - id: masterMarkets
    uses: http.get
    with:
      path: /v1/fetch-agmarknet-master-data
      mapping: mappings/master-markets.yaml
    out: masterMarkets

  - id: stateRows
    uses: http.get
    forEach: ${states}
    as: state
    concurrency: 1
    with:
      path: /v1/fetch-agmarknet-market-commodity-mapping
      mapping: mappings/market-commodity.yaml
      local:
        stateCode: ${state.code}
        fromDate: ${inputs.fromDate}
        toDate: ${inputs.toDate}
    onError:
      emptyResult: { record: emptyGroups, continue: true }
      transportError: { record: groupErrors, continue: true }
    onEmptyOutput: { record: emptyGroups }
    out: rows

  - id: join
    uses: join
    with:
      left: ${rows}
      right: ${masterMarkets}
      # Quoted because YAML 1.1 readers (PyYAML, and most linters) treat a
      # bare `on` as the boolean true. Go's yaml.v3 is 1.2 and reads it as the
      # string either way, so this costs nothing and stops the file breaking
      # in any tool that is not this engine.
      "on": marketId
      type: left
      carry: [latitude, longitude]
    out: joined

  # The coordinate QUALITY VOCABULARY is gone -- no missing/suspect/
  # outOfBounds verdict field, no annotation, no verdict-based exclusion.
  #
  # What remains is the one thing that is not a classification but a
  # correctness rule: a coordinate that cannot be real is removed, so it is
  # never published as a location. Two cases, both measured in this upstream's
  # own data: lat == lon is a copy-paste defect (and catches 0,0, which is a
  # real place in the Gulf of Guinea), and a point outside India's bounding box
  # did not come from an Indian market.
  #
  # A market whose coordinates are dropped is still PUBLISHED. It simply
  # carries no point, so a proximity search cannot find it -- which is correct,
  # because nobody knows where it is.
  - id: coordinates
    uses: derive
    with:
      field: hasUsableCoordinate
      rules:
        - when: "$not($exists(latitude)) or $not($exists(longitude))"
          value: false
        - when: "latitude = longitude"
          value: false
        - when: "latitude < 6.0 or latitude > 38.0 or longitude < 68.0 or longitude > 98.0"
          value: false
        - value: true
      then:
        - when: "$not(hasUsableCoordinate)"
          clear: [latitude, longitude]
    out: marketsWithCoordinates

  - id: dedupe
    uses: dedupe
    with: { key: marketId }
    out: markets

  # --- From here the two modes part. -------------------------------------
  #
  # Every record says which catalog it belongs in (kind, catalogGroup), what
  # its resource id ends in (resourceKey) and where it sorts when a state is
  # split (orderKey), so the one catalog block below builds both kinds.

  # OnDemand: the markets as they are, tagged. Always built: the Direct half
  # needs the same markets for its codes and coordinates.
  - id: onDemand
    uses: transform
    with:
      left: ${markets}
      mapping: mappings/market-tag.yaml
    out: onDemandRecords

  # Each state's ISO 3166-2 code, from the table in mappings/state-iso.yaml
  # (kept out of the catalog mapping). Joined onto the OnDemand and Direct
  # records below as `isoStateCode`; a state the table does not know simply
  # gets no ISO area.
  - id: stateIso
    uses: transform
    with:
      left: ${states}
      mapping: mappings/state-iso.yaml
    out: stateIso

  - id: onDemandIso
    uses: join
    with:
      left: ${onDemandRecords}
      right: ${stateIso}
      "on": stateCode
      type: left
      carry: [isoStateCode]
    out: onDemandWithIso

  # Direct, step 1: every (market, commodity) the market traded in the
  # window, one record each -- the list the price lookup walks.
  - id: pricePairs
    uses: transform
    when: "${inputs.mode} != 'onDemand'"
    with:
      left: ${markets}
      mapping: mappings/price-pairs.yaml
    out: pricePairs

  # Direct, step 2: price discovery. One call per pair, keeping the latest
  # row. A pair with no price in the window is counted, not failed; a pair
  # the upstream could not answer is counted under priceErrors and the run
  # carries on, so one bad market does not cost a state its catalog.
  - id: prices
    uses: http.get
    when: "${inputs.mode} != 'onDemand'"
    forEach: ${pricePairs}
    as: pair
    concurrency: 1
    with:
      path: /v1/fetch-agmarknet-vistaar
      mapping: mappings/market-price.yaml
      local:
        stateCode: ${pair.stateCode}
        stateName: ${pair.stateName}
        marketId: ${pair.marketId}
        marketName: ${pair.marketName}
        districtId: ${pair.districtId}
        districtName: ${pair.districtName}
        latitude: ${pair.latitude}
        longitude: ${pair.longitude}
        commodityCode: ${pair.commodityCode}
        commodityName: ${pair.commodityName}
        fromDate: ${inputs.priceFromDate}
        toDate: ${inputs.priceToDate}
    onError:
      emptyResult: { record: emptyPrices, continue: true }
      transportError: { record: priceErrors, continue: true }
    onEmptyOutput: { record: emptyPrices }
    out: directRecords

  - id: directIso
    uses: join
    when: "${inputs.mode} != 'onDemand'"
    with:
      left: ${directRecords}
      right: ${stateIso}
      "on": stateCode
      type: left
      carry: [isoStateCode]
    out: directWithIso

  # Both: the two collections side by side. In onDemand or direct mode this
  # step does not run and the collection is whichever half ran last.
  - id: bothModes
    uses: concat
    when: "${inputs.mode} = 'both'"
    with:
      of: ["${onDemandWithIso}", "${directWithIso}"]
    out: collection

# ---------------------------------------------------------------------------
# catalog — from collection to catalog files, chunked to Discovery's
# cumulative 256-geometry-per-catalogId cap.
# ---------------------------------------------------------------------------
catalog:
  # stateCode for an OnDemand market, stateCode-direct for a Direct price, so
  # a state's two kinds are two catalogs, never one.
  groupBy: catalogGroup

  exclude:
    # $number(...) is NOT decoration. Measured against the pinned jsonata
    # build: `$count(commodities) = 0` is FALSE even when commodities is an
    # empty array, so without the wrapper this rule never fires and a market
    # trading nothing is published with zero commodities -- which then fails
    # the catalog's own minItems check at the far end.
    #
    # OnDemand only: a Direct price record carries one commodity, not a
    # `commodities` list, and would otherwise match this rule every time.
    - when: "kind = 'onDemand' and $number($count(commodities)) = 0"
      reason: "upstream reported no commodities trading in this window"
    # A market with no usable coordinate is NOT excluded: it publishes with no
    # point, findable by state and district but by no proximity search.

  # `by` is the order a group is SPLIT in when it exceeds the geometry budget
  # (MH, MH-2). For OnDemand, orderKey is the numeric marketId on purpose: a
  # new market gets a new, higher id and lands in the last chunk, so no market
  # moves between catalogIds -- under MERGE the old copy would never be
  # removed. Direct splits in the same way, by market then commodity, so
  # a state's prices can shift between chunks as pairs come and go; see
  # market-price.yaml.
  # `renderBy` is the order a reader sees inside each catalog.
  order: { by: orderKey, direction: asc, renderBy: [marketName, marketId, commodityName] }

  chunk:
    budget: 256
    # Counts GEOMETRIES, not markets: a market with no point costs nothing,
    # because the cap Discovery enforces is on geometries. This must agree
    # with what the render actually emits as a Point, or a catalog silently
    # goes over the cap and indexes PARTIAL.
    cost: "$exists(latitude) and $exists(longitude) ? 1 : 0"
    # MH and MH-2 for OnDemand; MH-current and MH-current-2 for Direct. A slug
    # becomes a filename, so it cannot carry a colon.
    slug: "${stateCode}${kind = 'direct' ? '-current' : ''}${chunkIndex > 1 ? '-' & chunkIndex : ''}"

  identity:
    catalogId: catalog:mandi-price:${slug}
    # market:<marketId> for OnDemand (unchanged), price:<marketId>:<code>
    # for Direct.
    resourceId: resource:mandi-price:${resourceKey}

  # One mapping per kind of catalog, picked by the records' own `kind` field
  # (set by market-tag.yaml and market-price.yaml): OnDemand and Direct share an
  # envelope and little else, so each has its own file.
  render:
    mappingByField: kind
    mappings:
      onDemand: mappings/catalog-ondemand.yaml
      direct: mappings/catalog-direct.yaml
    local:
      participantId: ${inputs.participantId}
      networkId: ${inputs.networkId}
      catalogSlug: ${slug}
      stateName: ${group.stateName}
      windowFrom: ${inputs.fromDate}
      windowTo: ${inputs.toDate}
      generatedAt: ${now.rfc3339}
      # The schedule zone's offset, so validity timestamps built from the
      # dd-MM-yyyy window say which day they mean (+05:30, not Z).
      utcOffset: ${schedule.utcOffset}
      transactionId: ${uuid}
      messageId: ${uuid}

# ---------------------------------------------------------------------------
# publish — catalog files to the provider adapter's /publish endpoint.
# ---------------------------------------------------------------------------
publish:
  url: ${inputs.publishUrl}/publish
  # Success is fixed, not declared here: ACCEPTED only. A PARTIAL (indexed
  # with pieces missing -- the measured cumulative geometry cap) is a failure.

  # Up to three failed states is an upstream hiccup on a few regions; the
  # rest still publish, and the failures are counted in the report. More than
  # three is not a fair picture of the day, and nothing is published.
  refuseWhen: collection.groupErrors > 3
