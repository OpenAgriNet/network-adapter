# Agmarknet Vistaar price lookup, one (market, commodity) pair per call --
# the Direct half of this pipeline.
#
# The call has no state-wide form: it takes one market, its district and one
# commodity, and answers every price row reported in the window. This mapping
# keeps the LATEST row (newest Arrival Date; on a tie, the highest modal
# price) and turns it into one Direct price record. The other rows for the
# pair -- earlier days, other varieties or grades -- are not published.
#
# What the select path (config/mappings/agmarknet/mandi-price.select.yaml)
# learned about this upstream applies here too, and is followed rather than
# re-learned:
#   - keys are Title Case WITH SPACES (`Modal Price`), hence the backticks;
#   - prices are STRINGS, and an unreported one is a marker ("NR", "-", "");
#   - a row with no usable date, unit or price cannot make a conformant
#     resource, so it is dropped rather than published half-empty.
#
# The pair's own fields come in as _local strings (see price-pairs.yaml); a
# blank latitude or longitude means the market has no usable point.
required:
  - check: |
      $count($match(_local.stateCode, /^[A-Za-z]{2,4}$/)) > 0
    message: "stateCode must be Agmarknet's short alphabetic state code, such as MH"
  - check: |
      $count($match(_local.marketId, /^[0-9]+$/)) > 0
        and $count($match(_local.districtId, /^[0-9]+$/)) > 0
        and $count($match(_local.commodityCode, /^[0-9]+$/)) > 0
    message: "marketId, districtId and commodityCode must be Agmarknet's numeric codes"
  - check: |
      $count($match(_local.fromDate, /^[0-9]{2}-[0-9]{2}-[0-9]{4}$/)) > 0
        and $count($match(_local.toDate, /^[0-9]{2}-[0-9]{2}-[0-9]{4}$/)) > 0
    message: "fromDate and toDate must be dd-MM-yyyy, which is what this upstream reads"

request: |
  {
    "statecode":     _local.stateCode,
    "from_date":     _local.fromDate,
    "to_date":       _local.toDate,
    "commoditycode": _local.commodityCode,
    "districtcode":  _local.districtId,
    "marketcode":    _local.marketId
  }

# One record, wrapped in [...], or [] when no row is usable -- which the step
# counts as an empty pair rather than a failure.
response: |
  (
    /* Always a list: the engine refuses any other answer before this runs
       (an error object would otherwise become one phantom row). Unlike the
       select path, there is no wrapped {data: [...]} form to unwrap here. */
    $records := response;

    /* dd-MM-yyyy to ISO by reordering, not a date library: these are dates
       with no time and no zone. */
    $iso := function($ddmmyyyy) {
      $substring($ddmmyyyy, 6, 4) & "-" & $substring($ddmmyyyy, 3, 2) & "-" & $substring($ddmmyyyy, 0, 2)
    };

    /* A real number, or nothing. $count(...) > 0, not $exists($match(...)):
       $match returns an empty array on no match and $exists([]) is true. */
    $priced := function($value) {
      $type($value) = "number"
        ? $value
        : ($type($value) = "string" and $count($match($trim($value), /^[0-9]+(\.[0-9]+)?$/)) > 0
            ? $number($trim($value)))
    };

    $usable := $filter($records, function($r) {
      $type($r.`Arrival Date`) = "string"
        and $count($match($r.`Arrival Date`, /^[0-9]{2}-[0-9]{2}-[0-9]{4}$/)) > 0
        and $exists($r.`Price Unit`)
        and ($exists($priced($r.`Min Price`))
             or $exists($priced($r.`Max Price`))
             or $exists($priced($r.`Modal Price`)))
    });

    /* Newest first; on the same day, the highest modal price first. The
       comparator answers "should $a come after $b". */
    $latest := $sort($usable, function($a, $b) {
      $iso($a.`Arrival Date`) < $iso($b.`Arrival Date`)
        or ($iso($a.`Arrival Date`) = $iso($b.`Arrival Date`)
            and $priced($a.`Modal Price`) < $priced($b.`Modal Price`))
    })[0];

    $hasPoint := _local.latitude != "" and _local.longitude != "";

    $exists($latest) ? [
      {
        "kind":          "direct",
        /* One group per state, apart from the state's OnDemand one:
           catalog:mandi-price:MH-current beside catalog:mandi-price:MH. A
           state over the 256-geometry budget splits in order (MH-current,
           MH-current-2), as OnDemand does. */
        "catalogGroup":  _local.stateCode & "-direct",
        "resourceKey":   "price:" & _local.marketId & ":" & _local.commodityCode,
        /* The order a state is split in: market, then commodity. Pairs come
           and go week to week, so a split boundary can move and leave a
           resource's old copy behind in its earlier catalog: MERGE never
           removes one. Accepted for a state's one-catalog shape; the old
           copy keeps its own, older price until its validity ends. */
        "orderKey":      $number(_local.marketId) * 100000 + $number(_local.commodityCode),

        "stateCode":     _local.stateCode,
        "stateName":     _local.stateName,
        "marketId":      $number(_local.marketId),
        "marketName":    _local.marketName,
        "districtId":    _local.districtId,
        "districtName":  _local.districtName,
        "latitude":      $hasPoint ? $number(_local.latitude),
        "longitude":     $hasPoint ? $number(_local.longitude),

        "commodityCode": _local.commodityCode,
        "commodityName": _local.commodityName,
        "commodityGroup": $exists($latest.Group) ? $trim($latest.Group),
        "variety":       $exists($latest.Variety) ? $trim($latest.Variety),
        "grade":         $exists($latest.Grade) ? $trim($latest.Grade),

        "arrivalDate":   $iso($latest.`Arrival Date`),
        "minPrice":      $priced($latest.`Min Price`),
        "maxPrice":      $priced($latest.`Max Price`),
        "modalPrice":    $priced($latest.`Modal Price`),
        "priceUnit":     $trim($latest.`Price Unit`)
      }
    ] : []
  )
