        thumbnailImage:
          description: Name of the entity being described
          type: string
          format: uri
        docs:
          description: Links to downloadable business/supporting documents
          type: array
          items:
            $ref: https://schema.nfh.global/Document/v2.0/attributes.yaml#/components/schemas/Document
        mediaFile:
