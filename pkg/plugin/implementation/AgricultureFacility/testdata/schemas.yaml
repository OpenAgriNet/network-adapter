# Every schema the AgricultureFacility v0.1 conformance test needs, as one
# multi-document YAML stream. Nine documents, separated by "---".
#
# Each document is VERBATIM. Only the separators were added, so a document
# extracted from here is byte-identical to what its source URL serves and a
# diff against upstream is empty. Do not reformat, reindent or reorder --
# reformatting is what would make that check meaningless.
#
# The test associates each document with the URI it must be registered under by
# reading its own info.title, so the order here does not matter and no key had
# to be invented.
#
# Fetched 7 Sep 2026.
#
#   info.title                                     source
#   ---------------------------------------------  ----------------------------
#   OpenAgriNet - Agriculture Facility Attributes  OpenAgriNet/network-specs@schema-packs-v0.1
#                                                    schema/AgricultureFacility/v0.1/attributes.yaml
#   OpenAgriNet - Agriculture Resource Attributes  same ref, AgricultureResource/v0.1
#   Address                                        https://schema.beckn.io/Address/v2.0/attributes.yaml
#   Contact                                        https://schema.beckn.io/Contact/v2.0/attributes.yaml
#   Descriptor                                     https://schema.beckn.io/Descriptor/v2.1/attributes.yaml
#   Document                                       https://schema.beckn.io/Document/v2.0/attributes.yaml
#   GeoJSONGeometry                                https://schema.beckn.io/GeoJSONGeometry/v2.0/attributes.yaml
#   Location                                       https://schema.beckn.io/Location/v2.0/attributes.yaml
#   MediaFile                                      https://schema.beckn.io/MediaFile/v2.0/attributes.yaml
#
# The beckn.io URLs 301-redirect to schema.nfh.global. Each is registered under
# BOTH names because the two sides disagree about which to write: the OAN packs
# ref beckn.io, while Location refs its siblings by nfh.global.
#
# To refresh, see the commands in the test's doc comment.
---
openapi: 3.1.1
info:
  title: OpenAgriNet - Agriculture Facility Attributes
  version: 0.1.0
  description: >
    Agricultural facilities that may be discovered through a Provider or
    supplied directly. Combines with AgricultureResource through allOf and
    attaches through resourceAttributes.

components:
  schemas:
    AgricultureFacility:
      type: object
      x-beckn-container: resourceAttributes
      x-jsonld:
        "@context": "https://schemas.openagrinet.global/schema/AgricultureFacility/v0.1/context.jsonld"
        "@type": openagrinet:AgricultureFacility
      allOf:
        - $ref: "../../AgricultureResource/v0.1/attributes.yaml#/components/schemas/AgricultureResource"
        - type: object
          required: ["@type"]
          properties:
            "@type":
              oneOf:
                - type: string
                  const: openagrinet:AgricultureFacility
                - type: array
                  minItems: 2
                  uniqueItems: true
                  contains:
                    const: openagrinet:AgricultureFacility
                  items:
                    oneOf:
                      - const: openagrinet:AgricultureFacility
                      - type: string
                        minLength: 1
                        not:
                          pattern: "^openagrinet:"
              description: Canonical OAN type, optionally accompanied by Provider-defined JSON-LD types.
            supportedFacilityTypes:
              type: array
              minItems: 1
              uniqueItems: true
              description: Facility types the Provider can return on demand.
              items:
                $ref: "#/components/schemas/FacilityType"
              x-jsonld-id: "openagrinet:supportedFacilityTypes"
            facilityType:
              allOf:
                - $ref: "#/components/schemas/FacilityType"
              description: Governed type of the facility represented by a Direct Resource.
              x-jsonld-id: "openagrinet:facilityType"
            location:
              allOf:
                - $ref: "../../AgricultureResource/v0.1/attributes.yaml#/components/schemas/CompleteLocation"
              description: Verified facility geometry and optional address. Do not populate it with the search origin or another inferred point.
              x-jsonld-id: "openagrinet:location"
            address:
              allOf:
                - $ref: "../../AgricultureResource/v0.1/attributes.yaml#/components/schemas/NonEmptyAddress"
              description: Human-readable facility address when verified geometry is unavailable.
              x-jsonld-id: "openagrinet:address"
            services:
              type: array
              minItems: 1
              uniqueItems: true
              description: Services publicly offered at the facility.
              items:
                $ref: "../../AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
              x-jsonld-id: "openagrinet:services"
            capacity:
              allOf:
                - $ref: "#/components/schemas/FacilityCapacity"
              description: Published operating or storage capacity when applicable.
              x-jsonld-id: "openagrinet:capacity"
            publicContact:
              allOf:
                - $ref: "https://schema.beckn.io/Contact/v2.0/attributes.yaml#/components/schemas/Contact"
              description: Public organizational contact explicitly approved by the Provider for catalog publication. Do not use for private personal contact data.
              x-jsonld-id: "openagrinet:publicContact"
            website:
              type: string
              format: uri
              description: Public facility or service website.
              x-jsonld-id: "openagrinet:website"
            source:
              allOf:
                - $ref: "../../AgricultureResource/v0.1/attributes.yaml#/components/schemas/SourceReference"
              description: Provider or authoritative source of the facility record.
              x-jsonld-id: "openagrinet:source"
            lastUpdatedAt:
              type: string
              format: date-time
              description: Time at which the Provider last updated or verified the facility record.
              x-jsonld-id: "openagrinet:lastUpdatedAt"
        - if:
            properties:
              informationMode:
                const: OnDemand
            required: [informationMode]
          then:
            required: [supportedFacilityTypes]
            not:
              anyOf:
                - required: [facilityType]
                - required: [location]
                - required: [address]
                - required: [services]
                - required: [capacity]
                - required: [publicContact]
                - required: [website]
                - required: [source]
                - required: [lastUpdatedAt]
        - if:
            properties:
              informationMode:
                const: Direct
            required: [informationMode]
          then:
            required: [facilityType, source]
            anyOf:
              - required: [location]
              - required: [address]

    FacilityType:
      type: string
      description: Governed agriculture facility category. SoilTestingFacility covers a Soil Health Centre or Soil Testing Laboratory that provides soil-testing services.
      enum: [CustomHiringCentre, KrishiVigyanKendra, Warehouse, SoilTestingFacility]

    FacilityCapacity:
      type: object
      required: [value, unit]
      properties:
        value:
          type: number
          minimum: 0
          description: Numeric capacity value.
          x-jsonld-id: "openagrinet:value"
        unit:
          type: string
          minLength: 1
          description: Governed or source unit, such as metric tonne.
          x-jsonld-id: "openagrinet:unit"
        basis:
          type: string
          minLength: 1
          description: Capacity basis when required, such as total storage or daily throughput.
          x-jsonld-id: "openagrinet:capacityBasis"
      additionalProperties: false
---
openapi: 3.1.1
info:
  title: OpenAgriNet - Agriculture Resource Attributes
  version: 0.1.0
  description: >
    Shared agriculture attributes for information published on OpenAgriNet.
    Attaches to beckn:Resource through resourceAttributes.

components:
  schemas:
    AgricultureResource:
      type: object
      x-beckn-container: resourceAttributes
      x-jsonld:
        "@context": "https://schemas.openagrinet.global/schema/AgricultureResource/v0.1/context.jsonld"
        "@type": openagrinet:AgricultureResource
      required: [informationMode]
      properties:
        informationMode:
          type: string
          enum: [OnDemand, Direct]
          description: Whether obtaining specific information requires a Provider invocation or the Resource already contains or directly references that information.
          x-jsonld-id: "openagrinet:informationMode"
        subjectCategories:
          type: array
          minItems: 1
          uniqueItems: true
          description: Optional broad agricultural subjects used for discovery. The Resource type is expressed by @type, not repeated here.
          items:
            type: string
            enum: [Crop, Livestock, Weather, Market, Scheme, Practice]
          x-jsonld-id: "openagrinet:subjectCategories"
        agricultureSubjects:
          type: array
          minItems: 1
          uniqueItems: true
          description: Optional governed subjects such as a named crop, livestock species, pest, or scheme. Absence means the Resource applies broadly within subjectCategories.
          items:
            $ref: "#/components/schemas/AgricultureSubjectReference"
          x-jsonld-id: "openagrinet:agricultureSubjects"
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          description: BCP 47 language tags supported by or present in the Resource.
          items:
            type: string
            minLength: 2
          x-jsonld-id: "openagrinet:languages"
        coverageAreas:
          type: array
          minItems: 1
          uniqueItems: true
          description: Geographic areas within which the Resource applies. Each item is either an administrative area reference or a GeoJSON geometry.
          items:
            oneOf:
              - $ref: "#/components/schemas/AdministrativeAreaReference"
              - $ref: "#/components/schemas/CompleteGeoJSONGeometry"
          x-jsonld-id: "openagrinet:coverageAreas"

    AdministrativeAreaReference:
      type: object
      description: A governed administrative or postal area identified within a stated code system. Use a GeoJSON geometry instead when coverage is defined by coordinates.
      required: [codeScheme, areaCode]
      properties:
        codeScheme:
          type: string
          minLength: 1
          description: Geographic code system, such as ISO-3166-1, ISO-3166-2, LGD, or IN-PIN.
          x-jsonld-id: "openagrinet:areaCodeScheme"
        areaCode:
          type: string
          minLength: 1
          description: Area identifier in the stated scheme.
          x-jsonld-id: "openagrinet:areaCode"
        areaLevel:
          type: string
          enum: [Country, State, District, Block, Village, PostalCode, Other]
          description: Administrative or postal level represented by the code when known.
          x-jsonld-id: "openagrinet:areaLevel"
        areaName:
          type: string
          minLength: 1
          description: Optional human-readable area name.
          x-jsonld-id: "openagrinet:areaName"
      additionalProperties: false

    AgricultureSubjectReference:
      type: object
      description: Stable reference to a governed agriculture subject and its human-readable Beckn descriptor.
      required: [subjectId, subjectType, descriptor]
      properties:
        subjectId:
          type: string
          format: uri
          description: Stable identifier from a governed agriculture taxonomy.
          x-jsonld-id: "openagrinet:subjectId"
        subjectType:
          type: string
          enum: [Crop, Livestock, Commodity, Pest, Disease, Practice, Scheme, Market]
          description: Kind of agricultural subject referenced by subjectId.
          x-jsonld-id: "openagrinet:subjectType"
        descriptor:
          $ref: "#/components/schemas/IdentifiedDescriptor"
          description: Beckn descriptor carrying the governed code and display name.
          x-jsonld-id: "https://schema.beckn.io/descriptor"
      additionalProperties: false

    SourceReference:
      type: object
      description: Reference to the authoritative upstream source of information.
      required: [sourceId]
      properties:
        sourceId:
          type: string
          minLength: 1
          description: Stable identifier of the upstream source.
          x-jsonld-id: "openagrinet:sourceId"
        sourceName:
          type: string
          minLength: 1
          description: Human-readable source name.
          x-jsonld-id: "openagrinet:sourceName"
        sourceUri:
          type: string
          format: uri
          description: Authoritative public or Provider-supplied source URI.
          x-jsonld-id: "openagrinet:sourceUri"
      additionalProperties: false

    TimePeriod:
      type: object
      description: Inclusive validity or applicability period.
      minProperties: 1
      properties:
        startsAt:
          type: string
          format: date-time
          description: Start of the period.
          x-jsonld-id: "openagrinet:startsAt"
        endsAt:
          type: string
          format: date-time
          description: End of the period.
          x-jsonld-id: "openagrinet:endsAt"
      additionalProperties: false

    ClosedTimePeriod:
      allOf:
        - $ref: "#/components/schemas/TimePeriod"
        - type: object
          required: [startsAt, endsAt]
      description: A bounded applicability period with both start and end timestamps. Conformance also verifies that startsAt is not after endsAt.

    IdentifiedDescriptor:
      allOf:
        - $ref: "https://schema.beckn.io/Descriptor/v2.1/attributes.yaml#/components/schemas/Descriptor"
        - type: object
          anyOf:
            - required: [code]
            - required: [name]
      description: A Beckn Descriptor with at least a machine-readable code or human-readable name.

    CompleteGeoJSONGeometry:
      allOf:
        - $ref: "https://schema.beckn.io/GeoJSONGeometry/v2.0/attributes.yaml#/components/schemas/GeoJSONGeometry"
        - oneOf:
            - type: object
              properties:
                type:
                  const: GeometryCollection
              required: [type, geometries]
            - type: object
              properties:
                type:
                  enum: [Point, LineString, Polygon, MultiPoint, MultiLineString, MultiPolygon]
              required: [type, coordinates]
      description: A GeoJSON geometry that includes coordinates, or geometries for a GeometryCollection.

    NonEmptyAddress:
      allOf:
        - $ref: "https://schema.beckn.io/Address/v2.0/attributes.yaml#/components/schemas/Address"
        - type: object
          minProperties: 1
      description: A Beckn postal address containing at least one address field.

    CompleteLocation:
      allOf:
        - $ref: "https://schema.beckn.io/Location/v2.0/attributes.yaml#/components/schemas/Location"
        - type: object
          required: [geo]
          properties:
            geo:
              $ref: "#/components/schemas/CompleteGeoJSONGeometry"
            address:
              $ref: "#/components/schemas/NonEmptyAddress"
      description: A Beckn Location with a complete GeoJSON geometry and an optional non-empty address.
---
openapi: 3.1.1
info:
  title: Address
  version: 2.0.0
  description: "Container schemas fetched from beckn.yaml. This cannot be extended as it is a reserved schema in beckn protocol. Any additional properties added to this schema can only be made using its *Attributes property"
  license:
    name: CC-BY-NC-SA 4.0 International
  contact:
    name: Beckn Labs
    url: https://beckn.io
components:
  schemas:
    Address:
      x-iri: https://schema.nfh.global/Address/v2.0
      description: '**Postal address** aligned with schema.org `PostalAddress`. Use for human-readable addresses. Geometry lives in `Location.geo` as GeoJSON.'
      title: Address
      type: object
      properties:
        addressCountry:
          description: Country name or ISO-3166-1 alpha-2 code.
          type: string
          example: IN
        addressLocality:
          description: City/locality.
          type: string
          example: Bengaluru
        addressRegion:
          description: State/region/province.
          type: string
          example: Karnataka
        extendedAddress:
          description: Address extension (apt/suite/floor, C/O).
          type: string
          example: Apt 4B
        postalCode:
          description: Postal/ZIP code.
          type: string
          example: '560001'
        streetAddress:
          description: Street address (building name/number and street).
          type: string
          example: 123 Tech Street
      additionalProperties: false
      x-tags:
      - common
---
openapi: 3.1.1
info:
