# reference-pipeline.yaml — the file a NEW capability provider copies.
#
# It publishes a fictional `example:ThingPrice`: a provider that exposes a list
# of REGIONS, a list of ITEMS inside each region, and a reference list of
# coordinates. Nothing here is real. Every noun is deliberately neutral so a
# weather, advisory, soil-health or logistics provider can see their own shape
# in it without first translating somebody else's domain.
#
# WHY THIS FILE EXISTS AT ALL
#
# Three artifacts have to agree: this YAML, the Go structs in spec.go, and the
# JSON Schema in schema/pipeline.v1.schema.json. A key can live in the schema
# but not the struct (it validates, then silently vanishes at parse time), or in
# the struct but not the schema (the engine would read it, but the file is
# refused). Neither mistake is caught by validating a provider's own file,
# because a provider's file does not use every key.
#
# This one does. It sets EVERY key the contract allows, so the test that loads
# it catches a drift between the three the day it is introduced, rather than the
# day a provider first reaches for the key that was quietly dropped.
#
# That is also why a few keys below are marked NOT READ YET. They are in the
# contract and in the struct, and the runner does not consult them. They are
# spelled out here so the coverage test sees them; a real provider deletes them,
# because a file that states a rule nothing performs is worse than a file that
# says nothing.
#
# HOW TO USE IT: see README.md next to this file.

# Which contract this file is written against. The engine resolves the id to a
# schema it embeds and refuses an id it does not carry, naming the ones it does
# -- so a file written against a future contract fails loudly on an old binary
# instead of being held to rules it was never written for.
schemaRef:
  uses: publish.oan/CataloguePipeline/v1

# The same statement in Kubernetes' vocabulary, kept because everyone reading
# this file already knows that shape. It is CHECKED against schemaRef.uses, not
# preferred over it: two fields saying the same thing is a standing invitation
# to disagree, and a reader cannot tell which one the engine obeys.
apiVersion: publish.oan/v1
kind: CataloguePipeline

metadata:
  # Names the catalogue files on disk. THREE things must agree on it: the
  # builder that writes <name>-<slug>.json, the sweep that deletes the previous
  # run's files, and the glob the publish step posts from. Change it in one
  # place and yesterday's catalogues get republished as though they were today's.
  name: example-thing-price

  # The run's identity. The run log and the output directory are keyed on it,
  # and the engine refuses to start if the collector that owns this file claims
  # a different capability -- which is what stops one provider's pipeline from
  # quietly publishing under another's code.
  capability: example:ThingPrice

  provider: example-data-service
  summary: >
    Publishes one catalogue per region, one resource per item, carrying the
    upstream codes a select must send back.

# Where this package sits, so the integrity check can find the pair without a
# path hardcoded anywhere else: the directory exists, this file parses, every
# `mapping:` below resolves under mappingsDir, and every `uses:` is a primitive
# the engine implements.
#
# NOT READ YET by the engine -- the crawler locates a pipeline through the
# registry's publish action instead. Keep it true anyway; it is what a reader
# uses to find the mappings.
discover:
  path: pkg/plugin/implementation/catalogpublisher/pipeline/reference/
  mappingsDir: mappings/

schedule:
  # Standard FIVE fields: minute hour day-of-month month day-of-week. The
  # six-field seconds variant is refused, because the two are indistinguishable
  # by shape: a pasted six-field expression would run every hour while looking
  # like it runs once a day, and nobody would notice until the upstream
  # throttled.
  #
  # 01:30 rather than 00:00 on purpose: an upstream that rolls its own day at
  # midnight is still writing it when a midnight job asks for it.
  cron: "30 1 * * *"

  # An IANA zone. The cron is resolved HERE, never on the host's clock. A UTC
  # host reading a 01:30 Asia/Kolkata schedule off its own clock fires on the
  # wrong calendar day and asks the upstream for yesterday -- a failure that
  # looks exactly like an upstream with stale data.
  timezone: Asia/Kolkata

# Where this pipeline's provider/capability binding comes from. A run that
# cannot confirm the binding must not publish under it.
#
# NOT READ YET by the engine; the crawler performs this lookup its own way.
registry:
  kind: sunbirdRC
  url: ${inputs.registryUrl}
  entity: Participant
  providerEntity: ProviderSchema
  lookup:
    participantId: ${inputs.participantId}
    # Named from metadata rather than typed a second time: two copies of a
    # capability code is two chances to publish under the wrong one.
    capabilityCode: ${metadata.capability}
  fields:
    - providerId
    - capabilityId
    - bindingKey
    - baseUrl
    - schema

# ---------------------------------------------------------------------------
# inputs — the flag/env surface, resolved flag > env > default.
#
# baseUrl, tokenUser and tokenSecret are REQUIRED by the contract because the
# engine reads them BY NAME. A file that spells them differently resolves them
# into a map the engine cannot see into, and the run dies at the token exchange
# -- minutes in, against a live upstream -- instead of at load.
# ---------------------------------------------------------------------------
inputs:
  # Deliberately no default. No deployment is obliged to name the service
  # "registry", and a baked-in hostname that resolves nowhere surfaces as a DNS
  # error far from here rather than as "you did not configure the registry".
  # Never localhost: inside a container that is the adapter itself.
  registryUrl:
    flag: registry-url
    env: EXAMPLE_REGISTRY_URL

  baseUrl:
    flag: base-url
    env: EXAMPLE_API_URI
    default: https://api.example.test

  # A list input reaches an expression as TEXT, not as an array -- see the
  # `when:` on the first step for what that costs if you forget.
  regions:
    flag: regions
    type: list
    default: []          # empty means every region the upstream reports

  # env-settable, not flag-only. This pipeline runs inside a long-lived server
  # process that has no command line, so a flag-only window would be stuck at
  # "today" forever: no backfill after an outage, and no way to widen it on a
  # day the upstream published nothing (a public holiday returns no rows for
  # every region, which is correct and useless).
  fromDate:
    flag: from
    env: EXAMPLE_FROM_DATE
    type: date
    # The layout THIS UPSTREAM reads. Not ISO unless the upstream says so --
    # and `type: date` exists precisely so the word "today" is resolved here
    # rather than reaching the upstream verbatim, which is a mistake that has
    # actually shipped.
    format: dd-MM-yyyy
    default: today
  toDate:
    flag: to
    env: EXAMPLE_TO_DATE
    type: date
    format: dd-MM-yyyy
    default: today

  participantId:
    flag: participant-id
    env: EXAMPLE_PARTICIPANT_ID
    default: example-data-service
  networkId:
    flag: network-id
    env: APP_NETWORK_ID
    default: oan-dev
  catalogOut:
    flag: catalog-out
    default: catalog

  # An enum is a closed set the loader checks, so a typo is refused at startup
  # instead of silently failing every comparison in the catalog block below.
  withoutGeometry:
    flag: without-geometry
    enum: [publish, skip]
    default: publish

  publishUrl:
    flag: publish-url
    env: EXAMPLE_PUBLISH_URL

  # A ONE-TIME migration switch, off by default: it posts a tombstone for the
  # catalogue these per-region ones replaced. Turning it on every day would
  # retire something already retired.
  #
  # It is DECLARED rather than left implicit because the publish step refuses an
  # enable flag it cannot resolve -- reading an unresolvable flag as "off" would
  # silently skip a retirement an operator explicitly asked for.
  retireOld:
    flag: retire-old
    env: EXAMPLE_RETIRE_OLD
    default: false

  # Credentials. `secret: true` is what redacts them wherever inputs are
  # printed; without it they reach a log line the first time somebody turns on
  # debug logging, and log lines get pasted into tickets. Note there is no
  # `flag:` -- a credential on a command line is a credential in the process
  # table and in shell history.
  tokenUser:
    env: EXAMPLE_TOKEN_USER
    secret: true
  tokenSecret:
    env: EXAMPLE_TOKEN_SECRET
    secret: true

# ---------------------------------------------------------------------------
# upstream — the one service this pipeline calls, how it authenticates, and how
# its failures are classified.
# ---------------------------------------------------------------------------
upstream:
  baseUrl: ${inputs.baseUrl}

  auth:
    # tokenExchange posts credentials and reads a token back. The alternative
    # the contract allows is `none`, for an upstream that needs no credential
    # -- in which case `request` and `token` are both omitted.
    kind: tokenExchange
    request:
      method: POST
      path: /v1/auth/token
      # The credentials are NOT in this file and never will be. What is written
      # here is the NAME of the input that holds each one; the value is resolved
      # at runtime from flag/env.
      body:
        access_name: ${inputs.tokenUser}
        password: ${inputs.tokenSecret}
    token:
      # A path from the root, not an expression. This runs against a response
      # carrying a live credential, and a path can do nothing except select --
      # which is the point.
      at: $.data.access_token
      # Only `query` is honoured. The token is handed to each step's mapping and
      # the MAPPING decides where it lands; accepting `header` here would let
      # this field and the mappings disagree with nothing to show for it.
      carriedAs: query
      name: token
      # This class of upstream returns no expiry, so the token is held for the
      # whole run and re-minted on the statuses that mean it died -- not
      # refreshed on a timer guessed from nothing.
      #
      # Note these statuses are handled HERE and not in `errors:` below. A dead
      # token is not a classification of the result; it is a reason to retry the
      # same call.
      reexchangeOn: [401, 403]

  # Classification, not cosmetics.
  #
  # An upstream that answers "nothing here" has ANSWERED: that is a coverage
  # fact to count and walk past. A transport failure is an outage. Recording the
  # first as the second is how a run once turned 27 quiet regions out of 36 into
  # 27 reported outages, and exited non-zero on a collection that was as
  # complete as the upstream allows. Nobody trusted the exit code afterwards.
  #
  # The first rule that matches wins, so the specific ones come before the
  # catch-all. A rule either MATCHES on `when` or IS the `default` -- never
  # both, because a rule that is both is ambiguous about which branch applies.
  errors:
    - when: { status: 404, bodyContains: "no data for the requested window" }
      classify: emptyResult
    # Some upstreams answer 200 with an empty-result marker in the body. That
    # is still "nothing here", and reading it as success would hand the pipeline
    # a well-formed empty collection instead of a counted gap.
    - when: { status: 200, bodyContains: "NO_RECORDS" }
      classify: emptyResult
    - when: { status: [502, 503, 504] }
      classify: transportError
    # The catch-all is transportError, not emptyResult. An unclassified failure
    # counted as "no data" is an outage that publishes as a shrunken catalogue.
    - default: transportError

  guards:
    # Refused at the door if the upstream answers with the wrong container, so
    # the failure names the call rather than surfacing as a type error inside a
    # mapping three steps later.
    responseMustBe: array
    # NOT decoration. This upstream echoes the request back inside its error
    # bodies, and the request carries the token in its query string -- so
    # quoting a body in an error prints a live credential to a terminal, into a
    # log aggregator, and from there into a ticket.
    neverQuoteBodyInErrors: true
    # A ceiling, so a runaway response is refused instead of being buffered
    # until the process is killed for memory.
    maxResponseBytes: 32MiB

# ---------------------------------------------------------------------------
# pipeline — the ordered steps. Each names what it produces; later steps and the
# catalog block reference it as ${name}.
#
# A transforming step with no explicit input reads the PREVIOUS step's output,
# so the common case needs no wiring. Name the input explicitly (`left:`) when
# you mean a specific earlier step rather than "whatever just happened".
#
# All seven primitives appear below, each where you would actually reach for it.
# ---------------------------------------------------------------------------
pipeline:

  # http.post -- reach for it when the upstream puts its filters in a request
  # body rather than a query string, which is most "search" endpoints.
  #
  # The conditional pair: call the upstream only when the operator named no
  # regions; otherwise the list they named IS the result.
  - id: regions
    # `= ''`, NOT `= []`. `inputs.regions` is a list input, but an input reaches
    # an expression as TEXT -- empty text when the operator named nothing.
    # Measured, not assumed: `"" = []` evaluates FALSE under the pinned JSONata
    # build, so the `= []` form silently takes the else branch on every run and
    # hands a bare string to the loop below. `"" = ''` is true.
    #
    # ${...} inside a `when:` is substituted as a LITERAL, not as raw text: raw
    # substitution would turn this into a comparison against a record field
    # named `inputs` that does not exist, and the rule would never fire.
    when: "${inputs.regions} = ''"
    uses: http.post
    with:
      path: /v1/reference/search
      mapping: mappings/list-regions.yaml
      # Handed to the mapping, which decides where each value lands in the
      # request. `dataset` is what makes one reference endpoint serve several
      # lists without a mapping per list.
      local:
        token: ${auth.token}
        dataset: regions
      # NOT READ YET -- exercised here only so the contract, the Go struct and
      # this file stay in step (see the header). http.post always builds its
      # body from the mapping's request half; these three describe an upstream
      # whose body is a fixed literal, which the runner does not support today.
      # A real provider DELETES them rather than stating a rule nothing obeys.
      method: POST
      contentType: application/json
      body: '{"dataset":"regions"}'
    else:
      # Reached only when an operator names regions explicitly, and that path is
      # deliberately unfinished: a comma-separated string is not the list of
      # objects the loop below iterates, and this file has no primitive to split
      # one. The runner REFUSES with a message naming this step, rather than
      # looping over the characters of a string.
      const: ${inputs.regions}
    out: regions
    # A refusal, not a warning. An empty collection walks cleanly through every
    # later step and produces a well-formed, zero-error, empty run -- which
    # reads as "this provider has nothing" and exits 0. This is the sentence an
    # operator reads at 01:30.
    failWhenEmpty: "the region list resolved to zero regions; there is nothing to collect"

  # http.get -- the ordinary case: everything the call needs fits in the URL.
  #
  # Fetched ONCE for the whole run and joined onto every region's rows below.
  # The same mapping as the step above, because this upstream's reference
  # endpoint returns one uniform row shape for every dataset; one projection in
  # one file means the two calls cannot drift apart.
  - id: regionPoints
    uses: http.get
    with:
      path: /v1/reference/points
      mapping: mappings/list-regions.yaml
      local:
        token: ${auth.token}
        dataset: region-points
    out: regionPoints

  # The looped call: one request per region.
  - id: regionItems
    uses: http.get
    forEach: ${regions}
    # Without `as:` the loop has no name for its item and nothing inside it
    # could reference one; the runner refuses rather than guessing.
    as: region
    # Only 1 is honoured, and anything higher is REFUSED rather than quietly
    # ignored. The JSONata evaluator this shares keeps built-ins in package
    # state, so a parallel iteration races the mapping engine against this
    # package's own evaluations. Accepting the key and running sequentially
    # would be worse: the file would state a parallelism that never happens.
    concurrency: 1
    with:
      path: /v1/regions/${region.regionCode}/items
      mapping: mappings/region-items.yaml
      local:
        token: ${auth.token}
        regionCode: ${region.regionCode}
        fromDate: ${inputs.fromDate}
        toDate: ${inputs.toDate}
        projection: upstream
    # The 27-of-36 lesson written as data. Keyed by classification; a failure
    # with NO matching entry aborts the run, because a swallowed error is worse
    # than a loud one.
    onError:
      # The upstream answered "nothing here" for this region. Count it, keep
      # going: `continue` is what stops one quiet region from ending a
      # thirty-six region collection.
      emptyResult: { record: emptyRegions, continue: true }
      # A genuine outage for this region. ALSO continue -- but into a DIFFERENT
      # counter, because `publish.refuseWhen` below reads that counter and
      # refuses to publish a collection with holes in it. Same control flow,
      # opposite meaning; the counter is what keeps them apart.
      transportError: { record: regionErrors, continue: true }
    # A successful call that returned an empty list is the same coverage fact as
    # an upstream that said so in an error, so it lands in the same counter.
    onEmptyOutput: { record: emptyRegions }
    out: items

  # filter -- reach for it to drop rows before a join or dedupe, so a defective
  # row cannot become a join key or win a dedupe race.
  #
  # A row with no id is not a record: it would dedupe against every other
  # id-less row under the same empty key and silently collapse them into one.
  - id: activeItems
    uses: filter
    with:
      when: "$exists(itemId) and itemId != '' and status != 'WITHDRAWN'"
    out: activeItems

  # join -- reach for it when one call carries the records and another carries
  # the facts about them. Only a LEFT join exists: a left row with no match is
  # KEPT, because it is a real record whose extra fields are merely unknown.
  # Dropping it would delete a genuine item because a reference list was stale.
  #
  # `carry` is an allowlist, not a merge. Everything not named stays on the
  # right-hand record, so a reference list that grows a field cannot overwrite a
  # field of the same name on the left.
  - id: withPoints
    uses: join
    with:
      left: ${activeItems}
      right: ${regionPoints}
      on: regionCode
      type: left
      carry: [latitude, longitude, regionName]
    out: withPoints

  # derive -- reach for it when the value depends on a small table of cases you
  # want to READ. Rules are ordered and the FIRST match wins, so the block reads
  # top to bottom; the rule with no `when:` is the default and must come last.
  # A record matching no rule is an ERROR, not an unset field.
  #
  # What this computes is not a quality opinion -- it is a correctness rule. A
  # coordinate that cannot be real is REMOVED, so it is never published as a
  # location somebody navigates to. An item whose point is dropped is still
  # published; it simply carries no geometry, so proximity search cannot find it
  # -- which is correct, because nobody knows where it is.
  - id: pointQuality
    uses: derive
    field: is not valid here -- `field` lives under `with`, see below
    out: placeholder
