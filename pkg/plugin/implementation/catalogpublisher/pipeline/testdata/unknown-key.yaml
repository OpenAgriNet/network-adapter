metadata:
  name: example
  capability: example:Thing

schedule:
  cron: "0 0 * * *"
  utcOffset: "+05:30"

thisBlockIsNotInTheSchema:
  someRule: refuse everything

pipeline:
  - id: things
    uses: listThings
    aKeyStepDoesNotHave: true
