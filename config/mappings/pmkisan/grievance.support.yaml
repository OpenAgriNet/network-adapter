# PM-KISAN grievance, support -> POST /LodgeGrievance: lodge a grievance.
#   orderId                registration number
#   channels[0].grievance  category G001-G010 (no subCategory), description
#   channels[0].challenge  OTP, verified by the envelope first; never forwarded
# Plaintext here; the envelope adds TokenNo and encrypts (AES-256-GCM).

# Format checks (SCH_INVALID_FORMAT). Missing fields are refused by the request half.
required:
  - check: |
      (
        $id := beckn.message.support.orderId;
        /* ASCII alphanumeric, <= 20 chars, never 12 digits (Aadhaar). */
        $not($exists($id)) or ($type($id) = "string"
          and $exists($match($id, /^[A-Za-z0-9]{1,20}$/)[0])
          and $not($exists($match($id, /^[0-9]{12}$/)[0])))
      )
    message: "orderId must be an alphanumeric registration number of at most 20 characters, and must not be an Aadhaar number"
  - check: |
      (
        $code := beckn.message.support.channels[0].grievance.category.code;
        $not($exists($code))
          or $code in ["G001", "G002", "G003", "G004", "G005", "G006", "G007", "G008", "G009", "G010"]
      )
    message: "grievance.category.code must be a PM-KISAN grievance category, G001 to G010"
  - check: $not($exists(beckn.message.support.channels[0].grievance.subCategory))
    message: "grievance.subCategory is not accepted: PM-KISAN classifies a grievance one level deep"
  - check: |
      (
        $c := beckn.message.support.channels[0].challenge;
        /* Digits only. */
        $not($exists($c))
          or ($c.method = "SMS_OTP" and $type($c.value) = "string" and $exists($match($c.value, /^[0-9]+$/)[0]))
      )
    message: "challenge.method must be SMS_OTP and challenge.value the digits the farmer received"
  - check: |
      (
        $d := beckn.message.support.channels[0].grievance.description;
        /* Measured trimmed, as the portal does. */
        $not($exists($d)) or ($type($d) = "string" and $length($trim($d)) >= 10 and $length($trim($d)) <= 2000)
      )
    message: "grievance.description must describe the problem in 10 to 2000 characters"

# TokenNo is added by the envelope.
request: |
  (
    $s := beckn.message.support;
    $ch := $s.channels[0];
    $g := $ch.grievance;
    $at := "$.message.support.channels[0].";
    /* First missing field, with its path. */
    $missing := [
      { "field": "orderId", "path": "$.message.support.orderId", "present": $exists($s.orderId) },
      { "field": "grievance.category.code", "path": $at & "grievance.category.code", "present": $exists($g.category.code) },
      { "field": "grievance.description", "path": $at & "grievance.description", "present": $exists($g.description) },
      { "field": "challenge.value", "path": $at & "challenge.value", "present": $exists($ch.challenge.value) }
    ][$not(present)][0];
    $missing
    ? { "_error": { "status": 400, "code": "SCH_REQUIRED_FIELD_MISSING",
                    "message": $missing.field & " is required", "path": $missing.path } }
    : {
      "Type":                 "Reg_No_Details",
      "IdentityNo":           $s.orderId,
      "GrievanceType":        $g.category.code,
      "GrievanceDescription": $trim($g.description)
    }
  )

# A "False" flag (Status/Responce/Rsponce/status) is a 502; the portal's message
# is never returned. Otherwise echo the request and add case: ticketNo from
# GrievanceID or GrievanceNo, status Registered, filedOn = IST date of the
# request timestamp. A 4xx (_status) becomes the adapter's 502.
response: |
  $exists(_status)
  ? {}
  : (
    $false := function($v) { $exists($v) and $lowercase($string($v)) = "false" };
    $refused := $false(response.Status) or $false(response.Responce)
      or $false(response.Rsponce) or $false(response.status);
    /* Text or number; empty is none. */
    $handle := function($v) {
      ($type($v) = "string" and $v != "") or $type($v) = "number" ? $string($v)
    };
    $ticketNo := $exists($handle(response.GrievanceID))
      ? $handle(response.GrievanceID)
      : $handle(response.GrievanceNo);
    $s := beckn.message.support;
    $ch := $s.channels[0];

    $filedOn := $exists(beckn.context.timestamp)
      ? $fromMillis($toMillis(beckn.context.timestamp), "[Y0001]-[M01]-[D01]", "+0530")
      : $now("[Y0001]-[M01]-[D01]", "+0530");
    $refused
    ? { "_error": { "status": 502, "code": "NET_DOWNSTREAM_UNAVAILABLE",
                    "message": "PM-KISAN did not accept the grievance" } }
    : {
      "context": $merge([beckn.context, { "action": "on_support", "timestamp": $now() }]),
      "message": {
        "support": {
          "orderId": $s.orderId,
          "channels": [{
            "@context":        $ch.`@context`,
            "@type":           $ch.`@type`,
            "informationMode": "Direct",
            "provider":        $ch.provider,
            "scheme":          $ch.scheme,
            "grievance":       $ch.grievance,
            "case": {
              "ticketNo": $ticketNo,
              "status":   { "code": "Registered" },
              /* IST: status matches on this date. */
              "filedOn":  $filedOn
            }
          }]
        }
      }
    }
  )
