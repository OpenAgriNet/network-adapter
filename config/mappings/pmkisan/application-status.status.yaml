# PM-KISAN application status, status -> POST /ChatbotUserDetails.
# Carries the init's identifier plus the 4-digit OTP, which the envelope
# verifies first (/ChatbotOTPVerified). The envelope then calls
# /ChatbotBeneficiaryStatus and adds its answer as _beneficiaryStatus (absent
# if that call fails). Plaintext here; the envelope adds Token and encrypts.

required:
  - check: |
      (
        $ca := beckn.message.contract.commitments[0].commitmentAttributes;
        $not($exists($ca.grievance) or $exists($ca.case) or $exists($ca.grievanceOptions))
      )
    message: "grievance, case and grievanceOptions are not accepted: application status files nothing"
  - check: |
      (
        $c := beckn.message.contract.commitments[0].commitmentAttributes.challenge;

        $not($exists($c))
          or ($c.method = "SMS_OTP" and $type($c.value) = "string" and $exists($match($c.value, /^[0-9]{4}$/)[0]))
      )
    message: "challenge.method must be SMS_OTP and challenge.value the four digits the farmer received"

# Also sent to /ChatbotBeneficiaryStatus by the envelope.
request: |
  (
    $ca := beckn.message.contract.commitments[0].commitmentAttributes;
    $a := $ca.applicant;
    $at := "$.message.contract.commitments[0].commitmentAttributes.";
    /* The identifiers sent: slot, upstream Types, and whether it fits the slot. */
    $sent := [
      $exists($ca.enrolmentId) ? { "slot": "enrolmentId", "Types": "Ben_id", "Values": $ca.enrolmentId,
        "fits": $type($ca.enrolmentId) = "string"
          and $exists($match($ca.enrolmentId, /^[A-Za-z0-9]{1,20}$/)[0])
          and $not($exists($match($ca.enrolmentId, /^[0-9]{12}$/)[0])) },
      $exists($a.mobile) ? { "slot": "applicant.mobile", "Types": "Mobile", "Values": $a.mobile,
        "fits": $type($a.mobile) = "string" and $exists($match($a.mobile, /^[6-9][0-9]{9}$/)[0]) },
      $exists($a.aadhaar) ? { "slot": "applicant.aadhaar", "Types": "Aadhar", "Values": $a.aadhaar,
        "fits": $type($a.aadhaar) = "string" and $exists($match($a.aadhaar, /^[0-9]{12}$/)[0]) }
    ];
    $id := $sent[0];
    $count($sent) != 1
    ? { "_error": { "status": 400, "code": "SCH_SCHEMA_VALIDATION_FAILED",
                    "message": "send exactly one of enrolmentId, applicant.mobile or applicant.aadhaar",
                    "path": $at & ($exists($a) ? "applicant" : "enrolmentId") } }
    : $not($id.fits)
    ? { "_error": { "status": 400, "code": "SCH_SCHEMA_VALIDATION_FAILED",
                    "message": $id.slot = "enrolmentId"
                      ? "enrolmentId must be an alphanumeric registration number of at most 20 characters, and must not be an Aadhaar number"
                      : $id.slot & " is not a " & ($id.slot = "applicant.mobile" ? "mobile" : "Aadhaar") & " number",
                    "path": $at & $id.slot } }
    : $not($exists($ca.challenge.value))
    ? { "_error": { "status": 400, "code": "SCH_REQUIRED_FIELD_MISSING",
                    "message": "challenge.value is required", "path": $at & "challenge.value" } }
    : { "Types": $id.Types, "Values": $id.Values }
  )

# "False": 202 BIZ_NO_RESULTS_FOUND. No "True" or no instalment count: 502.
# Otherwise on_status (CLOSED), allow-list only -- personal data is dropped:
#   Reg_No                -> enrolmentId
#   DateOfRegistration    -> registeredOn (read as IST)
#   LatestInstallmentPaid -> latestInstallmentPaid (0 is an answer)
#   eKYC_Status           -> ekyc.code (Y: Done, else Pending)
#   _beneficiaryStatus    -> blockers: each phrase except "No Errors", coded
#                            IncomeTaxPayee / LandSeedingPending / Other.
#                            Absent if the check failed; [] if nothing found.
# A 4xx (_status) becomes the adapter's 502.
response: |
  $exists(_status)
  ? {}
  : (
    $flag := function($r) {
      $exists($r.Rsponce) ? $lowercase($string($r.Rsponce))
      : $exists($r.Responce) ? $lowercase($string($r.Responce))
      : $exists($r.Status) ? $lowercase($string($r.Status))
    };
    $text := function($v) {
      $type($v) = "string" and $length($trim($v)) > 0 ? $trim($v)
    };
    $count0 := (
      $n := response.LatestInstallmentPaid;
      $type($n) = "number" ? $n
      : $type($n) = "string" and $exists($match($trim($n), /^[0-9]+$/)[0]) ? $number($trim($n))
    );

    /* ISO, /Date(ms)/ or M/D/YYYY, as IST; anything else is left out. */
    $istPicture := "[Y0001]-[M01]-[D01]T[H01]:[m01]:[s01][Z01:01]";
    $pad := function($s) { $length($s) = 1 ? "0" & $s : $s };
    $registeredOn := (
      $d := $text(response.DateOfRegistration);
      $exists($match($d, /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}/)[0])
        ? $substring($d, 0, 10) & "T" & $substring($d, 11, 8) & "+05:30"
      : $exists($match($d, /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/)[0])
        ? $d & "T00:00:00+05:30"
      : $exists($match($d, /^\/Date\([0-9]+([+-][0-9]{4})?\)\/$/)[0])
        ? $fromMillis($number($split($substring($d, 6), /[^0-9]/)[0]), $istPicture, "+0530")
      : $exists($match($d, /^[0-9]{1,2}\/[0-9]{1,2}\/[0-9]{4}/)[0])
        ? (
          $mdy := $split($split($d, " ")[0], "/");
          $mdy[2] & "-" & $pad($mdy[0]) & "-" & $pad($mdy[1]) & "T00:00:00+05:30"
        )
    );

    $bs := response._beneficiaryStatus;
    $governed := { "income tax payee": "IncomeTaxPayee", "land seeding, kys": "LandSeedingPending" };
    $notBlockers := ["Rsponce", "Responce", "Status", "status", "Message", "message"];
    $blockers := $flag($bs) = "true"
      ? (
        $phrases := $distinct($filter(
          $map($sort($filter($keys($bs), function($k) { $not($k in $notBlockers) })),
               function($k) { $text($lookup($bs, $k)) }),
          function($p) { $exists($p) and $lowercase($p) != "no errors" }));
        [$map($phrases, function($p) {
          {
            "code": (
              $known := $lookup($governed, $lowercase($p));
              $exists($known) ? $known : "Other"
            ),
            "name": $p
          }
        })]
      );

    $c := beckn.message.contract.commitments[0];
    $ca := $c.commitmentAttributes;

    $flag(response) = "false"
    ? { "_error": { "status": 202, "code": "BIZ_NO_RESULTS_FOUND",
                    "message": "PM-KISAN holds no registration for this applicant." } }
    : $flag(response) != "true" or $not($exists($count0))
    ? { "_error": { "status": 502, "code": "NET_DOWNSTREAM_UNAVAILABLE",
                    "message": "PM-KISAN could not read the registration" } }
    : {
      "context": $merge([beckn.context, { "action": "on_status", "timestamp": $now() }]),
      "message": {
        "contract": {
          "id": beckn.message.contract.id,
          "commitments": [{
            "status": { "descriptor": { "code": "CLOSED" } },
            "offer":     $c.offer,
            "resources": $c.resources,
            "commitmentAttributes": {
              "@context":        $ca.`@context`,
              "@type":           $ca.`@type`,
              "informationMode": "Direct",
              "scheme":          $ca.scheme,
              "enrolmentId":     $text(response.Reg_No),
              "application": {
                "registeredOn":          $registeredOn,
                "latestInstallmentPaid": $count0,
                "ekyc": $exists(response.eKYC_Status)
                  ? { "code": $uppercase($trim($string(response.eKYC_Status))) = "Y" ? "Done" : "Pending" },
                "blockers": $blockers
              }
            }
          }]
        }
      }
    }
  )
