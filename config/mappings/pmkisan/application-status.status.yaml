# PM-KISAN application status -> /ChatbotUserDetails, then the blockers (ADR-0005).

# The OTP's presence is checked once, in Grievance/otp.go, not here.
request: |
  (
    $ca := beckn.message.contract.commitments[0].commitmentAttributes;
    $exists($ca.enrolmentId)
    /* Types: identityType and mobileType in Grievance/otp.go; keep them together. */
    ? { "Types": "Ben_id", "Values": $ca.enrolmentId }
    : { "Types": "Mobile", "Values": $ca.applicant.mobile }
  )

# "False": 400; no "True", no instalment count or no Reg_No: 502. Only allow-listed fields are returned.
response: |
  $exists(_status)
  ? {}
  : (
    /* PM-KISAN's yes/no flag, lower-cased: the first of Rsponce, Responce, Status,
       status that is present. Same rule as pmkisanSaidYes() in Grievance/otp.go;
       copied verbatim into every PM-KISAN mapping. */
    $statusText := function($r) {
      $exists($r.Rsponce) ? $lowercase($string($r.Rsponce))
      : $exists($r.Responce) ? $lowercase($string($r.Responce))
      : $exists($r.Status) ? $lowercase($string($r.Status))
      : $exists($r.status) ? $lowercase($string($r.status))
    };
    $text := function($v) {
      $type($v) = "string" and $length($trim($v)) > 0 ? $trim($v)
    };
    $instalmentsPaid := (
      $n := response.LatestInstallmentPaid;
      $type($n) = "number" ? $n
      : $type($n) = "string" and $exists($match($trim($n), /^[0-9]+$/)[0]) ? $number($trim($n))
    );

    /* ISO date or date-time, read as IST; anything else is left out. */
    $registeredOn := (
      $d := $text(response.DateOfRegistration);
      $exists($match($d, /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}/)[0])
        ? $substring($d, 0, 10) & "T" & $substring($d, 11, 8) & "+05:30"
      : $exists($match($d, /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/)[0])
        ? $d & "T00:00:00+05:30"
    );

    /* Blockers: every field of the beneficiary-status answer except its flag and
       message is a phrase; "No errors" means none. Phrases first, then codes. */
    $beneficiaryStatus := response._beneficiaryStatus;
    $blockerCodes := { "income tax payee": "IncomeTaxPayee", "land seeding, kys": "LandSeedingPending" };
    $notBlockers := ["Rsponce", "Responce", "Status", "status", "Message", "message"];
    $blockerFields := $sort($filter($keys($beneficiaryStatus), function($k) { $not($k in $notBlockers) }));
    $blockerPhrases := $distinct($filter(
      $map($blockerFields, function($k) { $text($lookup($beneficiaryStatus, $k)) }),
      function($p) { $exists($p) and $lowercase($p) != "no errors" }));
    $blockers := $statusText($beneficiaryStatus) = "true"
      ? [$map($blockerPhrases, function($p) {
          {
            "code": (
              $known := $lookup($blockerCodes, $lowercase($p));
              $exists($known) ? $known : "Other"
            ),
            "name": $p
          }
        })];

    $c := beckn.message.contract.commitments[0];
    $ca := $c.commitmentAttributes;
    $at := "$.message.contract.commitments[0].commitmentAttributes.";
    $enrolmentId := $text(response.Reg_No);

    $statusText(response) = "false"
    ? { "_error": { "status": 400, "code": "BIZ_GENERIC_ERROR",
                    "message": "PM-KISAN holds no registration for this applicant.",
                    "path": $at & ($exists($ca.enrolmentId) ? "enrolmentId" : "applicant.mobile") } }
    : $statusText(response) != "true" or $not($exists($instalmentsPaid)) or $not($exists($enrolmentId))
    ? { "_error": { "status": 502, "code": "NET_DOWNSTREAM_UNAVAILABLE",
                    "message": "PM-KISAN could not read the registration" } }
    : {
      "context": $merge([beckn.context, { "action": "on_status", "timestamp": $now() }]),
      "message": {
        "contract": {
          "id": beckn.message.contract.id,
          "commitments": [{
            "status": { "descriptor": { "code": "CLOSED" } },
            "offer":     $c.offer,
            "resources": $c.resources,
            "commitmentAttributes": {
              "@context":        $ca.`@context`,
              "@type":           $ca.`@type`,
              "informationMode": "OnDemand",
              "scheme":          $ca.scheme,
              "enrolmentId":     $enrolmentId,
              "application": {
                "registeredOn":          $registeredOn,
                "latestInstalmentPaid":  $instalmentsPaid,
                "ekyc": $exists(response.eKYC_Status)
                  ? { "code": $uppercase($trim($string(response.eKYC_Status))) = "Y" ? "Done" : "Pending" },
                "blockers": $blockers
              }
            }
          }]
        }
      }
    }
  )
