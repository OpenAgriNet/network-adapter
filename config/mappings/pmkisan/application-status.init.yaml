# PM-KISAN application status, init -> POST /ChatbotOTP: send an OTP.
# applicant.idType says what applicant.id is; a mismatch is refused here.
#   Registration  alphanumeric     -> Ben_id
#   Mobile        ^[6-9][0-9]{9}$  -> Mobile
#   Aadhaar       12 digits        -> Aadhar
# Plaintext here; the envelope adds Token and encrypts (AES-128-CBC).

# Refuse bands the pack refuses. Missing fields are refused by the request half.
required:
  - check: |
      (
        $ca := beckn.message.contract.commitments[0].commitmentAttributes;
        $not($exists($ca.grievance) or $exists($ca.case) or $exists($ca.grievanceOptions))
      )
    message: "grievance, case and grievanceOptions are not accepted: application status files nothing"
  - check: $not($exists(beckn.message.contract.commitments[0].commitmentAttributes.enrolmentId))
    message: "enrolmentId is not sent on application status: name the farmer with applicant, and the registration comes back as enrolmentId"

# The id is never echoed or put in an error (it may be an Aadhaar number).
request: |
  (
    $ca := beckn.message.contract.commitments[0].commitmentAttributes;
    $a := $ca.applicant;
    $at := "$.message.contract.commitments[0].commitmentAttributes.";
    $types := { "Registration": "Ben_id", "Mobile": "Mobile", "Aadhaar": "Aadhar" };
    $fits := function($kind, $id) {
      $type($id) = "string" and (
        $kind = "Registration" ? $exists($match($id, /^[A-Za-z0-9]{1,20}$/)[0])
        : $kind = "Mobile" ? $exists($match($id, /^[6-9][0-9]{9}$/)[0])
        : $kind = "Aadhaar" ? $exists($match($id, /^[0-9]{12}$/)[0])
        : false
      )
    };
    $missing := [
      { "field": "applicant.idType", "present": $exists($a.idType) },
      { "field": "applicant.id", "present": $exists($a.id) }
    ][$not(present)][0];
    $missing
    ? { "_error": { "status": 400, "code": "SCH_REQUIRED_FIELD_MISSING",
                    "message": $missing.field & " is required", "path": $at & $missing.field } }
    : $not($exists($lookup($types, $string($a.idType))))
    ? { "_error": { "status": 400, "code": "SCH_SCHEMA_VALIDATION_FAILED",
                    "message": "applicant.idType must be Registration, Mobile or Aadhaar",
                    "path": $at & "applicant.idType" } }
    : $not($fits($a.idType, $a.id))
    ? { "_error": { "status": 400, "code": "SCH_SCHEMA_VALIDATION_FAILED",
                    "message": "applicant.id is not a " & $a.idType & " number",
                    "path": $at & "applicant.id" } }
    : { "Types": $lookup($types, $a.idType), "Values": $a.id }
  )

# As grievance init: only "True" means sent (else 502); on_init stays DRAFT
# with challengeIssued; applicant is not echoed. A 4xx becomes the adapter's 502.
response: |
  $exists(_status)
  ? {}
  : (
    $true := function($v) { $exists($v) and $lowercase($string($v)) = "true" };
    $sent := $true(response.Rsponce) or $true(response.Responce) or $true(response.Status);
    $commitment := beckn.message.contract.commitments[0];
    $ca := $commitment.commitmentAttributes;

    $otpWindowMillis := 10 * 60 * 1000;
    $not($sent)
    ? { "_error": { "status": 502, "code": "NET_DOWNSTREAM_UNAVAILABLE",
                    "message": "PM-KISAN could not send the OTP" } }
    : {
      "context": $merge([beckn.context, { "action": "on_init", "timestamp": $now() }]),
      "message": {
        "contract": $merge([beckn.message.contract, {
          "commitments": [$merge([$commitment, {
            "status": { "descriptor": { "code": "DRAFT" } },
            "commitmentAttributes": {
              "@context":        $ca.`@context`,
              "@type":           $ca.`@type`,
              "informationMode": "OnDemand",
              "scheme":          $ca.scheme,
              "challengeIssued": {
                "method":    "SMS_OTP",
                "length":    4,
                "valueType": "NUMERIC",
                "expiresAt": $fromMillis($millis() + $otpWindowMillis)
              }
            }
          }])]
        }])
      }
    }
  )
