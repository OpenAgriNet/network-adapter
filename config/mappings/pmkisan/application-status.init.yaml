# PM-KISAN application status, init -> POST /ChatbotOTP: send an OTP.
# Exactly one identifier, in the slot that names its kind:
#   enrolmentId        alphanumeric <= 20, never 12 digits -> Ben_id
#   applicant.mobile   ^[6-9][0-9]{9}$                     -> Mobile
#   applicant.aadhaar  12 digits                           -> Aadhar
# Plaintext here; the envelope adds Token and encrypts (AES-128-CBC).

# Refuse bands the pack refuses. Missing fields are refused by the request half.
required:
  - check: |
      (
        $ca := beckn.message.contract.commitments[0].commitmentAttributes;
        $not($exists($ca.grievance) or $exists($ca.case) or $exists($ca.grievanceOptions))
      )
    message: "grievance, case and grievanceOptions are not accepted: application status files nothing"

# The id is never echoed or put in an error (it may be an Aadhaar number).
request: |
  (
    $ca := beckn.message.contract.commitments[0].commitmentAttributes;
    $a := $ca.applicant;
    $at := "$.message.contract.commitments[0].commitmentAttributes.";
    /* The identifiers sent: slot, upstream Types, and whether it fits the slot. */
    $sent := [
      $exists($ca.enrolmentId) ? { "slot": "enrolmentId", "Types": "Ben_id", "Values": $ca.enrolmentId,
        "fits": $type($ca.enrolmentId) = "string"
          and $exists($match($ca.enrolmentId, /^[A-Za-z0-9]{1,20}$/)[0])
          and $not($exists($match($ca.enrolmentId, /^[0-9]{12}$/)[0])) },
      $exists($a.mobile) ? { "slot": "applicant.mobile", "Types": "Mobile", "Values": $a.mobile,
        "fits": $type($a.mobile) = "string" and $exists($match($a.mobile, /^[6-9][0-9]{9}$/)[0]) },
      $exists($a.aadhaar) ? { "slot": "applicant.aadhaar", "Types": "Aadhar", "Values": $a.aadhaar,
        "fits": $type($a.aadhaar) = "string" and $exists($match($a.aadhaar, /^[0-9]{12}$/)[0]) }
    ];
    $id := $sent[0];
    $count($sent) != 1
    ? { "_error": { "status": 400, "code": "SCH_SCHEMA_VALIDATION_FAILED",
                    "message": "send exactly one of enrolmentId, applicant.mobile or applicant.aadhaar",
                    "path": $at & ($exists($a) ? "applicant" : "enrolmentId") } }
    : $not($id.fits)
    ? { "_error": { "status": 400, "code": "SCH_SCHEMA_VALIDATION_FAILED",
                    "message": $id.slot = "enrolmentId"
                      ? "enrolmentId must be an alphanumeric registration number of at most 20 characters, and must not be an Aadhaar number"
                      : $id.slot & " is not a " & ($id.slot = "applicant.mobile" ? "mobile" : "Aadhaar") & " number",
                    "path": $at & $id.slot } }
    : { "Types": $id.Types, "Values": $id.Values }
  )

# As grievance init: only "True" means sent (else 502); on_init stays DRAFT
# with challengeIssued; neither identifier is echoed. A 4xx becomes the adapter's 502.
response: |
  $exists(_status)
  ? {}
  : (
    $true := function($v) { $exists($v) and $lowercase($string($v)) = "true" };
    $sent := $true(response.Rsponce) or $true(response.Responce) or $true(response.Status);
    $commitment := beckn.message.contract.commitments[0];
    $ca := $commitment.commitmentAttributes;

    $otpWindowMillis := 10 * 60 * 1000;
    $not($sent)
    ? { "_error": { "status": 502, "code": "NET_DOWNSTREAM_UNAVAILABLE",
                    "message": "PM-KISAN could not send the OTP" } }
    : {
      "context": $merge([beckn.context, { "action": "on_init", "timestamp": $now() }]),
      "message": {
        "contract": $merge([beckn.message.contract, {
          "commitments": [$merge([$commitment, {
            "status": { "descriptor": { "code": "DRAFT" } },
            "commitmentAttributes": {
              "@context":        $ca.`@context`,
              "@type":           $ca.`@type`,
              "informationMode": "OnDemand",
              "scheme":          $ca.scheme,
              "challengeIssued": {
                "method":    "SMS_OTP",
                "length":    4,
                "valueType": "NUMERIC",
                "expiresAt": $fromMillis($millis() + $otpWindowMillis)
              }
            }
          }])]
        }])
      }
    }
  )
