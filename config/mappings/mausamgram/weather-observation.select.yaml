# Mausamgram, openagrinet:WeatherObservation, select. Both directions, one file.
#
# One file per binding-action rather than one per direction, because both legs of
# one upstream call are one unit of configuration: they are published, reviewed
# and retired together, and a reference to one is a reference to the other.
#
# The registry entry pointing here decides which action this serves, so nothing
# in the file names it. The filename's action segment must match that entry --
# a mismatch would apply a correct mapping to the wrong call, silently.
#
# Both halves read:
#   beckn     the inbound Beckn payload -- the context to echo, the offer to
#             quote against
# and the response half additionally reads:
#   response  the provider's answer, in its own shape
#
# and both halves also read:
#   _local    whatever the step's prerequisites resolved before the call -- a
#             code looked up from a name, a point resolved to a market. EMPTY
#             here: this plugin declares no prerequisites, so nothing in this
#             file reads it.
#
# Nothing else is in scope. In particular, values the step already holds and
# merely used to make the call are not in _local: reading those back would be a
# second name for the same data. Where the answer needs one, it takes it from
# what the provider echoed.
#
# UPSTREAM: GET /nwpapi/get-daily?lat=&lon=, Basic auth, answering fcstday1..N
# plus an `abbreviation` unit dictionary, `location` echoing the request, and
# `lat_r`/`lon_r` -- the 0.25 degree grid centre the request snapped to.

# The response half follows the openagrinet:WeatherObservation v0.1 schema pack,
# Direct mode. The pack lives in OpenAgriNet/network-specs; it is referred to
# here by name and version rather than by a path, because a path pins a branch
# and a branch moves.
#
# @context is not stated here at all. The response echoes whatever the request
# declared, so this file never has to know which pack URL is current and cannot
# contradict the caller.
#
# Direct mode requires observationType, source, location, generatedAt and
# parameters; Direct + Forecast additionally requires modelRunAt and a closed
# validity. informationMode is what selects those requirements: a catalog
# resource advertising this capability is OnDemand instead, and carries
# supportedParameters rather than values.
#
# The answer returns ONE RESOURCE PER FORECAST DAY, each with its own id derived
# from its date. That is the shape the pack describes: every WeatherObservation
# example carries a single validity and a flat parameters array, so a period is a
# resource and there is no form for several in one.
#
# The ids are therefore new -- the request named an abstract point forecast, the
# answer returns the concrete days that satisfy it. Which is why the offer's
# resourceIds are rewritten below rather than echoed: the offer arrives naming
# the id that was asked for, and leaving it would point the offer at something
# that appears nowhere in the answer.
#
# WHAT THIS PROVIDER SENDS THAT THE PACK CANNOT HOLD, and is therefore dropped:
#
#   cloud, cloud_message   Total cloud cover, every day. The `parameter` enum has
#                          no cloud member, so there is nowhere to put 95.84%.
#                          Adding CloudCover to the enum is a one-line pack
#                          change and this mapping gains a line when it lands.
#                          It used to be smuggled out as an Alert when no warning
#                          was present, which reported routine cloud cover as an
#                          advisory -- worse than dropping it.
#   tmin_raw, tmax_raw     Non-bias-corrected temperature. parameters.items is
#                          closed by additionalProperties:false, so there is no
#                          discriminator to distinguish a raw reading from a
#                          corrected one -- two Temperature entries would be
#                          indistinguishable. The corrected pair is the better
#                          number, so it is the one kept.
#   rain_message           Prose restating `rain`, which is carried numerically.
#   wind                   ["WNW", "West-North Westerly"] -- the compass form of
#                          `wdir`, which is carried in degrees. Same information,
#                          and a two-element array is not a value `values` holds.
#   rain_icon, cloud_icon  Presentation.
#
# Everything else the provider sends is mapped. Fields that are the same for
# every day -- the point, the source, the observation type -- sit once at the
# top; only what varies per day repeats.

# What this capability requires of a payload, checked before either half runs.
# A predicate that is false refuses the request with the message beside it, so
# the caller is told what is wrong with their payload rather than that an
# expression somewhere returned false.
#
# This rule used to be Go: the step read the geometry and required a Point, which
# meant a capability with a different rule needed a different build. It is here
# now, beside the extraction it guards.
#
# NOTE the consequence: nothing in the adapter enforces a geometry any more. A
# mapping that declares no preconditions accepts whatever arrives and hands it to
# the request half, which is exactly the configurability that was asked for --
# and exactly why the responsibility sits in this file.
#
# One check, because there is one thing to say. $exists guards the type test, so
# a request carrying no location and a request carrying a Polygon both land here
# and both learn what this capability needs -- splitting them would be two
# entries repeating the same sentence.
#
# The pack permits what this check requires. An earlier version of this comment
# claimed WeatherObservation v0.1's OnDemand branch EXCLUDES `location`, and that
# a conforming request therefore could not satisfy this check. That was wrong:
# the pack's if/then blocks only ADD to `required`, there is no `not`, and
# neither AgricultureResourceFields nor the WeatherObservation body closes with
# additionalProperties:false -- that appears only on parameters.items and
# parameters.items.values. So an OnDemand resource carrying `location` conforms,
# and no pack change is pending on this.
#
# Each check is its own expression and binds $ra for itself; there is no shared
# scope with the halves below. Where several checks say genuinely different
# things, they are separate entries and the first failure is the one reported.
required:
  - check: |
      (
        $ra := beckn.message.contract.commitments[0].resources[0].resourceAttributes;
        $exists($ra.location) and $ra.location.type = "Point"
      )
    message: "this capability needs a Point location; the provider forecasts one point at a time"

# The request half decides what the provider is asked for. Whatever it produces
# IS the request: query parameters for a method with no body, a body for one that
# takes it.
#
# This is where the extraction lives, deliberately. The step reads only the
# geometry's type -- enough for the check above -- and nothing else. So when this
# provider wants another parameter, it is an edit here and nothing else: no Go,
# no rebuild, live on the next cache expiry.
#
# There is no date range to send, and that is not an omission: get-daily takes
# lat and lon only and always answers its full horizon. A `from`/`to` read off
# $ra.validity would be a promise this provider does not honour, so the request
# does not carry one and the select example does not offer one.
#
# $ra is bound once so the rest reads as plain field access rather than four
# repetitions of the same path.
#
# GeoJSON is [lon, lat] -- longitude first. Reading them the other way round
# gives a point in the wrong hemisphere that is still a valid request, so it
# fails as wrong data rather than as an error.
request: |
  (
    $ra := beckn.message.contract.commitments[0].resources[0].resourceAttributes;
    {
      "lat": $ra.location.coordinates[1],
      "lon": $ra.location.coordinates[0]
    }
  )

# Keyed by direction, not by the action it produces: a select is answered by an
# on_select over the same HTTP round trip, so the callback is this half rather
# than an action of its own.
response: |
  (
    /* The grid centre, NOT response.location. `location` merely echoes the
       coordinates the caller asked for; lat_r/lon_r are the 0.25 degree cell the
       model actually resolved them to, up to ~14 km away. The pack defines
       location as the geometry to which the observation or forecast applies,
       which is the cell, not the question.

       Three sources, best first, because `location` is REQUIRED for Direct mode
       and there must always be one to emit:
         1. lat_r/lon_r  the cell the model resolved the request to
         2. location     the provider's echo of the request
         3. the request itself, which the precondition above already proved is a
            Point -- so this always resolves, and an earlier version of this file
            that stopped at (2) emitted a resource with no location at all, which
            the pack refuses outright.
       (3) is not a fabrication: it is the point the provider was asked about,
       merely unsnapped. Every source here is the same point to within one cell;
       none of them invents a location the answer does not describe. */
    $asked := beckn.message.contract.commitments[0].resources[0].resourceAttributes.location.coordinates;
    $lat := $exists(response.lat_r) ? response.lat_r
          : $exists(response.location.lat) ? response.location.lat
          : $asked[1];
    $lon := $exists(response.lon_r) ? response.lon_r
          : $exists(response.location.lon) ? response.location.lon
          : $asked[0];

    /* However many days the provider sent. It answers fcstday1..fcstdayN and N
       is whatever the forecast ran to, so naming five would truncate a ten-day
       answer and mis-handle a one-day one.

       Sorted on the numeric suffix, not the key: the keys sort lexically as
       fcstday1, fcstday10, fcstday2, and a ten-day forecast delivered in that
       order would be wrong in a way nothing downstream could detect. */
    $days := $each(response, function($v, $k) {
      $contains($k, "fcstday") ? {
        "n": $number($substringAfter($k, "fcstday")),
        "day": $v
      }
    })^(n).day;

    /* Drops keys whose value the provider omitted, so a day missing rhmin does
       not produce "values": {"minimum": null}. */
    $present := function($obj) {
      $merge($each($obj, function($v, $k) { $exists($v) ? {$k: $v} }))
    };

    /* One entry per PARAMETER, with every statistic for it grouped under
       `values`. This is what the pack requires: parameters.items is
       {parameter, values, unit}, closed by additionalProperties:false, and
       `values` is itself closed over instantaneous/minimum/maximum/mean/sum.

       An earlier version of this file emitted a flat
       {parameter, aggregation, unit, value} per statistic, which the pack
       refuses three ways per reading -- `values` missing, `aggregation` and
       `value` both additional. Grouping is also what makes `aggregation`
       unnecessary: minimum and maximum are keys, not a discriminator field, so
       the two temperature readings that used to be distinguishable only by that
       field are now one entry that cannot be ambiguous.

       Emits nothing when the provider sent no value for any statistic, rather
       than an entry with an empty values object.

       $exists and NOT $count($keys($values)) > 0, which is what this guard used
       to say. $present returns UNDEFINED, not {}, when it kept nothing --
       $each over an empty object yields nothing and $merge(undefined) is
       undefined -- and $count(undefined) is itself undefined in jsonata-go, so
       comparing it with ">" raises T2009: "the values 0 and 0 either side of
       operator > must be of the same data type". Both sides render as their
       zero value, which is why the error names 0 twice and neither is the
       count. It fired for any day the provider left a parameter out of, a day
       with no rain being the common one. */
    $reading := function($name, $unit, $values) {
      $exists($values) ? {
        "parameter": $name,
        "values": $values,
        "unit": $unit
      }
    };

    /* Every parameter this provider reports, for one day. Read off the
       `abbreviation` dictionary the provider ships alongside the days, so the
       units below are its own declared units rather than a guess. */
    $paramsFor := function($day) {
      [
        $reading("Rainfall", "mm",
          $present({ "sum": $day.rain })),
        $reading("Temperature", "Cel",
          $present({ "minimum": $day.tmin, "maximum": $day.tmax })),
        $reading("Humidity", "%",
          $present({ "minimum": $day.rhmin, "maximum": $day.rhmax })),
        $reading("WindSpeed", "m/s",
          $present({ "mean": $day.wspd })),
        /* Dropped by the old flat form, which had no entry for it at all. An
           instantaneous bearing in degrees, not an aggregate. */
        $reading("WindDirection", "deg",
          $present({ "instantaneous": $day.wdir })),
        /* A warning is a parameter, not a field of its own: the pack has no
           advisory property but does have an Alert parameter, whose value may be
           a string. Unit "1" is what the pack prescribes for a value that has no
           unit.

           Read what this provider means by it: weather_warning is a daily
           condition summary and is present every day, so most days carry
           "Overcast Sky" rather than a hazard. It is IMD's own advisory text and
           belongs here, but a consumer must not treat its presence as a warning
           -- only its content says whether one was issued. The old form fell
           back to cloud_message when it was absent, which reported routine cloud
           cover as an advisory; it does not any more. */
        $reading("Alert", "1",
          $present({ "instantaneous": $day.weather_warning }))
      ]
    };

    /* Days that yielded at least one reading. The pack sets minItems:1 on
       parameters, so a day the provider sent as a placeholder -- a date and
       nothing measured -- cannot become a resource: it would be a signed
       assertion that a forecast exists for that day carrying no forecast.
       Dropping it is silent, because a response mapping has no fault channel;
       the answer is simply shorter than the horizon. An earlier version of this
       file mapped every day unconditionally and emitted `parameters: []`, which
       the pack refuses.

       Filtered BEFORE the ids are minted, so offer.resourceIds and the resources
       it points at are derived from the same list and cannot disagree. */
    $kept := $filter($days, function($day) { $count($paramsFor($day)) > 0 });

    $selected := beckn.message.contract.commitments[0];

    /* The caller's own @context, echoed back rather than restated here. A
       mapping that hardcodes it has to be reissued whenever the pack URL
       moves, and it can disagree with what the request actually declared.
       Backticks because @ is an operator in JSONata. */
    $ctx := $selected.resources[0].resourceAttributes.`@context`;

    /* Bound once because it is used twice -- for a resource's own id and for the
       offer's reference to it. Two copies of the same expression is how a
       dangling reference gets reintroduced. */
    $resourceId := function($day) { "res:mausamgram:forecast:" & $day.date };

    /* A forecast day is a whole day in IST, not an instant. ClosedTimePeriod
       requires both ends with format date-time, so the bare "2026-09-10" this
       file used to emit is not a legal value, and startsAt equal to endsAt
       claimed a zero-length period for a 24-hour forecast. */
    $dayStart := function($d) { $d & "T00:00:00+05:30" };
    $dayEnd   := function($d) { $d & "T23:59:59+05:30" };

    /* modelRunAt is required for Direct + Forecast, and this provider does not
       send it in any form -- there is no run time, cycle or issue timestamp
       anywhere in the payload.

       ASSUMPTION, and the one value in this file not read off the wire: the
       first forecast day's opening instant stands in for it. That is a
       conservative floor, never later than the true run -- IMD's NWP cycles at
       00Z, which is 05:30 IST -- so it understates freshness by hours and never
       overstates it, and a consumer's staleness check errs toward refetching.

       The $exists guard means the fallback disappears the moment the provider
       exposes a real field: point the first branch at it and change nothing
       else. The alternative is a pack change relaxing modelRunAt, in which case
       this binding and its two uses come out together.

       Reads the first KEPT day, not the first day sent: if the provider led with
       a placeholder that was dropped above, the floor has to be a day that
       actually appears in the answer. */
    $modelRunAt := $exists(response.model_run)
      ? response.model_run
      : $dayStart($kept[0].date);

    /* Bound once so every resource in one answer carries the same instant.
       Calling $now() per resource would stamp five slightly different times on
       one round trip. */
    $generatedAt := $now();

    {
      /* Correlation only: the ids that tie this answer to the request that
         asked for it, and nothing that asserts who anybody is.

         bapId, bapUri, bppId and bppUri are deliberately absent. A mapping is
         a payload transformation -- it has no business asserting network
         identity, and the two Uri fields it could copy are whatever the caller
         happened to send, which in a deployed stack is a container-internal
         address that means nothing to anyone outside it. Echoing them would
         republish another party's routing details as if they were ours.

         Identity on the wire is the adapter's own: it signs what it answers
         with, using the key the registry publishes for it. */
      "context": {
        "version": beckn.context.version,
        "action": "on_select",
        "networkId": beckn.context.networkId,
        "transactionId": beckn.context.transactionId,
        "messageId": beckn.context.messageId,
        "timestamp": $generatedAt
      },
      "message": {
        "contract": {
          "commitments": [
            {
              /* DRAFT, not QUOTED. The Beckn v2 status enum is DRAFT, ACTIVE
                 and CLOSED, and a quote is still a draft: nothing is committed
                 until init and confirm. QUOTED read better and validated
                 nowhere -- base schema validation refuses it. */
              "status": {
                "descriptor": { "code": "DRAFT", "name": "Draft" }
              },
              /* The offer is echoed, but its references are not: the request
                 named the abstract point forecast, and the answer returns the
                 concrete days. Leaving resourceIds as they arrived would point
                 the offer at an id that appears nowhere in the answer.

                 $merge keeps everything else the request offered -- the id, the
                 descriptor, the provider -- and replaces one key. */
              "offer": $merge([
                $selected.offer,
                { "resourceIds": [$map($kept, function($day) { $resourceId($day) })] }
              ]),
              /* One resource per forecast day, which is what the pack describes:
                 every WeatherObservation example carries a single validity and a
                 flat parameters array, so a period is a resource and there is no
                 form for several in one.

                 Wrapped for the same reason as the resourceIds above: JSONata
                 collapses a one-element sequence to a bare value, so a one-day
                 forecast would answer with an object where every other N answers
                 with a list. */
              "resources": [$map($kept, function($day) {
                {
                  "id": $resourceId($day),
                  /* Required by Commitment.resources in the spec, which defines
                     no quantity property and no Quantity schema anywhere -- a
                     defect upstream, so any value validates. {"count": n} is the
                     shape the spec's own example path implies
                     ($.message.order.items[0].quantity.count) and the one the
                     network's other packs use; the bare `1` this file used to
                     emit validated only because nothing constrains it. One
                     resource is one day. */
                  "quantity": { "count": 1 },
                  "resourceAttributes": {
                    "@context": $ctx,
                    "@type": "openagrinet:WeatherObservation",
                    "informationMode": "Direct",
                    "observationType": "Forecast",
                    "subjectCategories": ["Weather"],
                    "source": {
                      "sourceId": "mausamgram",
                      "sourceName": "IMD Mausamgram NWP",
                      "sourceUri": "https://mausamgram.imd.gov.in/"
                    },
                    /* The same point on every resource: one call answers one
                       location, and $lat/$lon resolved it once at the top. */
                    "location": {
                      "type": "Point",
                      "coordinates": [$lon, $lat]
                    },
                    "generatedAt": $generatedAt,
                    "modelRunAt": $modelRunAt,
                    /* This resource reports one day, so its validity opens and
                       closes on it. */
                    "validity": {
                      "startsAt": $dayStart($day.date),
                      "endsAt": $dayEnd($day.date)
                    },
                    /* Non-empty by construction: $kept dropped every day for
                       which this returns nothing. */
                    "parameters": $paramsFor($day)
                  }
                }
              })]
            }
          ]
        }
      }
    }
  )
