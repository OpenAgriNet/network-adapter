# POCRA, openagrinet:AgricultureFacility, select. Both directions, one file.
#
# One file per binding-action rather than one per direction, because both legs of
# an exchange are one contract: the response has to answer the request that was
# sent, and splitting them lets one change without the other.
#
# The registry entry pointing here decides which action this serves, so nothing
# in the file names it. The filename's action segment must match that entry --
# a mismatch would apply a correct mapping to the wrong call, silently.
#
# Both halves read:
#   beckn     the inbound Beckn payload
# and the response half additionally reads:
#   response  POCRA's answer, in its own shape
#
# WHERE THE QUERY LIVES, and why it is not in resourceAttributes.
#
# An inbound query resource is informationMode OnDemand. The search origin is
# read from the Beckn fulfillment stop and the requested type from
# supportedFacilityTypes, rather than from location/address/facilityType on
# resourceAttributes -- a convention this file chooses to keep, not a schema
# requirement: the AgricultureFacility v0.1 pack no longer forbids those
# fields under OnDemand (it did until network-specs commit b76c9ad8a5 on
# schema-packs-v0.1 quietly dropped that constraint; see
# dev_docs/schema-onDemand-forbid-removed.md). Nothing here depends on the
# constraint being back -- the search origin still has nowhere verified to go
# in resourceAttributes, since POCRA returns no per-facility coordinate for
# the searched point.
#
# The pack's own query example agrees: examples/on-demand-facility-discovery.json
# is an OnDemand resource carrying supportedFacilityTypes and coverageAreas and
# NO location, address or facilityType. So the convention is the pack's shape
# for a query, not only this file's preference.
#
# STILL PROVISIONAL in one respect: the shape of the fulfillment stop the
# search origin is read from comes from the design, not from a payload captured
# from the network -- the pack's example says nothing about the stop. Confirm
# that before the registry row goes live.

# What this capability cannot serve, refused before the provider is called.
#
# A predicate that is false refuses the request with the message beside it, so
# the caller is told what is wrong with their payload rather than that an
# expression somewhere returned false. Each check is its own expression and binds
# for itself; the first failure is the one reported.
#
# Sending an unservable payload anyway earns POCRA's own schema NACK, whose
# instanceLocation names a JSON pointer into a request the caller never saw.
required:
  - check: |
      (
        $geo := beckn.message.contract.commitments[0].fulfillment.stops[0].location.geo;
        $exists($geo) and $geo.type = "Point" and $count($geo.coordinates) = 2
      )
    message: "this capability needs a fulfillment stop with a Point location; POCRA searches around one point at a time"
  - check: |
      (
        $requested := [beckn.message.contract.commitments[0].resources[0].resourceAttributes.supportedFacilityTypes];
        $governed := ["CustomHiringCentre", "KrishiVigyanKendra", "Warehouse", "SoilTestingFacility"];
        $count($requested) > 0 and $count($requested[$ in $governed]) = $count($requested)
      )
    message: "every entry in supportedFacilityTypes must name a governed facility type: CustomHiringCentre, KrishiVigyanKendra, Warehouse or SoilTestingFacility"
  - check: |
      (
        $requested := [beckn.message.contract.commitments[0].resources[0].resourceAttributes.supportedFacilityTypes];
        $count($requested) = $count($distinct($requested))
      )
    message: "supportedFacilityTypes must not repeat a facility type"

# ONE call per payload, and this file is written for exactly that.
#
# POCRA's search takes exactly ONE category code: a comma-separated pair
# ("kvk,warehouse") answers 200 with no providers at all, and a category array
# is refused with "Schema validation failed" -- both verified against the live
# API. So a payload asking for two facility types cannot be served by one call,
# however this file is written.
#
# The plugin handles that before this file is reached. It reads
# supportedFacilityTypes out of the payload, splits a multi-type search into
# one single-type payload per type, runs each of them concurrently and merges
# the answers -- see AgricultureFacility/search.go. So what arrives here always
# names exactly one facility type, and both halves below read it straight off
# the payload with no variable injected from Go.
#
# The cost of that, for whoever edits this file next: the required: checks
# above read supportedFacilityTypes in JSONata, and search.go reads the same
# path in Go. If the Beckn payload moves that field, BOTH change, and only
# this one is a config edit.

# The upstream is a POST, so this object becomes the request body.
#
# This is where the extraction lives, deliberately. When POCRA wants another
# parameter it is an edit here and nothing else: no Go, no rebuild, live on the
# next cache expiry.
#
# $codes is the ONLY place POCRA's private vocabulary appears. Adding a facility
# type is one line here, one line in the inverse table below, and one more entry
# in the precondition's list.
#
# GeoJSON is [lon, lat] -- longitude first -- and POCRA's gps is "lat,lon".
# Reading them the same way round gives a point in the wrong place that is still
# a valid request, so it fails as wrong data rather than as an error.
#
# context.timestamp is epoch SECONDS as a string. Every other timestamp in both
# protocols is ISO 8601, and POCRA's schema refuses one here.
#
# domain, version, bap_id and bap_uri are POCRA's request contract rather than
# this adapter's identity. Identity on the wire is the adapter's own: it signs
# what it answers with, using the key the registry publishes for it.
request: |
  (
    $commitment := beckn.message.contract.commitments[0];
    $stop := $commitment.fulfillment.stops[0];
    /* This call's own facility type. The payload names exactly one, because
       the plugin split a multi-type search into one payload per type before
       this ran -- reading [0] of a multi-type list here is what made such a
       search return one type and silently drop the rest. */
    $requested := [beckn.message.contract.commitments[0].resources[0].resourceAttributes.supportedFacilityTypes][0];
    $codes := {
      "CustomHiringCentre": "chc",
      "KrishiVigyanKendra": "kvk",
      "Warehouse": "warehouse",
      "SoilTestingFacility": "soil_lab"
    };
    /* THIS CALL'S OWN message_id, derived from the caller's by replacing its
       last hex digit with a slot this facility type owns.

       POCRA caches per message_id for PT10M and returns the UNION of
       everything asked under it, so two calls sharing an id each come back
       carrying the other's facilities. Worse, that cache IGNORES LOCATION:
       verified live, the same id asked twice 350km apart returned the first
       location's facility alongside the second's, which no type filter can
       catch because the type matches. So the caller's own id cannot be sent
       as it stands.

       The last character of a v4 UUID is in the node field, not the version
       or variant nibbles, so replacing it leaves a valid UUID -- which POCRA's
       schema requires. Derived rather than random because this expression has
       no random source: JSONata here has no $uuid.

       The TYPE picks the slot, not a call index, because each payload reaching
       here names exactly one type. That also makes a retry reuse its own slot
       rather than take a fresh one. */
    $slots := {
      "CustomHiringCentre": "0",
      "KrishiVigyanKendra": "1",
      "Warehouse": "2",
      "SoilTestingFacility": "3"
    };
    $callerId := beckn.context.messageId;
    $messageId := $substring($callerId, 0, 35) & $lookup($slots, $requested);
    {
      "context": {
        "domain": "advisory:mh-vistaar",
        "location": { "country": { "name": "IND" } },
        "action": "search",
        "version": "1.1.0",
        "bap_id": "bap.mahapocra.gov.in",
        "bap_uri": "https://middleware.mahapocra.gov.in/bap/",
        /* Derived above, one slot per facility type. NOT the caller's own id:
           POCRA's cache is keyed on it and ignores location. */
        "message_id": $messageId,
        "transaction_id": beckn.context.transactionId,
        "timestamp": $string($floor($millis() / 1000))
      },
      "message": {
        "intent": {
          "category": { "descriptor": { "code": $lookup($codes, $requested) } },
          "item": { "descriptor": { "name": "service-locations" } },
          "fulfillment": {
            "stops": [
              {
                "location": {
                  "gps": $string($stop.location.geo.coordinates[1]) & "," & $string($stop.location.geo.coordinates[0])
                },
                "time": {
                  "range": {
                    "start": $exists($stop.time.range.start) ? $stop.time.range.start : $now()
                  }
                }
              }
            ]
          }
        }
      }
    }
  )

# Keyed by direction, not by the action it produces: a select is answered by an
# on_select over the same HTTP round trip, so the callback is this half rather
# than an action of its own.
#
# POCRA answers with responses[], one entry per BPP that replied, each carrying
# its own catalog. Every facility is an item inside one of them, so the path
# flattens all four levels at once.
response: |
  (
    $selected := beckn.message.contract.commitments[0];

    /* The caller's own @context, echoed back rather than restated here.
       Hardcoding the pack URL meant this file had to know which one is current,
       and could contradict what the request actually declared. Not enforced by
       a required check above -- an absent @context here means an absent one on
       the way out too, which degrades the JSON-LD rather than breaking pack
       conformance (conformance_test.go treats @context as conventional, not a
       schema property).

       Backticks because @ is an operator in JSONata. */
    $ctx := $selected.resources[0].resourceAttributes.`@context`;
    $resourceId := function($item) { "res:pocra:facility:" & $item.id };

    /* The inverse of the request half's $codes. Read from the item's OWN
       category tag rather than echoed from the request, so an answer carrying
       more than one category still labels each facility correctly. */
    $types := {
      "chc": "CustomHiringCentre",
      "kvk": "KrishiVigyanKendra",
      "warehouse": "Warehouse",
      "soil_lab": "SoilTestingFacility",
      /* The warehouse BPP labels its fulfillment GSW rather than "warehouse",
         and its items carry no category tag at all, so this is the only place
         a warehouse says what it is. */
      "GSW": "Warehouse"
    };

    /* EVERY type the payload asked for, as a list. The answer is filtered to
       this set rather than to its first entry -- filtering to [0] is what made a
       two-type search drop a type. */
    $requestedTypes := [$selected.resources[0].resourceAttributes.supportedFacilityTypes];

    /* POCRA states a provider's facility type in the provider's own id:
       COMMON_PROVIDER_KVK, COMMON_PROVIDER_CHC, COMMON_PROVIDER_SOIL_LAB. That
       is the outermost and most reliable statement of what a group of items is,
       because POCRA groups items under one provider per category.

       $contains first because $substringAfter returns the WHOLE string when the
       separator is absent, so "WAREHOUSE001" would otherwise become the code
       "warehouse001" and look like a deliberate answer rather than no answer.
       Warehouse providers are named that way and state their type only in their
       fulfillment, so they fall through to the sources below. */
    $providerCode := function($id) {
      $contains($id, "COMMON_PROVIDER_")
        ? $lowercase($substringAfter($id, "COMMON_PROVIDER_"))
    };

    /* Every facility POCRA returned, each carrying the type it actually is.
       Walked per PROVIDER rather than flattened straight to items, because both
       of the reliable statements of type are the provider's -- a warehouse item
       carries no category tag of its own at all.

       Three sources, narrowest-trusted first: the provider's id, then the
       item's own category tag, then the provider's fulfillment category. The
       provider id leads because it is what POCRA groups by; the item tag is
       kept as a second source so a provider that ever mixed categories still
       labels each facility correctly; the fulfillment is what a warehouse has
       instead of either.

       Nothing falls back to what was REQUESTED. Doing that relabels a leaked
       facility as the thing being searched for, which is how a warehouse comes
       back as a Krishi Vigyan Kendra. An item none of the three can type stays
       untyped and is dropped by the filter below -- POCRA also returns
       administrative and mandi providers, which are not facilities at all. */
    /* POCRA writes "Unknown", "N/A" and "000000" where it has no value.
       Publishing them would put junk on the network under a governed schema, so
       a value that is one of them is treated as absent. A ternary with no else
       yields nothing, which is how a field is omitted rather than nulled. */
    $clean := function($value) {
      ($exists($value) and $value != "" and $value != "Unknown"
        and $value != "N/A" and $value != "000000" and $value != "-") ? $value
    };

    /* $number($substringBefore(...)) THROWS on anything it cannot parse, and
       that throw is not local: it propagates out of the whole response
       mapping, so one placeholder on one item's distance or capacity failed
       the ENTIRE search, good facilities included. $exists() cannot guard
       it -- $exists($number(...)) evaluates its argument first, so the throw
       fires before $exists is ever reached.

       $clean strips the placeholders this file already knows POCRA writes
       ("Unknown", "N/A", "000000", "-"); $type/$match then confirms what is
       left actually looks like "<number><space><unit>" before $number ever
       sees it. Same shape as $priced in agmarknet/mandi-price.select.yaml,
       and for the same reason: $match() itself throws T0410 on a non-string,
       so the string check has to come first rather than be folded into the
       regex.

       Returns nothing when the value cannot be read as a number -- absent,
       not zero, so a caller cannot mistake "not reported" for "reported as
       none". */
    $numericPrefix := function($tagged) {
      (
        $head := $clean($substringBefore($tagged, " "));
        $exists($head) and $type($head) = "string" and $match($head, /^[0-9]+(\.[0-9]+)?$/)
          ? $number($head)
      )
    };

    $labelled := response.responses.message.catalog.providers.(
      $provider := $;
      $fromProvider := $lookup($types, $providerCode($provider.id));
      /* NOT a single $lookup($types, ....descriptor.code): a provider with more
         than one fulfillment, or a fulfillment with more than one category,
         makes descriptor.code a SEQUENCE rather than a string, and $lookup
         throws T0410 on anything but a scalar key. One bad provider shape then
         took the whole response down, all items included -- not just the ones
         with more than one category.

         Each code is looked up on its own instead, and the first that resolves
         to a governed type wins. A provider that never mixes categories still
         gets exactly the $lookup($types, code) it had before, since a
         one-element sequence maps to a one-element result. */
      $fromFulfillment := (
        $resolved := [$provider.fulfillments.categories.descriptor.code].($lookup($types, $));
        $resolved[$exists($)][0]
      );
      $map($provider.items, function($item) {
        {
          "item": $item,
          "type": (
            /* Same T0410 hazard as $fromFulfillment above: an item carrying
               more than one category tag makes .value a SEQUENCE, and $lookup
               throws on anything but a scalar key. Same fix -- look up each
               code on its own and take the first that resolves. */
            $tagged := (
              $resolved := [$item.tags.list[descriptor.code = "category"].value].($lookup($types, $));
              $resolved[$exists($)][0]
            );
            $exists($fromProvider) ? $fromProvider
              : $exists($tagged) ? $tagged
              : $fromFulfillment
          )
        }
      })
    );

    /* A search is answered with the types it asked for and nothing else,
       whatever POCRA chose to include.

       It includes more than was asked for, verified against the live API: it
       caches per message_id for PT10M and ACCUMULATES across searches sharing
       one, so a kvk search under a reused message_id comes back carrying the chc
       facilities of an earlier one. The step now sends a fresh message_id per
       call, which stops this adapter causing it; the filter stays because a
       provider deciding what to include is not something a mapping should
       trust either way. */
    $wanted := $labelled[type in $requestedTypes];

    /* The same facility appears in more than one responses[] entry, so grouping
       by id keeps one of each; [0] takes the first where a key collected
       several. A repeated id in the answer would be a dangling reference the
       moment anything resolved it. */
    $unique := $each($wanted{ item.id: $ }, function($grouped) { $grouped[0] });

    /* POCRA ranks by distance and reports it only as a string with a unit --
       "165 Km". It is parsed to sort by and then dropped: the pack states that
       query-relative distance is not an intrinsic facility attribute, and
       belongs in result metadata rather than on the facility.

       Sorting the strings would put "165 Km" before "98 Km", which nothing
       downstream could detect. An item with no distance sorts last, which is
       what an absent ranking should mean. */
    $reading := function($item) {
      (
        /* A duplicated distance tag makes .value a sequence, and
           $numericPrefix's $substringBefore throws on anything but a string
           before the $type guard inside it is ever reached. Take the first. */
        $values := [$item.tags.list[descriptor.code = "distance"].value];
        $numericPrefix($values[0])
      )
    };
    $sorted := $map($unique, function($entry) {
      (
        $distance := $reading($entry.item);
        {
          "facility": $entry.item,
          "type": $entry.type,
          "distance": $exists($distance) ? $distance : 1e9
        }
      )
    })^(distance);

    /* POCRA reports a warehouse's capacity as one string with a unit --
       "500 tons" -- and reports it for no other facility type. The pack has a
       home for it, so dropping it would discard the most useful thing a
       warehouse search returns.

       No basis: the pack's example says "total storage", but POCRA does not say
       which it means and guessing would put an unverified claim under a governed
       field. */
    $capacity := function($item) {
      (
        /* A duplicated capacity_estimate tag makes .value a sequence -- same
           T0410 hazard as distance, above. Take the first. */
        $values := [$item.tags.list[descriptor.code = "capacity_estimate"].value];
        $reported := $values[0];
        /* value guarded the same way distance is, above -- "Unknown" or any
           other placeholder must not reach $number. unit is left unguarded
           deliberately: it is only ever read when value parsed, and at that
           point substringAfter on the same string that just matched the
           numeric-prefix regex cannot itself throw. */
        $value := $numericPrefix($reported);
        $exists($value) ? {
          "value": $value,
          "unit": $substringAfter($reported, " ")
        }
      )
    };

    /* A Beckn Address, shaped the way the pack's own Direct examples shape one:
       streetAddress is the facility's own line, addressLocality is the
       settlement, and extendedAddress carries the administrative tail --
       "Rahta, Ahmednagar district" in examples/custom-hiring-centre.json, which
       is where the district's own word "district" comes from.

       addressLocality is not cosmetic. profile.json lists
       address.addressLocality under BOTH indexable_paths and filterable_paths,
       so a facility that leaves it unset cannot be found by locality at all --
       which is what putting every administrative part in extendedAddress did.

       POCRA's village is the settlement when it reports one; its taluka is the
       nearest thing when it does not, and is then not repeated in the tail.
       POCRA also repeats the village AS the taluka on some items ("Shrirampur"
       for both), so an identical taluka is dropped from the tail rather than
       published twice in one address.

       addressRegion is Maharashtra because POCRA is that state's aggregator and
       publishes nothing outside it. POCRA's own address.region is NOT read for
       it: that field carries a revenue division ("Pune") or "Unknown", never
       the state. */
    $address := function($item) {
      (
        $village := $clean($item.address.vilage);
        $taluka := $clean($item.address.taluka);
        $district := $clean($item.address.district);
        /* Bound separately rather than inline in the array, because a ternary
           with no else inside an array constructor reads ambiguously against
           the element comma. */
        $tailTaluka := ($exists($village) and $taluka != $village) ? $taluka;
        $tailDistrict := $exists($district) ? $district & " district";
        $tail := [$tailTaluka, $tailDistrict];
        {
          "streetAddress": $clean($item.address.address),
          "addressLocality": $exists($village) ? $village : $taluka,
          "extendedAddress": $count($tail) > 0 ? $join($tail, ", "),
          "postalCode": $clean($item.address.pinCode),
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        }
      )
    };

    /* Organisational contact only. The pack restricts publicContact to contact
       data approved for catalog publication, and POCRA's person field is an
       office rather than an individual. Omitted entirely when there is nothing
       usable, rather than emitted empty. */
    $contact := function($item) {
      (
        $company := $clean($item.contact.person);
        $phone := $clean($item.contact.phone);
        $email := $clean($item.contact.email);
        ($exists($company) or $exists($phone) or $exists($email)) ? {
          "company": $company,
          "phone": $phone,
          "email": $email
        }
      )
    };

    /* What each governed facility type IS, per the pack's four Direct examples.
       Both tables are copied from them rather than composed here:

         examples/custom-hiring-centre.json    Facility, Crop, Practice
                                               FARM_MACHINERY_HIRE
         examples/krishi-vigyan-kendra.json    Facility, Crop, Livestock, Practice
                                               FARM_ADVISORY, FARMER_TRAINING
         examples/warehouse.json               Facility, Crop, Market
                                               GENERAL_STORAGE
         examples/soil-testing-facility.json   Facility, Crop
                                               SOIL_TESTING

       Keyed on the TYPE, which POCRA does state per facility -- see $labelled
       above, where the type comes from the provider's id, the item's category
       tag or the provider's fulfillment, and never from what was requested. An
       item whose type none of those three can establish is dropped before it
       reaches here, so neither table is ever consulted with a guess.

       This follows from the type rather than asserting anything POCRA left
       unsaid: what a Custom Hiring Centre hires out, or a Soil Testing Facility
       tests, is what the governed type MEANS. Both lists are discovery surface
       the pack indexes -- profile.json lists subjectCategories and
       services[].code under both indexable_paths and filterable_paths -- so
       "Facility" alone and no services made every facility unfilterable by
       domain or by service.

       What is deliberately NOT derived this way: languages, website,
       lastUpdatedAt and capacity.basis appear in those same examples, but none
       of them follows from the TYPE. They are per-facility facts POCRA does not
       report, so they stay absent rather than become a guess. */
    $categories := {
      "CustomHiringCentre": ["Facility", "Crop", "Practice"],
      "KrishiVigyanKendra": ["Facility", "Crop", "Livestock", "Practice"],
      "Warehouse": ["Facility", "Crop", "Market"],
      "SoilTestingFacility": ["Facility", "Crop"]
    };
    $serviceList := {
      "CustomHiringCentre": [
        {
          "code": "FARM_MACHINERY_HIRE",
          "name": "Farm machinery hire",
          "shortDesc": "Access to agricultural machinery and implements."
        }
      ],
      "KrishiVigyanKendra": [
        { "code": "FARM_ADVISORY", "name": "Farm advisory" },
        { "code": "FARMER_TRAINING", "name": "Farmer training" }
      ],
      "Warehouse": [
        { "code": "GENERAL_STORAGE", "name": "General agricultural storage" }
      ],
      "SoilTestingFacility": [
        {
          "code": "SOIL_TESTING",
          "name": "Soil sample testing",
          "shortDesc": "Laboratory testing of soil samples for agricultural use."
        }
      ]
    };

    $attributes := function($item, $facilityType) {
      {
        "@context": $ctx,
        "@type": "openagrinet:AgricultureFacility",
        "informationMode": "Direct",
        /* REQUIRED by AgricultureResource v0.1, and the AgricultureFacility
           pack additionally requires this list to CONTAIN "Facility". It is
           the pack's broad discovery category, deliberately coarse: the
           concrete kind is facilityType below.

           The further domains come from $categories above, which is the pack's
           own examples rather than a judgement made here. Wrapped in [] because
           JSONata collapses a one-element sequence to a bare value. */
        "subjectCategories": [$lookup($categories, $facilityType)],
        "facilityType": $facilityType,
        "address": $address($item),
        /* The type's own published services, from $serviceList above. Wrapped
           in [] for the same reason: Warehouse and SoilTestingFacility name one
           service each, and a bare object where the pack requires an array is
           a schema failure rather than a cosmetic one. */
        "services": [$lookup($serviceList, $facilityType)],
        "capacity": $capacity($item),
        /* sourceUri rather than website: contact.webUrl is POCRA's own site
           repeated on every item, so it identifies the source and not the
           facility. */
        "source": {
          "sourceId": "pocra",
          "sourceName": "PoCRA Provider Aggregator Services",
          "sourceUri": $clean($item.contact.webUrl)
        },
        "publicContact": $contact($item)
      }
    };
    {
      /* Correlation only: the ids that tie this answer to the request that
         asked for it, and nothing that asserts who anybody is.

         bapId, bapUri, bppId and bppUri are deliberately absent. A mapping is a
         payload transformation -- it has no business asserting network identity,
         and the two Uri fields it could copy are whatever the caller happened to
         send, which in a deployed stack is a container-internal address that
         means nothing to anyone outside it. */
      "context": {
        "version": beckn.context.version,
        "action": "on_select",
        "networkId": beckn.context.networkId,
        "transactionId": beckn.context.transactionId,
        "messageId": beckn.context.messageId,
        "timestamp": $now()
      },
      "message": {
        "contract": {
          "commitments": [
            {
              /* DRAFT, not QUOTED. The Beckn v2 status enum is DRAFT, ACTIVE and
                 CLOSED, and a quote is still a draft: nothing is committed until
                 init and confirm. QUOTED read better and validated nowhere. */
              "status": {
                "descriptor": { "code": "DRAFT", "name": "Draft" }
              },
              /* The offer is echoed, but its references are not: the request
                 named an abstract facility search, and the answer returns the
                 concrete facilities that satisfy it. Leaving resourceIds as they
                 arrived would point the offer at an id that appears nowhere in
                 the answer.

                 $merge keeps everything else the request offered -- the id, the
                 descriptor, the provider -- and replaces one key. */
              "offer": $merge([
                $selected.offer,
                { "resourceIds": [$map($sorted, function($entry) { $resourceId($entry.facility) })] }
              ]),
              /* Wrapped in [] because JSONata collapses a one-element sequence
                 to a bare value, so a single facility would answer with an
                 object where every other count answers with a list. */
              "resources": [$map($sorted, function($entry) {
                {
                  "id": $resourceId($entry.facility),
                  /* Required by Commitment.resources in the spec, which defines
                     no quantity property and no Quantity schema anywhere -- a
                     defect upstream. One resource is one facility, so one. */
                  "quantity": 1,
                  /* Direct mode requires @type, informationMode, facilityType
                     and source, plus one of location or address.

                     location is deliberately absent: POCRA returns no verified
                     per-facility coordinate, and the pack forbids substituting
                     the search origin for one.

                     website, lastUpdatedAt and capacity.basis are absent for
                     a related reason -- POCRA supplies none of them per
                     facility, and taking lastUpdatedAt from the time of the
                     fetch, or a basis from the pack's example wording, would
                     assert something nobody verified. services and the wider
                     subjectCategories ARE emitted, because those follow from
                     the governed facility type rather than from the item. */
                  "resourceAttributes": $attributes($entry.facility, $entry.type)
                }
              })]
            }
          ]
        }
      }
    }
  )
