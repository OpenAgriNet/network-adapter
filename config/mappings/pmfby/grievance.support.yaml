# PMFBY support -> POST /krphapi/FGMS/AddKRPHNCIPGrievenceSupportTicket.
# Files a grievance; no OTP. channels[0] holds the provider, the enrolment and
# the complaint. "Grievence" is PMFBY's spelling. Field formats are the pack's.

request: |
  (
    $ch := beckn.message.support.channels[0];
    $g := $ch.grievance;
    $at := "$.message.support.channels[0].";
    /* First missing required field, with its path. */
    $missing := [
      { "field": "enrolmentId", "path": $at & "enrolmentId", "present": $exists($ch.enrolmentId) },
      { "field": "applicantMobile", "path": $at & "applicantMobile", "present": $exists($ch.applicantMobile) },
      { "field": "cropYear", "path": $at & "cropYear", "present": $exists($ch.cropYear) },
      { "field": "season", "path": $at & "season", "present": $exists($ch.season) },
      { "field": "grievance.description", "path": $at & "grievance.description", "present": $exists($g.description) }
    ][$not(present)][0];
    $seasons := { "Kharif": "1", "Rabi": "2", "Zaid": "3" };
    /* PMFBY takes the filing day as a date in IST. */
    $filed := $exists($ch.complaintDate) ? $toMillis($ch.complaintDate) : $millis();
    $missing
    ? { "_error": { "status": 400, "code": "SCH_REQUIRED_FIELD_MISSING",
                    "message": $missing.field & " is required", "path": $missing.path } }
    : {
      "requestorMobileNo": $ch.applicantMobile,
      "applicationNo": $ch.enrolmentId,
      "requestYear": $string($ch.cropYear),
      "requestSeason": $lookup($seasons, $ch.season),
      /* PMFBY's published pair, sent when the caller names none. */
      "ticketCategoryID": $exists($g.category.code) ? $string($g.category.code) : "3",
      "ticketSubCategoryID": $exists($g.subCategory.code) ? $string($g.subCategory.code) : "10",
      "grievenceDescription": $trim($g.description),
      "complaintDate": $fromMillis($filed, "[Y0001]-[M01]-[D01]", "+0530"),
      /* This adapter's receipt source id, unless the caller names its own. */
      "receiptSourceID": $exists($ch.receiptSourceId) ? $string($ch.receiptSourceId) : "134306"
    }
  )

# Echoes the request and adds the ticket; filedOn is the filing time in UTC.
# A refusal PMFBY is known to give is a 400 in our words; any other failure is
# a 502. PMFBY's own message is logged as the cause, never returned.
response: |
  (
    $ch := beckn.message.support.channels[0];
    $g := $ch.grievance;
    $ticketNo := response.responseDynamic.GrievenceSupportTicketNo;
    $said := $type(response.responseMessage) = "string" ? $trim(response.responseMessage);
    /* PMFBY answers every failure with responseCode "0", so its wording is the
       only way to tell the caller's mistake from PMFBY's own fault. Keyed in
       lower case. Drop this once PMFBY sends a code per refusal. */
    $refusals := {
      "mobile number not matched": "The phone number does not match the one registered for this application number.",
      "application details not exists": "No PMFBY application was found for this application number."
    };
    $refusal := $said ? $lookup($refusals, $lowercase($said));
    $filed := $exists($ch.complaintDate) ? $toMillis($ch.complaintDate) : $millis();
    /* responseCode "1" (string or number) with a ticket, "Ticket Already Raised" included. */
    $string(response.responseCode) = "1" and ($type($ticketNo) = "string" or $type($ticketNo) = "number")
    ? {
      "context": $merge([beckn.context, { "action": "on_support", "timestamp": $now() }]),
      "message": {
        "support": {
          "channels": [{
            "@context": $ch.`@context`,
            "@type": $ch.`@type`,
            "informationMode": "Direct",
            /* Stated, not echoed: the caller may send only the ids. */
            "provider": { "id": $ch.provider.id, "descriptor": { "name": "PMFBY Grievance Portal" } },
            "scheme": { "code": "PMFBY", "name": "Pradhan Mantri Fasal Bima Yojana" },
            "enrolmentId": $ch.enrolmentId,
            /* The codes sent, defaults included; a name beside a code is dropped. */
            "grievance": {
              "category": { "code": $exists($g.category.code) ? $string($g.category.code) : "3" },
              "subCategory": { "code": $exists($g.subCategory.code) ? $string($g.subCategory.code) : "10" },
              "description": $g.description
            },
            "case": {
              "ticketNo": $string($ticketNo),
              "status": { "code": "Registered" },
              "filedOn": $fromMillis($filed, "[Y0001]-[M01]-[D01]T[H01]:[m01]:[s01]Z")
            }
          }]
        }
      }
    }
    : $exists($refusal)
    ? { "_error": { "status": 400, "code": "BIZ_GENERIC_ERROR", "message": $refusal, "cause": $said } }
    : { "_error": { "status": 502, "code": "NET_DOWNSTREAM_UNAVAILABLE",
                    "message": "PMFBY could not register the grievance right now. Please try again later.",
                    "cause": $said } }
  )
