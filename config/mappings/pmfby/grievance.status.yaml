# PMFBY, openagrinet:PMFBYGrievance, status -> POST /GetGrievenceTicketsStatus.
# Both directions, one file.
#
# Step three: read a filed grievance back. PMFBY matches the ticket to the phone
# it was filed from, so both are required.
#
# The response is an allow-list. PMFBY's record also carries the farmer's name,
# address and policy details; none of it is mapped.

# A missing field is refused by the request half under _error, which can name
# SCH_REQUIRED_FIELD_MISSING.
request: |
  (
    $ca := beckn.message.contract.commitments[0].commitmentAttributes;
    $not($exists($ca.applicantPhone) and $exists($ca.case.ticketNo))
    ? { "_error": { "status": 400, "code": "SCH_REQUIRED_FIELD_MISSING",
                    "message": "checking a grievance needs applicantPhone and case.ticketNo" } }
    : {
      "requestorMobileNo": $ca.applicantPhone,
      "GrievenceSupportTicketNo": $ca.case.ticketNo
    }
  )

# No case record in the reply is not a failure -- PMFBY answered and has
# nothing on file -- so it is a 202 ACK saying so. Otherwise the grievance is
# the complaint as PMFBY holds it, the case is the record it keeps against it,
# and a field PMFBY does not return is left out. The category comes back by
# name alone: PMFBY returns no category id on a case read.
response: |
  /* A 4xx from PMFBY arrives under _status; it is PMFBY's refusal, left to
     the adapter's 502 rather than read as nothing on file. */
  $exists(_status)
  ? {}
  : $type(response.responseDynamic) != "object"
  ? { "_error": { "status": 202, "code": "BIZ_NO_RESULTS_FOUND",
                  "message": "No grievance matches this ticket and phone number." } }
  : (
    $commitment := beckn.message.contract.commitments[0];
    $ca := $commitment.commitmentAttributes;
    $ticket := response.responseDynamic;
    /* PMFBY may send null or "" for a field it has no value for; such a
       field is dropped rather than mapped as "null" or failing the call. */
    $isText := function($v) { $type($v) = "string" and $v != "" };
    {
      "context": $merge([beckn.context, { "action": "on_status", "timestamp": $now() }]),
      "message": {
        "contract": $merge([beckn.message.contract, {
          "commitments": [$merge([$commitment, {
            "status": { "descriptor": { "code": "ACTIVE" } },
            "commitmentAttributes": {
              "@context": $ca.`@context`,
              "@type": $ca.`@type`,
              "informationMode": "Direct",
              "scheme": $ca.scheme,
              "enrolmentId": $isText($ticket.ApplicationNo) ? $ticket.ApplicationNo,
              "grievance": {
                "category": $isText($ticket.TicketCategoryName) ? { "name": $ticket.TicketCategoryName },
                "subCategory": $isText($ticket.TicketSubCategoryName) ? { "name": $ticket.TicketSubCategoryName },
                "description": $isText($ticket.GrievenceDescription) ? $ticket.GrievenceDescription
              },
              "case": {
                "ticketNo": $ca.case.ticketNo,
                /* code is the network's word, name the portal's phrase. PMFBY
                   publishes no status vocabulary, so every phrase is one the
                   adapter does not recognise and maps to UnderReview, which is
                   never a closed state. Recognised phrases are added here once
                   PMFBY confirms them. */
                "status": {
                  "code": "UnderReview",
                  "name": $isText($ticket.TicketStatus) ? $ticket.TicketStatus
                },
                "filedOn": $isText($ticket.ComplaintDate) ? $ticket.ComplaintDate
              }
            }
          }])]
        }])
      }
    }
  )
