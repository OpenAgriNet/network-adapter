# PMFBY status -> POST /krphapi/FGMS/GetGrievenceTicketsStatus.
# Reads a grievance back by ticket number and phone. Only listed fields are
# returned; the farmer's personal details are dropped.
# Required fields and formats are checked by the Grievance pack.

request: |
  (
    $attributes := beckn.message.contract.commitments[0].commitmentAttributes;
    {
      "requestorMobileNo": $attributes.applicantMobile,
      "GrievenceSupportTicketNo": $attributes.case.ticketNo
    }
  )

# Empty PMFBY fields are dropped. No record, or none naming the ticket asked
# for, is a 400 in our words; any other failure is a 502. PMFBY's message is
# logged -- stripped of the request it quoted -- and never returned.
response: |
  (
    /* Constants */
    $PMFBY_SUCCESS_CODE := "1";
    $SCHEME := { "code": "PMFBY", "name": "Pradhan Mantri Fasal Bima Yojana" };
    $INFORMATION_MODE := "OnDemand";
    $COMMITMENT_STATUS_ACTIVE := "ACTIVE";
    $DEFAULT_CASE_STATUS := "UnderReview";
    $CASE_STATUS_CODES := { "open": "Registered", "resolved": "Resolved" };
    $SEASON_NAMES := { "1": "Kharif", "2": "Rabi", "3": "Zaid" };
    /* filedOn is a calendar date, and the day is the one the farmer filed on
       -- PMFBY is an Indian portal, so a late-evening filing is that day in
       IST and the day before in UTC. */
    $DATE_FORMAT := "[Y0001]-[M01]-[D01]";
    $IST_OFFSET := "+0530";

    /* e.g. "2026-10-12T11:02:49.000Z" */
    $RFC3339_PATTERN := /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$/;
    $DIGITS_PATTERN := /^[0-9]+$/;
    $YEAR_PATTERN := /^[0-9]{4}$/;

    $MSG_NOT_FOUND := "No grievance was found for this ticket number and phone number.";
    $MSG_NO_FILING_DATE := "PMFBY returned the grievance without a usable filing date.";
    $MSG_UNAVAILABLE := "PMFBY could not return the grievance status right now. Please try again later.";

    $ERROR_REFUSED := { "status": 400, "code": "BIZ_GENERIC_ERROR" };
    $ERROR_UNAVAILABLE := { "status": 502, "code": "NET_DOWNSTREAM_UNAVAILABLE" };
    /* PMFBY fails everything with responseCode "0", so its wording (lower case)
       is the only way to tell a caller mistake from a PMFBY fault. */
    $KNOWN_REFUSALS := { "no record found": $MSG_NOT_FOUND };

    /* Helpers */
    /* PMFBY sends null or "" for missing values. */
    $isText := function($value) { $type($value) = "string" and $value != "" };
    $asText := function($value) { $isText($value) ? $value };
    /* Ids come as numbers or digit strings, and 0 means none. */
    $asId := function($value) {
      ($type($value) = "number" or $type($value) = "string")
        and $contains($string($value), $DIGITS_PATTERN) and $number($string($value)) != 0
        ? $string($value)
    };
    /* Drops an object with no fields instead of sending {}. */
    $omitIfEmpty := function($object) { $exists($keys($object)[0]) ? $object };
    $error := function($kind, $message, $cause) {
      { "_error": $merge([$kind, { "message": $message, "cause": $cause }]) }
    };

    /* Inputs */
    $commitment := beckn.message.contract.commitments[0];
    $attributes := $commitment.commitmentAttributes;
    $requestedTicket := $string($attributes.case.ticketNo);
    /* The record that NAMES the ticket asked for, searched across every record
       returned rather than taken from the first. PMFBY reads by phone, so the
       list can hold this farmer's other grievances, and a record that does not
       name its own ticket cannot be shown as the answer to this one. The
       predicate reads a bare record and a list alike. */
    $record := response.responseDynamic[$string(GrievenceSupportTicketNo) = $requestedTicket][0];
    $pmfbyMessage := $type(response.responseMessage) = "string" ? $trim(response.responseMessage);
    $refusalMessage := $pmfbyMessage ? $lookup($KNOWN_REFUSALS, $lowercase($pmfbyMessage));
    $isAccepted := $string(response.responseCode) = $PMFBY_SUCCESS_CODE;
    $isFound := $isAccepted and ($isText($record.ApplicationNo) or $isText($record.TicketStatus));
    $mappedStatus := $isText($record.TicketStatus) ? $lookup($CASE_STATUS_CODES, $lowercase($trim($record.TicketStatus)));
    $caseStatus := $exists($mappedStatus) ? $mappedStatus : $DEFAULT_CASE_STATUS;
    $requestYear := $asId($record.RequestYear);
    $cropYear := $requestYear and $contains($requestYear, $YEAR_PATTERN) ? $requestYear;
    $filedOn := $isText($record.InsertDateTime) and $contains($record.InsertDateTime, $RFC3339_PATTERN)
      ? $fromMillis($toMillis($record.InsertDateTime), $DATE_FORMAT, $IST_OFFSET);
    /* The officer's answer; "" until there is one. */
    $reply := $asText($isText($record.latestRemark) ? $trim($record.latestRemark));
    /* The complaint rides only with its description: the pack requires one,
       so a category on its own would be an answer the caller must refuse. */
    $description := $asText($record.GrievenceDescription);
    /* filedOn is required on an answer, and a date is not ours to invent. */
    $isComplete := $isFound and $exists($filedOn);

    /* Output */
    $isComplete
    ? {
      "context": $merge([beckn.context, { "action": "on_status", "timestamp": $now() }]),
      "message": {
        "contract": $merge([beckn.message.contract, {
          "commitments": [$merge([$commitment, {
            "status": { "descriptor": { "code": $COMMITMENT_STATUS_ACTIVE } },
            "commitmentAttributes": {
              "@context": $attributes.`@context`,
              "@type": $attributes.`@type`,
              "informationMode": $INFORMATION_MODE,
              "scheme": $SCHEME,
              "enrolmentId": $asText($record.ApplicationNo),
              "cropYear": $cropYear,
              "season": $lookup($SEASON_NAMES, $asId($record.RequestSeason)),
              "grievance": $exists($description) ? {
                "category": $omitIfEmpty({ "code": $asId($record.TicketCategoryID), "name": $asText($record.TicketCategoryName) }),
                "subCategory": $omitIfEmpty({ "code": $asId($record.TicketSubCategoryID), "name": $asText($record.TicketSubCategoryName) }),
                "description": $description
              },
              "case": {
                /* The record's own ticket, not the one asked for: the answer
                   reports what PMFBY returned, never what the caller said. */
                "ticketNo": $string($record.GrievenceSupportTicketNo),
                "status": { "code": $caseStatus },
                "filedOn": $filedOn,
                "reply": $reply,
                "cropName": $asText($record.CropName)
              }
            }
          }])]
        }])
      }
    }
    : $isFound ? $error($ERROR_UNAVAILABLE, $MSG_NO_FILING_DATE, $pmfbyMessage)
    : $isAccepted ? $error($ERROR_REFUSED, $MSG_NOT_FOUND)
    : $exists($refusalMessage) ? $error($ERROR_REFUSED, $refusalMessage, $pmfbyMessage)
    : $error($ERROR_UNAVAILABLE, $MSG_UNAVAILABLE, $pmfbyMessage)
  )
