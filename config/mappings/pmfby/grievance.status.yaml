# PMFBY, openagrinet:PMFBYGrievance, status -> POST /GetGrievenceTicketsStatus.
# Both directions, one file.
#
# Step three: read a filed grievance back. PMFBY matches the ticket to the phone
# it was filed from, so both are required.
#
# The response is an allow-list. PMFBY's record also carries the farmer's name,
# address and policy details; none of it is mapped.

required:
  - check: |
      (
        $ca := beckn.message.contract.commitments[0].commitmentAttributes;
        $exists($ca.applicantPhone) and $exists($ca.ticketNo)
      )
    message: "checking a grievance needs applicantPhone and ticketNo"
    code: SCH_REQUIRED_FIELD_MISSING

reject:
  - check: response.responseCode = 1
    message: "PMFBY did not return the grievance"
    code: NET_DOWNSTREAM_UNAVAILABLE
    status: 502

request: |
  (
    $ca := beckn.message.contract.commitments[0].commitmentAttributes;
    {
      "requestorMobileNo": $ca.applicantPhone,
      "GrievenceSupportTicketNo": $ca.ticketNo
    }
  )

# An unknown ticket is an ordinary answer with no grievance details, not an
# error: responseDynamic is empty and only the ticket number goes back.
response: |
  (
    $commitment := beckn.message.contract.commitments[0];
    $ca := $commitment.commitmentAttributes;
    $ticket := response.responseDynamic;
    {
      "context": $merge([beckn.context, { "action": "on_status", "timestamp": $now() }]),
      "message": {
        "contract": $merge([beckn.message.contract, {
          "commitments": [$merge([$commitment, {
            "status": { "descriptor": { "code": "ACTIVE" } },
            "commitmentAttributes": {
              "@context": $ca.`@context`,
              "@type": $ca.`@type`,
              "ticketNo": $ca.ticketNo,
              "caseStatus": $exists($ticket.TicketStatus)
                ? $uppercase($replace($ticket.TicketStatus, " ", "_")),
              "grievanceCategory": $exists($ticket.TicketCategoryID) ? {
                "code": $string($ticket.TicketCategoryID) & "." & $string($ticket.TicketSubCategoryID),
                "name": $ticket.TicketCategoryName & " / " & $ticket.TicketSubCategoryName
              },
              "grievanceDescription": $ticket.GrievenceDescription,
              "filedOn": $ticket.ComplaintDate,
              "officerReply": $ticket.latestRemark != "" ? $ticket.latestRemark,
              "source": "PMFBY"
            }
          }])]
        }])
      }
    }
  )
