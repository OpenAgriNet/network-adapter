# PMFBY status -> POST /krphapi/FGMS/GetGrievenceTicketsStatus.
# Reads a grievance back by ticket number and the phone it was filed from.
# The response maps an allow-list; the farmer's name, location and insurer
# are dropped. Field formats are the pack's.

request: |
  (
    $ca := beckn.message.contract.commitments[0].commitmentAttributes;
    $at := "$.message.contract.commitments[0].commitmentAttributes.";
    $missing := [
      { "field": "applicantPhone", "path": $at & "applicantPhone", "present": $exists($ca.applicantPhone) },
      { "field": "case.ticketNo", "path": $at & "case.ticketNo", "present": $exists($ca.case.ticketNo) }
    ][$not(present)][0];
    $missing
    ? { "_error": { "status": 400, "code": "SCH_REQUIRED_FIELD_MISSING",
                    "message": $missing.field & " is required", "path": $missing.path } }
    : {
      "requestorMobileNo": $ca.applicantPhone,
      "GrievenceSupportTicketNo": $ca.case.ticketNo
    }
  )

# The record is mapped; fields PMFBY leaves empty are dropped. No record, or
# one for another ticket, is a 400 "No record found"; a refusal is a 400 with
# PMFBY's own message; a reply with no reason is a 502.
response: |
  (
    /* [0] reads a bare record or a list of one alike. */
    $ticket := response.responseDynamic[0];
    $asked := $string(beckn.message.contract.commitments[0].commitmentAttributes.case.ticketNo);
    $said := $type(response.responseMessage) = "string" ? $trim(response.responseMessage);
    /* PMFBY sends null or "" for missing values. */
    $isText := function($v) { $type($v) = "string" and $v != "" };
    $ok := $string(response.responseCode) = "1";
    /* PMFBY reads by phone alone, so a record for another ticket is no record. */
    $found := $ok
      and ($isText($ticket.ApplicationNo) or $isText($ticket.TicketStatus))
      and $not($exists($ticket.GrievenceSupportTicketNo) and $string($ticket.GrievenceSupportTicketNo) != $asked);
    /* PMFBY's TicketStatus as a CaseStatusCode; a phrase not listed is UnderReview. */
    $statusOf := { "resolved": "Resolved" };
    $status := $isText($ticket.TicketStatus) ? $lookup($statusOf, $lowercase($trim($ticket.TicketStatus)));
    /* InsertDateTime is "YYYY-MM-DD HH:MM:SS" in IST. */
    $inserted := $ticket.InsertDateTime;
    $filedOn := $isText($inserted) and $contains($inserted, /^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$/)
      ? $fromMillis($toMillis($replace($inserted, " ", "T") & "+05:30"), "[Y0001]-[M01]-[D01]T[H01]:[m01]:[s01]Z");
    $found
    ? (
      $commitment := beckn.message.contract.commitments[0];
      $ca := $commitment.commitmentAttributes;
      {
        "context": $merge([beckn.context, { "action": "on_status", "timestamp": $now() }]),
        "message": {
          "contract": $merge([beckn.message.contract, {
            "commitments": [$merge([$commitment, {
              "status": { "descriptor": { "code": "ACTIVE" } },
              "commitmentAttributes": {
                "@context": $ca.`@context`,
                "@type": $ca.`@type`,
                "informationMode": "Direct",
                /* Stated, not echoed: the caller may send only the code. */
                "scheme": { "code": "PMFBY", "name": "Pradhan Mantri Fasal Bima Yojana" },
                "enrolmentId": $isText($ticket.ApplicationNo) ? $ticket.ApplicationNo,
                "grievance": {
                  "category": $isText($ticket.TicketCategoryName) ? { "name": $ticket.TicketCategoryName },
                  "subCategory": $isText($ticket.TicketSubCategoryName) ? { "name": $ticket.TicketSubCategoryName },
                  "description": $isText($ticket.GrievenceDescription) ? $ticket.GrievenceDescription
                },
                "case": {
                  "ticketNo": $ca.case.ticketNo,
                  "status": { "code": $exists($status) ? $status : "UnderReview" },
                  "filedOn": $filedOn,
                  "cropName": $isText($ticket.CropName) ? $ticket.CropName
                }
              }
            }])]
          }])
        }
      }
    )
    : $ok
    ? { "_error": { "status": 400, "code": "BIZ_GENERIC_ERROR", "message": "No record found" } }
    : $isText($said)
    ? { "_error": { "status": 400, "code": "BIZ_GENERIC_ERROR", "message": $said } }
    : { "_error": { "status": 502, "code": "NET_DOWNSTREAM_UNAVAILABLE",
                    "message": "PMFBY replied with neither a record nor a reason" } }
  )
