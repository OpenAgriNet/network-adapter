# PMFBY, openagrinet:PMFBYGrievance, confirm -> POST /AddKRPHNCIPGrievenceSupportTicket.
# Both directions, one file.
#
# Step two of three: file the grievance with the OTP init sent. The OTP goes to
# PMFBY and nowhere else -- it is never echoed back. The commitment becomes
# ACTIVE and carries the ticket number the farmer quotes on status.
#
# "Grievence" is PMFBY's spelling, kept where PMFBY reads it.

required:
  - check: |
      (
        $ca := beckn.message.contract.commitments[0].commitmentAttributes;
        $exists($ca.applicantPhone) and $exists($ca.otp) and $exists($ca.applicationNo)
          and $exists($ca.cropYear) and $exists($ca.season)
          and $exists($ca.grievanceCategory.code) and $exists($ca.grievanceDescription)
      )
    message: "filing a grievance needs applicantPhone, otp, applicationNo, cropYear, season, grievanceCategory.code and grievanceDescription"
    code: SCH_REQUIRED_FIELD_MISSING
  - check: |
      $exists($match(beckn.message.contract.commitments[0].commitmentAttributes.grievanceCategory.code, /^[0-9]+\.[0-9]+$/)[0])
    message: "grievanceCategory.code must be <category>.<subCategory>, e.g. 3.10"
  - check: |
      beckn.message.contract.commitments[0].commitmentAttributes.season in ["Kharif", "Rabi", "Zaid"]
    message: "season must be Kharif, Rabi or Zaid"

# Wrong OTP first: it is the farmer's to fix, so a 400. Any other refusal is
# PMFBY's, so a 502. Only a string message can name the OTP: an absent or null
# one reads as "not an OTP error" rather than failing the check.
reject:
  - check: |
      response.responseCode = 1
        or ($type(response.responseMessage) = "string" and $contains($lowercase(response.responseMessage), "otp")) = false
    message: "the OTP is wrong or has expired"
    code: BIZ_GENERIC_ERROR
    status: 400
  - check: response.responseCode = 1
    message: "PMFBY did not register the grievance"
    code: NET_DOWNSTREAM_UNAVAILABLE
    status: 502

request: |
  (
    $ca := beckn.message.contract.commitments[0].commitmentAttributes;
    $category := $split($ca.grievanceCategory.code, ".");
    $seasons := { "Kharif": 1, "Rabi": 2, "Zaid": 3 };
    /* PMFBY's fixed id for this channel as the source of the grievance. */
    $receiptSourceID := 134306;
    {
      "requestorMobileNo": $ca.applicantPhone,
      "otp": $ca.otp,
      "complaintDate": $now("[Y0001]-[M01]-[D01]", "+0530"),
      "receiptSourceID": $receiptSourceID,
      "ticketCategoryID": $number($category[0]),
      "ticketSubCategoryID": $number($category[1]),
      "requestYear": $string($ca.cropYear),
      "requestSeason": $lookup($seasons, $ca.season),
      "applicationNo": $ca.applicationNo,
      "grievenceDescription": $trim($ca.grievanceDescription)
    }
  )

# filedOn restates the IST date the request just sent; PMFBY echoes none.
response: |
  (
    $commitment := beckn.message.contract.commitments[0];
    $ca := $commitment.commitmentAttributes;
    {
      "context": $merge([beckn.context, { "action": "on_confirm", "timestamp": $now() }]),
      "message": {
        "contract": $merge([beckn.message.contract, {
          "commitments": [$merge([$commitment, {
            "status": { "descriptor": { "code": "ACTIVE" } },
            "commitmentAttributes": {
              "@context": $ca.`@context`,
              "@type": $ca.`@type`,
              "ticketNo": response.responseDynamic.GrievenceSupportTicketNo,
              "caseStatus": "REGISTERED",
              "filedOn": $now("[Y0001]-[M01]-[D01]", "+0530"),
              "source": "PMFBY"
            }
          }])]
        }])
      }
    }
  )
