# PMFBY, openagrinet:PMFBYGrievance, init -> POST /SendOTP. Both directions, one file.
#
# Step one of three: send an OTP to the farmer's phone. The commitment stays
# DRAFT; support carries the OTP back with the grievance itself.

# required holds format checks, which return SCH_INVALID_FORMAT and let an
# absent field pass. A missing field is refused by the request half under
# _error, which can name SCH_REQUIRED_FIELD_MISSING.
required:
  # Checked before the call: the reply masks the phone as text, so a number
  # would fail only after PMFBY had already sent the OTP.
  - check: |
      (
        $phone := beckn.message.contract.commitments[0].commitmentAttributes.applicantPhone;
        $not($exists($phone)) or $type($phone) = "string"
      )
    message: "commitmentAttributes.applicantPhone must be a string"

request: |
  (
    $phone := beckn.message.contract.commitments[0].commitmentAttributes.applicantPhone;
    $exists($phone)
      ? { "requestorMobileNo": $phone }
      : { "_error": { "status": 400, "code": "SCH_REQUIRED_FIELD_MISSING",
                      "message": "requesting an OTP needs commitmentAttributes.applicantPhone" } }
  )

# Built from the request alone: SendOTP's reply is not documented, so nothing
# is read from it, and expiresAt is left out until it is. The phone is masked
# rather than echoed: enough for the farmer to recognise which number, not
# enough to read it back.
response: |
  (
    $commitment := beckn.message.contract.commitments[0];
    $ca := $commitment.commitmentAttributes;
    $phone := $ca.applicantPhone;
    {
      "context": $merge([beckn.context, { "action": "on_init", "timestamp": $now() }]),
      "message": {
        "contract": $merge([beckn.message.contract, {
          "commitments": [$merge([$commitment, {
            "status": { "descriptor": { "code": "DRAFT", "name": "draft" } },
            "commitmentAttributes": {
              "@context": $ca.`@context`,
              "@type": $ca.`@type`,
              /* Still OnDemand: an OTP acknowledgement carries no case. */
              "informationMode": "OnDemand",
              "scheme": $ca.scheme,
              "otpChallenge": {
                "sentTo": $substring($phone, 0, 2) & "XXXXXX" & $substring($phone, -2)
              }
            }
          }])]
        }])
      }
    }
  )
