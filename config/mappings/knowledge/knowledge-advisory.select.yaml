# Knowledge advisory: a Beckn /select against the network's knowledge
# capability, answered from a provider's retrieval service.
#
# ONE FILE, BOTH DIRECTIONS, one Beckn action. The registry row for this
# capability names this URL, and the adapter fetches it verbatim -- so a
# deployment pointing at a different corpus points at its own copy of this
# file, and nothing about the provider is compiled in.
#
# Both halves read:
#   beckn     the inbound Beckn payload -- the context to echo, the topics to
#             search for, the resource the caller selected
# and the response half additionally reads:
#   response  the provider's answer, in its own shape
#
# The base URL, the path and the credentials are NOT here. The first two are
# the registry's ProviderSchema row; the credentials are environment variables
# named in the adapter config. No host appears in this file.

request: |
  /* Request half: an OnDemand KnowledgeAdvisory select -> POST /search.

     Only `query` is required upstream; every other SearchRequest field has a
     provider-side default, so nothing else is sent.

     The base URL and path are NOT here -- they live in the provider's registry
     ProviderSchema row, so moving the provider is a registry write and no file
     in this repo names a host. */
  (
    $ra := beckn.message.contract.commitments[0].resources[0].resourceAttributes;

    /* DEPLOYMENT CONSTANT. Which corpus this deployment searches. The registry
       row names this mapping file per deployment, so a different environment
       points at a mapping carrying its own index. Omit the key entirely to let
       the provider fall back to its persisted SearchSettings.indexName. */
    $indexName := "test_doc_pipeline";

    {
      "query":      $trim($join($ra.topics, " ")),
      "index_name": $indexName
    }
  )


# Response half derived from the OpenAgriNet non-normative implementation guide
# for this capability (knowledge-mapper/on_select.jsonata). Its derivation
# rules are followed; its INPUT SHAPE is not, because it reads a hand-built
# { search, pn } object and this adapter supplies { beckn, _local, response }.
#
# Divergences from the guide, each deliberate and marked at its site:
#   - one Resource PER DOCUMENT, not one for the top-scoring hit
#   - hits[].text IS the recommendation message; nothing here synthesizes
#   - no $assert: an empty result is an answer, not an error
#   - senderId/receiverId, not bapId/bppId, per the runtime Beckn spec
#   - `res:` id prefix, matching the other OAN capabilities
#   - Contract.consideration omitted; see the note at the emit block
response: |
  (
    $ra    := beckn.message.contract.commitments[0].resources[0].resourceAttributes;
    $ctx   := $ra.`@context`;
    $offer := beckn.message.contract.commitments[0].offer;
    $sel   := beckn.message.contract.commitments[0].resources[0].id;

    /* DEPLOYMENT CONSTANT, like index_name in the request half: the
       network-stable participant id of the authority behind this corpus.
       SourceReference.sourceId is required and retrieval cannot supply it.
       Two upstream fields look like candidates and are traps:
         hits[].instance  "bv"            provider-internal, collides across PNs
         hits[].source    "docs-pipeline" the ingestion pipeline, not the authority */
    $sourceId := "participant:bharat-vistaar";

    /* This API returns "" for absent strings -- doc_language, category_tags,
       title_en, doc_short_description and description are all "" on every hit
       in the live corpus. Treat "" and absent identically, or a blank ships as
       a present-but-empty value and fails minLength. */
    $text := function($s) { $exists($s) ? ($trim($s) != "" ? $trim($s)) : undefined };

    /* hits[].type -> subjectCategories enum. Only these have an unambiguous
       counterpart; "document" maps to NOTHING on purpose, because it names a
       container format rather than a subject. */
    $categoryOf := function($t) {
      $lookup({
        "scheme": "Scheme", "crop": "Crop", "livestock": "Livestock",
        "weather": "Weather", "market": "Market", "practice": "Practice"
      }, $lowercase($t))
    };

    /* Governed codes are upper-case; the corpus emits scheme_code as "tgj". */
    $toCode := function($s) { $uppercase($replace($s, /[^A-Za-z0-9]+/, "_")) };

    /* Every hit the provider returned, less its own reference chunks. It ran
       the query and chose what to send; applying a score floor here would be
       this adapter overriding the provider's relevance judgement. The guide
       argues for a floor (unrelated documents can land within 0.005 of the top
       hit) -- that is one $filter to reinstate if a deployment wants it. */
    $usable := $filter(response.hits, function($h) { $h.is_reference != true });

    /* ONE ADVISORY PER DOCUMENT. doc_id repeats: the engine returns up to
       max_chunks_per_doc chunks per document, and this corpus also indexes one
       chunk twice, as type "document" and again as type "scheme". */
    $docIds := $distinct($usable.doc_id);
    $hitsOf := function($id) { $filter($usable, function($h) { $h.doc_id = $id }) };

    /* Counts are whole-response facts, so the rationale reads the same on every
       advisory. It cites aggregate provenance only -- naming the index, the
       ranking method or its parameters would leak engine internals. */
    $counts := "Retrieved " & $string($count($usable)) & " of "
             & $string(response.candidate_count) & " candidate passages";

    {
      "context": $merge([ beckn.context, { "action": "on_select" } ]),
      "message": {
        "contract": {
          "status": { "code": "DRAFT" },
          /* Contract.consideration is NOT emitted. The guide recommends a
             priced quote, but its own caveat is the reason to leave it out:
             Beckn v2.0.0 never DEFINES beckn:PriceSpecification, so any
             considerationAttributes shape here is unverifiable. Contract
             requires only `commitments`, so omitting it is valid, and an
             advisory served at no charge is better said by saying nothing than
             by inventing a schema. */
          "commitments": [{
            "status": { "descriptor": { "code": "DRAFT", "name": "Draft" } },
            /* The offer is echoed; its references are rebuilt as the guide
               prescribes -- the OnDemand id the caller selected, RETAINED so it
               can correlate the callback, plus the Direct id minted per
               document. OnDemand and Direct require different fields, so the
               answer cannot restate the selected resource; the caller resolves
               that id against its own request, not against resources[] here.

               $distinct because a re-selected advisory would otherwise appear
               twice. With no hits this is just the selected id, and resources[]
               is [] -- the offer still names the question it was asked. */
            "offer": $merge([
              $offer,
              { "resourceIds": $distinct($append([$sel],
                  [$map($docIds, function($id) { "res:knowledge-advisory:" & $id })])) }
            ]),
            "resources": [$map($docIds, function($id) { (
              $h := $hitsOf($id);

              /* Per document, the metadata-bearing hit: the scheme-typed one if
                 this document has it, else the highest scoring. _score orders
                 only and is never emitted. Without the first clause a document
                 indexed both ways loses its scheme_name to an untyped chunk. */
              $sch := $h[$exists(scheme_code)];
              $top := $exists($sch) ? $sch[0] : ($h^(>`_score`))[0];

              /* doc_language, then the guide's "en" default. recommendations[]
                 requires language with minLength 2, so there is no honest empty
                 to fall back to -- the corpus leaves it blank on every hit. */
              $lang := $exists($text($top.doc_language)) ? $text($top.doc_language) : "en";

              /* category_tags is a COMMA-JOINED STRING, not an array, and is ""
                 throughout this corpus. Falling back to the query the engine
                 reports having run keeps topics sourced from the response
                 rather than echoed from the request. topics is required in
                 Direct mode with minItems 1. */
              $tags  := $distinct($h.category_tags[$ != ""].$split($, ",").$trim($)[$ != ""]);
              $query := $text(response.effective_config.query);
              $topics := $exists($tags) ? $tags : ($exists($query) ? [ $query ] : undefined);

              $cats := $distinct($h.$categoryOf(type));

              /* scheme_name, then the human titles, then name_en/name_gu LAST:
                 this corpus fills those with the ingestion filename slug
                 ("Praja-Palana-Application-Form"), which reads badly to a
                 farmer. Only this document's hits are consulted -- borrowing
                 another document's name is what made an earlier shape lie. */
              $label := $exists($text($top.scheme_name)) ? $text($top.scheme_name)
                      : $exists($text($top.title_en))    ? $text($top.title_en)
                      : $exists($text($top.title_gu))    ? $text($top.title_gu)
                      : $exists($text($top.name_en))     ? $text($top.name_en)
                      : $exists($text($top.name_gu))     ? $text($top.name_gu)
                      : undefined;

              {
                "id": "res:knowledge-advisory:" & $id,
                /* Required by Commitment.resources, which declares no quantity
                   property and carries no Quantity schema at all -- a defect
                   upstream. One resource is one advisory. */
                "quantity": 1,
                "descriptor": $merge([
                  {
                    "code": $exists($text($top.scheme_code))
                            ? $toCode($text($top.scheme_code)) & "_ADVISORY"
                            : "KNOWLEDGE_ADVISORY"
                  },
                  $exists($label)    ? { "name": $label & " advisory" } : {},
                  /* Blank on every hit here, so $text drops them both today. */
                  $exists($text($top.doc_short_description))
                    ? { "shortDesc": $text($top.doc_short_description) } : {},
                  $exists($text($top.doc_llm_description))
                    ? { "longDesc": $text($top.doc_llm_description) }
                    : ($exists($text($top.description))
                       ? { "longDesc": $text($top.description) } : {})
                ]),
                "resourceAttributes": $merge([
                  {
                    "@context": $ctx,
                    "@type": "openagrinet:KnowledgeAdvisory",
                    /* The discriminator. Its Direct branch is what makes
                       topics, issuedAt, recommendations and source required. */
                    "informationMode": "Direct",
                    "languages": [ $lang ],
                    /* Not in the search response: the advisory is issued by
                       this answer, at this moment. */
                    "issuedAt": $now(),
                    /* This document's passages, joined. The engine returns up
                       to max_chunks_per_doc of them and the same chunk can
                       arrive twice under two type labels, hence $distinct.

                       The guide holds that hits[].text is evidence and the
                       message must be synthesized upstream. Nothing in this
                       path synthesizes, and /search returns passages, so the
                       retrieved text IS the message here -- a deliberate
                       divergence, recorded rather than hidden. */
                    "recommendations": [{
                      "message": $join($distinct($h.text), "\n\n"),
                      "language": $lang
                    }],
                    /* This document only, as a resource IDENTIFIER rather than
                       the raw hash. doc_id never chunk_id: uniqueItems is true
                       and one document contributes several chunks. They resolve
                       only once those documents are themselves published as
                       KnowledgeResource resources, which today they are not. */
                    "supportingResourceIds": ["res:knowledge:" & $id],
                    "rationale": $exists($text($top.instance_name))
                      ? $counts & " from the " & $text($top.instance_name) & " corpus."
                      : $counts & ".",
                    "source": $merge([
                      { "sourceId": $sourceId },
                      /* This document's own instance, not the first across all
                         of them. */
                      $exists($text($top.instance_name))
                        ? { "sourceName": $text($top.instance_name) } : {}
                    ])
                  },
                  /* Optional, so emitted only when the corpus yields one. */
                  $exists($cats) ? { "subjectCategories": [ $cats ] } : {},
                  /* REQUIRED in Direct mode, yet category_tags is blank across
                     this corpus and effective_config.query is the only other
                     source. When neither speaks, the key is OMITTED rather than
                     emitted as [] -- an empty array asserts "this advisory has
                     no topics", where absence says nothing was available to
                     say. Both fail the pack; only one of them is honest, and
                     the absence is what makes the gap visible. */
                  $exists($topics) ? { "topics": [ $topics ] } : {}
                  /* agricultureSubjects is deliberately absent even though
                     scheme_code and scheme_name are real data here:
                     AgricultureSubjectReference requires subjectId, a taxonomy
                     URI retrieval does not supply. Emitting the array without
                     it would be invalid; inventing a base URI would be a guess.
                     coverageAreas is absent for the same reason -- it has no
                     counterpart in the response, and deriving it from a
                     scheme's name ("Telangana" -> IN-TG) is guesswork. */
                ])
              }
            ) })]
          }]
        }
      }
    }
  )
