# The BAP caller signs an outbound request and forwards it to the BPP's
# subscriber_url. In a real network that URL comes from the registry; here it is
# the receiver module in this same process.
#
# No `domain` key: at version 2.x the router normalizes domain to "*" on both
# sides (router.go:100-105, 249-252), so it would be ignored and only warn.
routingRules:
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:8082/weather/receiver"
    endpoints:
      - search
      - select
      - init
      - confirm
      - status
      - cancel
