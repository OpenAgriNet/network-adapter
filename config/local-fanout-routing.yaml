# Sample fan-out routing config (v2). See [#22] -- the consumer adapter's
# discover reaches several networks at once, and their answers are merged
# into one response.
#
# `target.urls` (plural) instead of `target.url` is the switch: naming more
# than one target turns this into a fan-out rule. Every target is called in
# parallel; a target that fails, answers non-2xx, or misses the handler's
# fanout timeout is counted in the X-Beckn-Degraded response header and the
# rest still answer -- only a total failure is a NACK.
#
# `mergeFieldPath` is the full dot path, from the envelope root, to the array
# the fan-out merges across targets. It is required whenever target.urls
# names more than one target, and must start with "message." (or be exactly
# "message") -- both checked at load time. What is NOT checked: giving a
# fan-out rule several endpoints applies that one path to all of them, which
# is wrong the moment they nest their array at different depths (discover's
# is message.catalogs, select's is message.contract.commitments). So an
# action needing a different path gets its own rule below -- one endpoint per
# fan-out rule is a convention this file follows, not something the loader
# enforces.
routingRules:
  - version: "2.0.0"
    targetType: "url"
    target:
      urls:
        - "http://network-adapter-bharat-vistar:9201"
        - "http://network-adapter-maha-vistar:9201"
    mergeFieldPath: message.catalogs
    endpoints:
      - discover

  # select nests its array elsewhere (message.contract.commitments), so it
  # is its own fan-out rule rather than sharing discover's above.
  - version: "2.0.0"
    targetType: "url"
    target:
      urls:
        - "http://network-adapter-bharat-vistar:9201"
        - "http://network-adapter-maha-vistar:9201"
    mergeFieldPath: message.contract.commitments
    endpoints:
      - select

  # Everything else -- no fan-out, single target.
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://provider-adapter:9200"
    endpoints:
      - init
      - confirm
      - status
