# network-adapter
#
# The network layer. Verifies the caller's signature, then hands discovery to
# the discovery service and re-signs as itself on the way out.
appName: "network-adapter"

log:
  level: debug
  destinations:
    - type: stdout
  contextKeys: [transaction_id, message_id, subscriber_id, module_id]

http:
  port: 9201
  timeout:
    read: 30
    write: 30
    idle: 30

pluginManager:
  root: ./plugins

# ---------------------------------------------------------------------------
# OpenTelemetry. An application-level plugin rather than a module one: it runs
# its own background lifecycle -- an exporter and a periodic flush -- instead
# of being loaded per request by a step.
#
# It ships metrics, traces and logs over OTLP/gRPC to the collector named
# below. In this stack that is ClickStack, on the observability profile, which
# `make up` starts as step 5 and `make up-core` deliberately does not.
#
# WHICH IS WHY THE ENABLE FLAGS ARE A SWITCH. With all three false the plugin
# builds no exporter at all and returns a no-op provider -- it does not dial,
# so it cannot log a connection failure every few seconds. Point a stack with
# no collector at one and that is exactly what you get, so ADAPTER_OTEL_ENABLED=false
# is the right setting for `make up-core`.
#
# serviceVersion is deliberately absent: left empty the plugin fills in the
# adapter's own build version, which is truer than anything written here and
# does not go stale.
#
# Not set, and worth knowing they exist:
#   auditFieldsConfig  a YAML file of masking rules and field selection for
#                      audit logs -- payloads are emitted whole without it.
#   networkMetricsGranularity / networkMetricsFrequency
#                      network-level metric windows.
#   timeInterval       metric export period in seconds; defaults to 5.
plugins:
  otelsetup:
    id: otelsetup
    config:
      serviceName: "network-adapter"
      environment: "dev"
      otlpEndpoint: "hyperdx:4317"
      enableMetrics: "true"
      enableTracing: "true"
      enableLogs: "true"

  # -------------------------------------------------------------------------
  # Catalog crawler: a background job started once at process startup, not a
  # per-request plugin. Here it runs the scheduled PUBLISH SWEEP.
  #
  # Each tick it lists every ProviderSchema binding in the registry, and runs
  # every one whose actions include `publish`, using that action's `mappings`
  # as the pipeline path -- today agmarknet-live|MandiPrice and
  # mausamgram|WeatherObservation. There is no list here and no filter: a
  # capability publishes by having a pipeline folder under
  # pkg/plugin/implementation/<Capability>/cataloguepublish-<source>/ (built
  # into the image) and a publish action naming it in the registry.
  #
  # This registry is the crawler's OWN, separate from the module's below. It
  # must be sunbirdRegistry: the sweep needs it to list bindings and resolve
  # each, and the crawler refuses to start otherwise.
  registry:
    id: sunbirdRegistry
    config:
      url: http://sunbird-registry-service:8081/api/v1
      entity: Participant
      providerEntity: ProviderSchema

  crawler:
    id: catalogcrawler
    config:
      # REQUIRED. The crawler's own Postgres: the run log lives here, and it
      # is what stops a restart republishing a day already published. Its
      # tables are migrated on startup.
      dbDsn: "postgres://crawler:crawler@crawler-db:5432/catalogcrawler?sslmode=disable"

      # REQUIRED. The provider adapter's /publish endpoint: every catalogue
      # this crawler sends goes here -- crawled ones (the sink) and the
      # scheduled publish pipelines alike, which are handed its base (this URL
      # without /publish). One address; it overrides any pipeline's own
      # publishUrl input.
      discoveryPushUrl: "http://provider-adapter:9200/publish"

      # --- the scheduled publish sweep ---

      # "true" turns the registry sweep on.
      publishPipelines: "true"

      # How often to CHECK whether each pipeline is due -- not how often one
      # runs. The cadence lives in each pipeline's YAML as a cron expression
      # (mandi 00:00 IST, weather 01:00 IST). Default 300s.
      publishTickIntervalSeconds: "300"

      # Reaching the network is a SEPARATE decision, off by default. Left
      # false, each run still builds catalogues and does not send them.
      publishEnabled: "false"

      # Optional. Keeps each run's catalogues on disk for inspection, one
      # subdirectory per capability; empty means a temporary directory.
      # publishCatalogOutputDir: "/var/lib/oan/catalogs"

      # Each pipeline reads its inputs from the ENVIRONMENT of this
      # container, not from this file:
      #   mandi    SUNBIRD_REGISTRY_URL, MANDI_API_URI, MANDI_TOKEN_USER,
      #            MANDI_TOKEN_SECRET, MANDI_PARTICIPANT_ID
      #   weather  nothing else (no upstream, no credentials); optional
      #            WEATHER_PARTICIPANT_ID, APP_NETWORK_ID

modules:
  - name: network-adapter
    # A subtree: every action lands here and the payload says which one it is.
    path: /
    handler:
      type: std
      # bpp because this adapter RECEIVES rather than originates. The role
      # decides which declared identity validateSign would compare a signer
      # against -- but no payload here declares one, so that check is skipped
      # and what is verified is the signature itself, against the key the
      # registry publishes for whoever signed.
      role: bpp
      subscriberId: network.oan.dev

      plugins:
        registry:
          id: sunbirdRegistry
          config:
            url: http://sunbird-registry-service:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema

        keyManager:
          id: simplekeymanager
          config:
            subscriberId: network.oan.dev
            # The KEY's osid, not a friendly name: that is what the registry
            # indexes keys by, and what a verifier looks up.
            keyId: 1-fb48ad18-aa53-48f8-a45c-234287283127
            signingPrivateKey: "FRpkzcTYHoJScSIUgp+u6VY3QJOkkuQ+9icIx04BLz0="
            signingPublicKey: "6XI2LGTCqe1VKtM2+zW9EIe83Iiuefwwibui6b/i2JU="
            encrPrivateKey: "mMP4caKjt7YwP3OZzGRtkcH3/vCzTeb7CiOvU2am8mw="
            encrPublicKey: "hCFC4cXpOro3Vcc2gSHgKR09n4Iah0xGBdAyMmopyhM="

        signer:
          id: signer
        signValidator:
          id: signvalidator

        # Base Beckn v2 schema validation, against the pinned LTS spec. The
        # extended layer is off: it fetches a resource's own @context and
        # validates against that, which is a network call per payload and a
        # second failure mode, and nothing here needs it yet. The allowed
        # domains and cache settings below only take effect if it is turned on.
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            extendedSchema_enabled: "false"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"

        router:
          id: router
          config:
            routingConfig: /app/config/routing-network.yaml

      # SIGNING AND SIGNATURE VALIDATION ARE OFF in this deployment.
      #
      # validateSign and sign/signAck are absent from the list below. Nothing
      # verifies who a caller is, and nothing this answers or forwards carries
      # a signature -- so every tier accepts unsigned traffic and anything that
      # can reach the port is served.
      #
      # validateSchema STAYS. Payload shape is still enforced; only identity is
      # not.
      #
      # The signer, signValidator and keyManager plugins above are still
      # declared. A plugin no steps: list names is loaded and never runs, so
      # turning this back on is adding the step names back here -- and it has
      # to be done on BOTH SIDES of a hop at once: a signed request into a tier
      # that no longer validates is fine, but an unsigned one into a tier that
      # does is rejected.
      steps:
        - addRoute
