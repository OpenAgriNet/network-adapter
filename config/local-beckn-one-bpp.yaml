appName: "onix-local"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transaction_id
    - message_id
    - subscriber_id
    - module_id
http:
  port: 8082
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: ./plugins
# OpenTelemetry (OTLP) - metrics and traces sent to OTEL collector, then to Loki/backend
plugins:
  otelsetup:
    id: otelsetup
    config:
      serviceName: "beckn-one-bpp"
      serviceVersion: "1.0.0"
      environment: "development"
      domain: "ev_charging"
      otlpEndpoint: "otel-collector-bpp:4317"
      enableMetrics: "true"
      networkMetricsGranularity: "2min"
      networkMetricsFrequency: "4min"
      enableTracing: "true"
      enableLogs: "true"
      timeInterval: "5"
      auditFieldsConfig: "/app/config/audit-fields.yaml" # this can be git url
      cacheTTL: "3600"
  # Catalog crawler: a background job (see
  # pkg/plugin/implementation/catalogcrawler/README.md), not a per-module
  # plugin -- started once at process startup, independent of any request
  # path. registry/cache here are the crawler's own key-distribution/lookup
  # dependencies, separate from any module's own plugins.registry below.
  # Uncomment and fill in dbDsn/discoveryPushUrl to enable it; the modules.
  # crawl handler below is a no-op unless this is configured.
  # registry:
  #   id: dediregistry
  #   config:
  #     timeout: 10
  #     retry_max: 3
  #     retry_wait_min: 100ms
  #     retry_wait_max: 500ms
  # cache:
  #   id: cache
  #   config:
  #     addr: redis:6379
  # crawler:
  #   id: catalogcrawler
  #   config:
  #     dbDsn: "postgres://user:pass@localhost:5432/catalogcrawler"
  #     networks: "example.network.production"
  #     discoveryPushUrl: "https://discovery.example.org/beckn/catalog/push"
  #     participantId: "bpp.example.org"
  #     bppUri: "https://bpp.example.org"

  # --- Mandi variant of the block above (see dev_docs/plan-crawler-mandi/) ---
  #
  # Differs from the generic example in two ways, both load-bearing:
  #
  # 1. registry is sunbirdRegistry, not dediregistry -- matching
  #    config/provider-adapter.yaml, the config that already serves
  #    openagrinet:MandiPrice today. sunbirdRegistry does NOT implement
  #    RegistryMetadataLookup (verified: no QueryByNetwork on it), and
  #    catalogcrawler.go refuses to start if `networks` is set without a
  #    registry that implements it. So `networks` is left OUT here on
  #    purpose -- staticIndexUrls is the only discovery mode SunbirdRC
  #    deployments can use with this crawler today.
  #
  # 2. There is deliberately NO publish-target key here for mandi. The mandi
  #    catalogue is BUILT locally by the pipeline and published by the
  #    pipeline's own `publish:` block, straight to the provider-adapter
  #    (MANDI_PUBLISH_URL=http://localhost:9200 in .env, container
  #    `provider-adapter`, which signs and forwards to discovery). It never
  #    passes through the crawler's sink -- verified: the crawler's sink is
  #    handed once to crawlmanager.Params (catalogcrawler.go:157) and the
  #    Crawler interface has no entry point to submit a locally-generated
  #    catalogue. discoveryPushUrl below serves the CRAWL path only, which
  #    this plan leaves untouched.
  #    (A separate, unrelated piece of work adds a second sink to the crawl
  #    path -- docs/superpowers/plans/2026-09-18-crawler-publish-sink.md.
  #    That is not part of the mandi path and is not configured here.)
  #
  # 3. pipeline.<capability> keys are added -- also NOT YET IMPLEMENTED.
  #    This is where "know the capability, then find its YAML" lives: one
  #    key per capability this deployment publishes, valued with the path
  #    to the pipeline YAML that serves it. The crawler's plugin config is
  #    a map[string]string, so an arbitrary key name per capability is
  #    natively supported -- one readable line each, no comma-packing.
  #
  #    The polling layer then, per key:
  #      1. load the YAML at that path
  #      2. check its metadata.capability MATCHES the config key (a
  #         mismatch is an Integrity error -- config and pipeline must
  #         agree, neither silently wins)
  #      3. check the registry confirms this participantId is actually
  #         bound to that capability (see the Registry Gate in
  #         plan-2-low-level-design.md) -- an unregistered capability is
  #         refused, not run
  #      4. run it on its OWN schedule.at, from its own YAML
  #
  #    Adding capability #2, #3, ... N: one more pipeline.* line here, plus
  #    the folder it points at. No existing pipeline's YAML is touched.
  #
  # registry:
  #   id: sunbirdRegistry
  #   config:
  #     url: http://registry:8081/api/v1
  #     entity: Participant
  #     providerEntity: ProviderSchema
  #     timeout: 2
  #     retry_max: 1
  #     retry_wait_min: 100ms
  #     retry_wait_max: 500ms
  # cache:
  #   id: cache
  #   config:
  #     addr: redis:6379
  # crawler:
  #   id: catalogcrawler
  #   config:
  #     dbDsn: "postgres://user:pass@localhost:5432/catalogcrawler"
  #     staticIndexUrls: "https://mandi.example.org/catalog/index/becknCatalogs.index.json"
  #     discoveryPushUrl: "https://discovery.example.org/beckn/catalog/publish"  # crawl path only
  #     participantId: "agmarknet"
  #     bppUri: "https://bpp.example.org"
  #
  #     # One key per capability. Key = the capability code, value = path to
  #     # the pipeline YAML serving it. NEW, not yet implemented.
  #     pipeline.openagrinet:MandiPrice: "MandiPrice/cataloguepublish-agmarket/mandi-price-agmarket.yaml"
  #
  #     # Adding a second capability is one more line like the above, plus
  #     # the folder it points at:
  #     # pipeline.openagrinet:WeatherObservation: "WeatherObservation/cataloguepublish-mausamgram/weather-observation-mausamgram.yaml"
modules:
  - name: bppTxnReceiver
    path: /bpp/receiver/
    handler:
      type: std
      role: bpp
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: bpp.example.com
            keyId: 76EU7ofwRCF1aobQkShARrf1PAUsNpHqWUJoynPu9w45YFKmzqaPmy
            signingPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            signingPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
            encrPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            encrPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
        cache:
          id: cache
          config:
            addr: redis:6379
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            maxBodyBytes: "1048576"
            storeBody: "true"
            storeSignature: "true"
            compress: "true"
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "beckn.org,example.com,  raw.githubusercontent.com"
        signValidator:
          id: signvalidator
        signer:
          id: signer
        router:
          id: router
          config:
            routingConfig: ./config/local-beckn-one-routing-BPPReceiver.yaml
        checkPolicy:
          id: opapolicychecker
          config:
            networkPolicyConfig: ./config/opa-network-policies.yaml
            refreshInterval: "5m"
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bpp
      steps:
        - validateSign
        - checkPolicy
        - validateSchema
        - addRoute
        - storePayload
        - signAck
  
  - name: bppTxnCaller
    path: /bpp/caller/
    handler:
      type: std
      role: bpp
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: bpp.example.com
            keyId: 76EU7ofwRCF1aobQkShARrf1PAUsNpHqWUJoynPu9w45YFKmzqaPmy
            signingPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            signingPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
            encrPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            encrPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
        cache:
          id: cache
          config:
            addr: redis:6379
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            maxBodyBytes: "1048576"
            storeBody: "true"
            storeSignature: "true"
            compress: "true"
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "beckn.org,example.com,raw.githubusercontent.com"
        router:
          id: router
          config:
            routingConfig: ./config/local-beckn-one-routing-BPPCaller.yaml
        signer:
          id: signer
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bpp
        checkPolicy:
          id: opapolicychecker
          config:
            networkPolicyConfig: ./config/opa-network-policies.yaml
            refreshInterval: "5m"
      steps:
        - checkPolicy
        - addRoute
        - sign
        - validateSchema
        - storePayload
        - validateAckSign

  # catalog/publish: DS-internal trigger (see
  # pkg/plugin/implementation/catalogpublisher/README.md). Unsigned,
  # same-operator call -- no validateSign/addRoute/signAck; the handler
  # calls CatalogPublisher.Publish and writes the result under outputRoot.
  - name: catalogPublish
    path: /catalog/publish
    handler:
      type: catalogPublish
      role: bpp
      # outputRoot is no longer read by this handler (storage now comes
      # from plugins.catalogBlobStore below) -- left set here, harmlessly,
      # for backward-compat with older config expectations.
      outputRoot: /catalog
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        # registry+cache exist only to satisfy keyManager's constructor
        # (KeyManagerProvider.New always requires a RegistryLookup); the
        # publisher itself never calls either.
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        cache:
          id: cache
          config:
            addr: redis:6379
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: bpp.example.com
            keyId: 76EU7ofwRCF1aobQkShARrf1PAUsNpHqWUJoynPu9w45YFKmzqaPmy
            signingPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            signingPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
            encrPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            encrPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
        # catalogBlobStore: where the catalogPublisher plugin itself now
        # reads prior state from and persists publish results to (moved out
        # of the handler's own outputRoot -- see outputRoot's comment
        # above, kept only for backward-compat YAML parsing). Same path
        # outputRoot pointed to (/catalog) so this deployment's behavior is
        # unchanged.
        catalogBlobStore:
          id: localcatalogblobstore
          config:
            root: /catalog
        catalogPublisher:
          id: catalogpublisher
          config:
            # No subscriberId here -- the handler derives it automatically
            # from keyManager.config.subscriberId above (the single source
            # of truth for which keyset gets loaded). Set it explicitly
            # here only if it must legitimately differ from keyManager's.
            nextUpdateIn: "336h"
            # catalogBaseURL: the one public URL prefix outputRoot (/catalog
            # above) is served under -- e.g. an ngrok tunnel onto that
            # directory. Index/catalog file URLs are addressed under this
            # base ({catalogBaseURL}/index/... and
            # {catalogBaseURL}/catalogs/...). Left unset here; a
            # "pending-artifact-store://..." placeholder is used until you
            # point it at a real public location.
            # catalogBaseURL: "https://your-tunnel.ngrok-free.app"
            # checkCatalogIndexLink: read-only, warn-only check (via
            # dediregistry, addressed by keyManager.config.subscriberId +
            # the keyId that keyset resolves to) whether this node's DeDi
            # registry record already links this publisher's catalog index
            # via meta.catalog_index_url. Getting that value onto the
            # record is a manual step via your own DeDi registration
            # tooling; this only warns, never pushes it automatically.
            checkCatalogIndexLink: "true"
        # Validates submitted catalogs before they're published: the
        # request body matches beckn.yaml's real CatalogPublishAction
        # envelope (context/message.catalogs[]/message.publishDirectives[]),
        # so this validates for real against catalog/publish's actual
        # schema. No type/location set, so it resolves the canonical
        # protocol-specifications-v2 beckn.yaml via becknConstants.
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"

  # crawl: the whole /crawl/* endpoint family (see
  # pkg/plugin/implementation/catalogcrawler/README.md) as one module, one
  # handler type -- /crawl/trigger and /crawl/status are sub-routed
  # internally (catalogcrawler.NewHandler), not registered as separate
  # handler types/module blocks. Both operate on the single running
  # Crawler instance configured under the top-level plugins.crawler above,
  # so this module takes no plugins of its own and is a no-op until that's
  # configured and running.
  #
  # /crawl/trigger: DS-internal on-demand trigger. Unsigned, same-operator
  # call -- no validateSign/addRoute/signAck. Request body is {networkId}
  # or {networkIds: [...]}; 202s with a runId once the pass is queued.
  #
  # /crawl/status: crawl/sync status query. Eventually a signed,
  # network-facing call answering a specific authenticated publisher about
  # their own data -- NOT YET IMPLEMENTED. authDisabled: true is required
  # for this sub-endpoint to serve requests at all right now; it accepts
  # subscriberId/catalogId as plain, UNAUTHENTICATED query params instead
  # of a verified Authorization header. Remove authDisabled (or set it
  # false) once signed verification lands -- do not run this in any real
  # deployment as-is; /crawl/trigger is unaffected either way.
  - name: crawl
    path: /crawl/
    handler:
      type: catalogCrawl
      authDisabled: true
